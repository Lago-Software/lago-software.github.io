<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEF3F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Lago · Écran TV</title>
<style>
@font-face{font-family:'Lago Display';font-weight:600 800;font-style:normal;font-display:swap;src:url(fonts/display-700.woff) format('woff')}
@font-face{font-family:'Lago Sans';font-weight:400 500;font-style:normal;font-display:swap;src:url(fonts/body-400.woff) format('woff')}
@font-face{font-family:'Lago Sans';font-weight:600 800;font-style:normal;font-display:swap;src:url(fonts/body-700.woff) format('woff')}
:root{--b:#31ACF0;--bt:#1E7DB8;--a:#F76300;--ok:#12995A;--bad:#D6342C;
  --bg:#EEF3F9;--card:#FFFFFF;--ink:#0A1F4D;--mut:#5A6785;--line:#DDE5F0;--soft:#F3F6FB;
  --sh:0 1px 2px rgba(10,31,77,.05),0 1.2rem 2.8rem -1.5rem rgba(10,31,77,.28);
  --fd:'Lago Display','Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --fb:'Lago Sans','Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:clamp(10px,min(1.04vw,1.85vh),46px)}
.th-dark{--bt:#7CCBF5;--bg:#071633;--card:#0F2148;--ink:#F3F7FF;--mut:#A5B6D8;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.05);
  --sh:0 0 0 1px rgba(255,255,255,.06),0 1.5rem 3.6rem -1.8rem rgba(0,0,0,.65)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;cursor:default}
body.th-light{background:radial-gradient(110% 80% at 0% 0%,rgba(49,172,240,.13),rgba(49,172,240,0) 55%),radial-gradient(90% 80% at 100% 100%,rgba(247,99,0,.10),rgba(247,99,0,0) 60%),var(--bg)}
body.th-dark{background:radial-gradient(110% 80% at 0% 0%,rgba(49,172,240,.20),rgba(49,172,240,0) 55%),radial-gradient(90% 80% at 100% 100%,rgba(247,99,0,.16),rgba(247,99,0,0) 60%),var(--bg)}
body.hidecur{cursor:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- écran principal (v92 : bandeau du haut, anneaux de progression, bracelets en pastilles) ---------- */
#bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform}
#bg .b1{left:-28vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(49,172,240,.22),rgba(49,172,240,0));animation:drift1 40s ease-in-out infinite alternate}
#bg .b2{right:-30vmax;bottom:-38vmax;background:radial-gradient(closest-side,rgba(247,99,0,.17),rgba(247,99,0,0));animation:drift2 52s ease-in-out infinite alternate}
.th-dark #bg .b1{background:radial-gradient(closest-side,rgba(49,172,240,.30),rgba(49,172,240,0))}
.th-dark #bg .b2{background:radial-gradient(closest-side,rgba(247,99,0,.22),rgba(247,99,0,0))}
@keyframes drift1{to{transform:translate(20vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-18vmax,-12vmax) scale(1.1)}}
#tv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "up lv dn" "tk tk tk";gap:1.1rem;padding:1.15rem 1.3rem 1.3rem}
#tv.notk{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "up lv dn"}
.ctop{grid-area:top}.cup{grid-area:up}.clv{grid-area:lv}.cdn{grid-area:dn}.tick{grid-area:tk}
.col{display:flex;flex-direction:column;gap:1.1rem;min-height:0;min-width:0}
.card{background:var(--card);border-radius:1.7rem;box-shadow:var(--sh);padding:1.4rem 1.6rem;min-height:0;min-width:0;position:relative;overflow:hidden}
.grow{flex:1 1 0}

/* bandeau du haut : logo, affluence, horloge */
.ctop{display:flex;align-items:center;gap:1.8rem;padding:.9rem 1.6rem;border-radius:1.6rem;min-height:6.4rem}
.brand{display:flex;align-items:center;gap:1rem;min-width:0;flex:1 1 auto}
.lgo{display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:0}
.lgo img{display:block;height:4.6rem;width:auto;max-width:24rem;object-fit:contain;object-position:left center}
.lgo.pw,.lgo.pn{padding:.5rem .85rem;border-radius:1rem}
.lgo.pw{background:#fff;box-shadow:0 .5rem 1.2rem -.8rem rgba(0,0,0,.6)}
.lgo.pn{background:#0A1F4D}
.lgo.bx img{border-radius:.8rem}
.lgo.big img{height:11rem;max-width:36rem;object-position:center}
.lgo.big.pw,.lgo.big.pn{padding:1.3rem 2rem;border-radius:1.8rem}
.lgo.big.bx img{border-radius:1.4rem}
.brand .lgo+.nm{font-size:2rem}
.brand .nm{font-family:var(--fd);font-weight:800;font-size:2.3rem;line-height:1.05;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ{flex:none;display:flex;flex-direction:column;gap:.5rem;min-width:18rem}
.occ .l{display:flex;align-items:baseline;gap:.45rem;font-size:1.2rem;color:var(--mut);font-weight:600;white-space:nowrap}
.occ .l b{font-family:var(--fd);font-weight:800;font-size:2.1rem;color:var(--ink);letter-spacing:-.01em}
.meter{height:.8rem;border-radius:999px;background:var(--soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3DD68C,#12995A);transition:width .8s ease}
.meter.mid i{background:linear-gradient(90deg,#FFB547,#F76300)}
.meter.hi i{background:linear-gradient(90deg,#FF7A6E,#D6342C)}
.clk{flex:none;display:flex;align-items:center;gap:1.1rem;padding-left:1.8rem;border-left:.12rem solid var(--line)}
.hm{font-family:var(--fd);font-weight:800;font-size:4.7rem;line-height:.9;letter-spacing:-.035em;white-space:nowrap}
.hm i{font-style:normal;font-size:1.7rem;color:var(--mut);letter-spacing:0;margin-left:.15rem;vertical-align:.4em}
.dt{font-size:1.3rem;color:var(--mut);line-height:1.3;white-space:nowrap}
.dt .by{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;font-size:.9rem;opacity:.7}
.dt .by img{height:1.1rem;display:block}
.st{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 .28rem rgba(18,153,90,.16);margin-right:.5rem;vertical-align:.08em}
.st.warn{background:#E9A100;box-shadow:0 0 0 .28rem rgba(233,161,0,.18)}
.st.off{background:var(--bad);box-shadow:0 0 0 .28rem rgba(214,52,44,.18)}

/* titres de carte */
h2.t{margin:0 0 1.1rem;font-family:var(--fd);font-weight:800;font-size:1.9rem;line-height:1.1;letter-spacing:-.01em;display:flex;align-items:center;gap:.75rem;min-width:0}
h2.t>span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.t .ic{flex:none;width:2.7rem;height:2.7rem;border-radius:.9rem;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#5CC3F7,#1E8FD6);box-shadow:0 .6rem 1.2rem -.7rem rgba(30,143,214,.9)}
h2.t .ic svg{width:1.55rem;height:1.55rem}
h2.t .ic.o{background:linear-gradient(140deg,#FF9A3D,#F76300);box-shadow:0 .6rem 1.2rem -.7rem rgba(247,99,0,.9)}
h2.t .ic.r{background:linear-gradient(140deg,#FF7A6E,#D6342C);box-shadow:0 .6rem 1.2rem -.7rem rgba(214,52,44,.9)}
h2.t .ic.g{background:linear-gradient(140deg,#94A3BF,#5A6785);box-shadow:none}
h2.t .tot{margin-left:auto;flex:none;font-family:var(--fb);font-weight:700;font-size:1.35rem;color:var(--mut);display:flex;align-items:center;gap:.35rem}
.ico{width:1.2em;height:1.2em;flex:none}

/* rangées « en piste » : anneau = temps restant (tailles en em : l'ensemble grandit quand il y a peu de couleurs) */
.rows{display:flex;flex-direction:column;gap:.85em;font-size:calc(1rem * var(--rs,1))}
.rows.few{gap:1.1em}
.row{position:relative;display:flex;align-items:center;gap:1.2em;padding:.95em 1.4em .95em 1em;border-radius:1.5em;background:var(--tint);min-width:0}
.rows.few .row{padding:1.4em 1.6em 1.4em 1.3em}
.ring{flex:none;width:5.5em;height:5.5em;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p,1) * 360deg),var(--trk) 0)}
.dot{flex:none;border-radius:50%;background:var(--c);color:var(--ci);display:flex;align-items:center;justify-content:center}
.dot svg{display:none}
.ring .dot{width:4.25em;height:4.25em;box-shadow:0 0 0 .3em var(--card),inset 0 0 0 .28em rgba(255,255,255,.28)}
.ring .dot svg{width:2.1em;height:2.1em}
.ring .dot.tm{font-family:var(--fd);font-weight:800;font-size:1.15em;width:3.7em;height:3.7em;letter-spacing:-.02em}
.lb{flex:1 1 8em;min-width:0}
.lb b{display:block;font-family:var(--fd);font-weight:800;line-height:1.05;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb small .q{display:inline-flex;align-items:center;gap:.25em;margin-left:.7em;font-weight:700;vertical-align:-.12em}
.row .lb b{font-size:2.6em}
.row .lb small{font-size:1.3em;margin-top:.25em}
.cd{flex:none;font-family:var(--fd);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap;text-align:right}
.row .cd{font-size:3.5em}
.cd em{display:block;font-family:var(--fb);font-style:normal;font-weight:700;font-size:.3em;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:.3em}
.row.hot{background:var(--tint2);animation:glow 1.6s ease-in-out infinite}
.row.hot .ring{width:6.1em;height:6.1em}
.row.hot .ring .dot{width:4.7em;height:4.7em}
.row.hot .ring .dot.tm{width:4.1em;height:4.1em}
.row.hot .dot svg{display:block;animation:wave 2s ease-in-out infinite;transform-origin:50% 60%}
.row.hot .lb small{color:var(--ink);font-weight:800}
.row.hot .cd{font-size:4.3em;color:var(--cdk)}
.row.hot .cd span{animation:pulse 1.5s ease-in-out infinite}
.row.hot .cd em{color:var(--cdk)}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 .2rem var(--c),0 0 0 0 rgba(var(--cr),0)}50%{box-shadow:inset 0 0 0 .2rem var(--c),0 0 2.4rem .3rem rgba(var(--cr),.38)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes wave{0%,62%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(16deg)}20%,40%{transform:rotate(-7deg)}}
.nw{animation:pop .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(.9rem) scale(.97)}to{opacity:1;transform:none}}

/* bracelets en pastilles (comme un vrai bracelet) */
.band{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-width:6.6rem;height:2.6rem;padding:0 1rem;border-radius:.85rem;background:var(--c);color:var(--ci);font-family:var(--fd);font-weight:800;font-size:1.2rem;letter-spacing:.01em;white-space:nowrap;box-shadow:inset 0 -.28rem 0 rgba(0,0,0,.13),inset 0 .2rem 0 rgba(255,255,255,.28),0 .55rem 1.1rem -.65rem var(--c)}
.band svg{width:1.05rem;height:1.05rem}
.band.tm{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 .15rem var(--line)}
.mini{display:flex;align-items:center;gap:.9rem;padding:.42rem 0;min-width:0}
.mini .lb b{font-size:1.5rem}
.cup .mini .lb b{font-size:1.4rem}
.cup .band{min-width:5.8rem;padding:0 .8rem}
.mini .lb small{font-size:1.15rem;margin-top:.12rem}
.qty{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:.3rem;font-weight:700;color:var(--mut);font-size:1.35rem;min-width:3.4rem}

/* prochains départs : frise verticale */
.tl{position:relative;padding-left:1.9rem}
.tl::before{content:'';position:absolute;left:.5rem;top:.9rem;bottom:.4rem;width:.22rem;border-radius:1rem;background:linear-gradient(var(--b),rgba(49,172,240,.08))}
.grp{position:relative;padding:0 0 1.15rem}
.grp::before{content:'';position:absolute;left:-1.85rem;top:.55rem;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 .3rem var(--b)}
.grp:first-child::before{background:var(--b);box-shadow:0 0 0 .38rem rgba(49,172,240,.22)}
.gh{display:flex;align-items:center;gap:.7rem;margin:0 0 .35rem}
.gh b{font-family:var(--fd);font-weight:800;font-size:2.5rem;line-height:1;letter-spacing:-.015em}
.gh>span{margin-left:auto;font-weight:800;font-size:1.2rem;color:#fff;background:linear-gradient(140deg,#5CC3F7,#1E8FD6);padding:.35rem .8rem;border-radius:999px;white-space:nowrap}
.grp:not(:first-child) .gh>span{background:var(--soft);color:var(--bt)}

/* terminé + légende */
.msg{display:flex;gap:.6rem;align-items:center;background:rgba(214,52,44,.10);color:#A3241D;border-radius:1rem;padding:.8rem 1rem;font-weight:800;font-size:1.3rem;line-height:1.3;margin:-.2rem 0 .9rem}
.th-dark .msg{background:rgba(255,120,110,.14);color:#FFC1BA}
.card.alert{box-shadow:var(--sh),inset 0 0 0 .2rem rgba(214,52,44,.28)}
.leg .mini{padding:.42rem .7rem;margin:0 -.7rem;border-radius:1rem}
.leg .mini.now{background:var(--soft)}
.leg .mini .hh{flex:none;width:4.2rem;font-family:var(--fd);font-weight:800;font-size:1.45rem}
.leg .mini.now .hh{color:var(--bt)}
.empty{color:var(--mut);font-size:1.35rem;line-height:1.5;margin:.2rem 0 0}

/* accueil sans session */
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:1.3rem;padding:1rem}
.wv{width:10rem;height:10rem;border-radius:3rem;background:linear-gradient(150deg,#5CC3F7,#31ACF0 55%,#1E8FD6);display:grid;place-items:center;box-shadow:0 1.4rem 3rem -1.4rem rgba(30,143,214,.75);overflow:hidden}
.wv svg{width:6rem;height:6rem;color:#fff;animation:swim 3.4s ease-in-out infinite}
@keyframes swim{50%{transform:translateX(.6rem)}}
.idle h1{margin:0;font-family:var(--fd);font-weight:800;font-size:5.2rem;line-height:1;letter-spacing:-.03em}
.idle p{margin:0;font-size:1.9rem;color:var(--mut);line-height:1.35}
.pills{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:.4rem}
.pill{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.4rem;border-radius:999px;background:var(--soft);font-weight:700;font-size:1.55rem;color:var(--ink)}
.pill i{width:.8rem;height:.8rem;border-radius:50%;background:var(--ok)}
.pill.cl i{background:var(--bad)}
.pill.b i{background:var(--b)}

/* bandeau défilant */
.tick{height:3.8rem;border-radius:1.3rem;background:linear-gradient(90deg,#0A1F4D,#173F86);color:#fff;overflow:hidden;display:flex;align-items:center;box-shadow:var(--sh)}
.th-dark .tick{background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(49,172,240,.18))}
.tk{display:flex;flex:none;white-space:nowrap;will-change:transform;animation:tick linear infinite}
.tk span{display:inline-flex;align-items:center;font-size:1.7rem;font-weight:600;padding-left:3.2rem}
.tk span::after{content:'';display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:var(--a);margin-left:3.2rem}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* annonce plein écran à la fin d'une session */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.5rem;padding:3rem;background:radial-gradient(80% 80% at 50% 40%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%),var(--c);color:var(--ci)}
#ov.on{display:flex;animation:ovin .45s ease-out}
#ov .big{position:relative;width:13rem;height:13rem;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 .6rem rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
#ov .big::before,#ov .big::after{content:'';position:absolute;top:-1.4rem;left:-1.4rem;right:-1.4rem;bottom:-1.4rem;border-radius:50%;border:.35rem solid rgba(255,255,255,.5);animation:ripple 2.2s ease-out infinite}
#ov .big::after{animation-delay:1.1s}
#ov .big svg{width:6.6rem;height:6.6rem;animation:bell 1.3s ease-in-out infinite;transform-origin:50% 15%}
#ov h1{margin:0;font-family:var(--fd);font-weight:800;font-size:7.6rem;line-height:1;letter-spacing:-.035em}
#ov p{margin:0;font-size:3.2rem;font-weight:700;line-height:1.15}
#ov small{font-size:2.3rem;opacity:.92;max-width:60rem;line-height:1.3;padding:.7rem 1.6rem;border-radius:999px;background:rgba(0,0,0,.12)}
#ov.many h1{font-size:5.6rem}
@keyframes ovin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes ripple{from{transform:scale(.85);opacity:.95}to{transform:scale(1.65);opacity:0}}
@keyframes bell{0%,100%{transform:rotate(0)}15%{transform:rotate(15deg)}30%{transform:rotate(-13deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}
/* commandes (apparaissent quand on touche l'écran) */
#bar{position:fixed;right:1.3rem;top:1.3rem;z-index:30;display:flex;gap:.6rem;opacity:0;pointer-events:none;transition:opacity .25s}
#bar.on{opacity:1;pointer-events:auto}
#bar button,#snd{border:0;border-radius:999px;padding:.85rem 1.35rem;background:#0A1F4D;color:#fff;font-weight:700;font-size:1.2rem;box-shadow:0 .8rem 2rem -.8rem rgba(0,0,0,.55);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
#bar button.warn{background:var(--bad)}
#bar button:focus-visible,#snd:focus-visible,.pc button:focus-visible{outline:.25rem solid var(--a);outline-offset:.2rem}
#snd{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);z-index:19;max-width:90vw;background:var(--a);font-size:1.35rem;padding:1rem 1.6rem}
#snd[hidden]{display:none}
#demo{position:fixed;left:50%;top:.35rem;transform:translateX(-50%);z-index:31;background:var(--a);color:#fff;font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;padding:.45rem .9rem;border-radius:999px}

/* association */
.pair{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:2rem;overflow:auto}
.pc{background:var(--card);border-radius:2.1rem;box-shadow:var(--sh);padding:3rem 3.4rem 2.6rem;width:100%;max-width:60rem;text-align:center}
.pc .lg{height:4.4rem;display:block;margin:0 auto}
.pc h1{margin:1.8rem 0 .7rem;font-family:var(--fd);font-weight:800;font-size:3.5rem;line-height:1.05;letter-spacing:-.025em}
.pc p{margin:0 0 1.6rem;font-size:1.5rem;color:var(--mut);line-height:1.45}
.pc p b{color:var(--ink)}
.pc form{display:flex;gap:.8rem}
.pc input{flex:1 1 auto;min-width:0;font:inherit;font-family:var(--fd);font-weight:800;font-size:2.3rem;letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:1.05rem 1rem;border-radius:1.25rem;border:.2rem solid var(--line);background:var(--card);color:var(--ink)}
.pc input::placeholder{color:#A9B4C9;letter-spacing:.03em}
.pc input:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 .4rem rgba(49,172,240,.22)}
.pc button{flex:none;border:0;border-radius:1.25rem;padding:0 2.3rem;min-height:5.4rem;background:linear-gradient(135deg,#FF8A2B,#F76300);color:#fff;font-weight:800;font-size:1.75rem;cursor:pointer;box-shadow:0 1rem 2rem -1.1rem rgba(247,99,0,.9)}
.pc button:disabled{opacity:.6;cursor:default}
.pc button.ghost{background:var(--soft);color:var(--ink);box-shadow:none;min-height:4.4rem;font-size:1.35rem;padding:0 1.6rem}
.pc .err{min-height:2rem;margin:1.1rem 0 0;font-size:1.35rem;font-weight:700;color:var(--bad);line-height:1.4}
.pc .ok{color:var(--ok)}
.pc .ft{margin:1.4rem 0 0;font-size:1.2rem}
.pc .acts{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
.spin{width:3.4rem;height:3.4rem;margin:1.8rem auto 0;border-radius:50%;border:.38rem solid var(--line);border-top-color:var(--b);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- v93 : restaurant (carte, places) et salon (rendez-vous, tarifs) ---------- */
#tv.kr{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);grid-template-areas:"top top" "mn sd" "tk tk"}
#tv.kr.notk{grid-template-areas:"top top" "mn sd"}
#tv.ka{grid-template-columns:minmax(0,1.05fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"top top top" "rv mn sd" "tk tk tk"}
#tv.ka.notk{grid-template-areas:"top top top" "rv mn sd"}
.cmn{grid-area:mn}.csd{grid-area:sd}.crv{grid-area:rv}
.ost{flex:none;display:flex;align-items:center;gap:1rem;padding:.75rem 1.4rem;border-radius:1.3rem;background:var(--soft)}
.ost i{flex:none;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 .38rem rgba(18,153,90,.16)}
.ost.off i{background:var(--bad);box-shadow:0 0 0 .38rem rgba(214,52,44,.16)}
.ost.soon i{background:#E9A100;box-shadow:0 0 0 .38rem rgba(233,161,0,.18)}
.ost b{display:block;font-family:var(--fd);font-weight:800;font-size:1.8rem;line-height:1.05;white-space:nowrap}
.ost small{display:block;font-size:1.2rem;color:var(--mut);font-weight:600;white-space:nowrap;margin-top:.15rem}
/* carte / tarifs : colonnes qui défilent par pages */
.mncard{display:flex;flex-direction:column}
.mnv{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
.mnc{position:absolute;top:0;left:0;right:0;bottom:0;column-count:var(--mc,2);column-gap:2.8rem;column-fill:auto;transform:translateX(calc(var(--pg,0) * (-100% - 2.8rem)));transition:transform 1s cubic-bezier(.65,0,.35,1)}
.mg{margin:0 0 1.5rem}
.mg h3{margin:0 0 .5rem;font-family:var(--fd);font-weight:800;font-size:1.2rem;letter-spacing:.09em;text-transform:uppercase;color:#D95500;break-after:avoid;display:flex;align-items:center;gap:.8rem}
.mg h3::after{content:'';flex:1;height:.14rem;border-radius:1rem;background:linear-gradient(90deg,rgba(247,99,0,.35),rgba(247,99,0,0))}
.th-dark .mg h3{color:#FF9A3D}
.mi{display:flex;align-items:baseline;gap:.6rem;padding:.42rem 0;break-inside:avoid}
.mi .n{font-size:1.6rem;font-weight:600;line-height:1.25;min-width:0}
.mi .n small{font-size:1.1rem;color:var(--mut);font-weight:700;white-space:nowrap;margin-left:.2rem}
.mi i{flex:1 1 1.5rem;min-width:1.5rem;border-bottom:.17rem dotted var(--line);transform:translateY(-.3rem)}
.th-light .mi i{border-color:#C9D3E3}
.mi b{flex:none;font-family:var(--fd);font-weight:800;font-size:1.7rem;white-space:nowrap}
.pgd{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex:none}
.pgd i{width:.7rem;height:.7rem;border-radius:999px;background:var(--line);transition:width .4s,background .4s}
.pgd i.on{background:var(--a);width:1.9rem}
/* disponibilités */
.av{display:flex;align-items:center;gap:1.1rem;padding:1.1rem 1.3rem;border-radius:1.3rem;background:rgba(18,153,90,.11);margin:0 0 1.2rem}
.av b{font-family:var(--fd);font-weight:800;font-size:4.4rem;line-height:.9;color:var(--ok);letter-spacing:-.02em}
.av>span{font-size:1.5rem;font-weight:800;line-height:1.25}
.av>span small{font-size:1.15rem;font-weight:600;color:var(--mut)}
.av .ok{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.av .ok svg{width:2rem;height:2rem}
.av.full{background:rgba(214,52,44,.10)}.av.full b{color:var(--bad);font-size:2.8rem}
.av.cl{background:var(--soft)}
.th-dark .av{background:rgba(61,214,140,.13)}.th-dark .av.full{background:rgba(255,120,110,.14)}.th-dark .av.cl{background:var(--soft)}
.sub{margin:0 0 .65rem;font-size:1.1rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;gap:.6rem}
.slot{display:inline-flex;align-items:baseline;gap:.45rem;padding:.55rem .95rem;border-radius:.95rem;background:var(--soft);box-shadow:inset 0 0 0 .13rem var(--line);font-family:var(--fd);font-weight:800;font-size:1.55rem}
.slot small{font-family:var(--fb);font-weight:700;font-size:1.05rem;color:var(--mut)}
.hrs{display:flex;align-items:center;gap:.6rem;margin:1.2rem 0 0;font-size:1.3rem;font-weight:600;color:var(--mut)}
.hrs svg{width:1.4rem;height:1.4rem;flex:none}
/* QR code */
.qrc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem;flex:none}
.qrb{background:#fff;border-radius:1.3rem;padding:.9rem;line-height:0;box-shadow:0 .9rem 2rem -1.3rem rgba(10,31,77,.55)}
.qrb svg{width:var(--qs,13rem);height:var(--qs,13rem);display:block}
.qrt{min-width:0;flex:1 1 auto}
.qrt b{display:block;font-family:var(--fd);font-weight:800;font-size:1.75rem;line-height:1.1}
.qrt small{display:block;color:var(--mut);font-size:1.1rem;margin-top:.35rem}
.qrt .url{display:block;font-weight:800;color:var(--bt);font-size:1.15rem;margin-top:.3rem;overflow-wrap:anywhere}
.qrc.qh{flex-direction:row;text-align:left;gap:1.2rem;padding:1.1rem 1.3rem}
.qrc.qh .qrb{padding:.6rem;border-radius:1rem}
.qrc.qh .qrb svg{width:var(--qs,9rem);height:var(--qs,9rem)}
.qrc.qh .qrt b{font-size:1.5rem}
/* rendez-vous du jour */
.rvs{display:flex;flex-direction:column;gap:.65rem}
.rv{display:flex;align-items:center;gap:1.1rem;padding:.75rem 1.1rem;border-radius:1.2rem;background:var(--soft);min-width:0}
.rv .tm{flex:none;width:6.1rem;font-family:var(--fd);font-weight:800;font-size:2.05rem;letter-spacing:-.01em}
.rv .lb b{font-size:1.5rem}
.rv .lb small{font-size:1.15rem;margin-top:.12rem}
.rv .in{flex:none;font-weight:800;font-size:1.15rem;color:var(--bt);background:var(--card);padding:.35rem .8rem;border-radius:999px;white-space:nowrap}
.rv.nx .in{background:linear-gradient(140deg,#5CC3F7,#1E8FD6);color:#fff}
.rv.on{background:var(--tint2);box-shadow:inset 0 0 0 .18rem var(--c);padding:.65rem 1.1rem .65rem .75rem}
.rv.on .ring{font-size:.68rem}
.rv.on .lb b{font-size:1.65rem}
.rv.on .cd{font-size:2.3rem;color:var(--cdk)}
.rv.on .cd em{font-size:.36em}
.rv.dn{opacity:.55}
.idle .hlg{margin-bottom:.4rem}
/* écran vertical (tablette, télé en portrait) */
@media (orientation:portrait){
  :root{font-size:clamp(9px,min(1.75vw,1.05vh),40px)}
  #tv{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.6fr) minmax(0,1fr) auto;grid-template-areas:"top top" "lv lv" "up dn" "tk tk"}
  #tv.notk{grid-template-rows:auto minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"top top" "lv lv" "up dn"}
  .occ{min-width:12rem}.hm{font-size:3.9rem}.dt .by{display:none}
  #tv.kr{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr) auto;grid-template-areas:"top" "mn" "sd" "tk"}
  #tv.kr.notk{grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"top" "mn" "sd"}
  #tv.ka{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.5fr) minmax(0,1fr) auto;grid-template-areas:"top top" "rv mn" "sd sd" "tk tk"}
  #tv.ka.notk{grid-template-rows:auto minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"top top" "rv mn" "sd sd"}
  .csd{flex-direction:row}.csd>.card{flex:1 1 0}
  .qrb svg{width:11rem;height:11rem}
  .ost b{font-size:1.45rem}.ost small{font-size:1rem}.ost{padding:.6rem 1rem}
  .lgo img{max-width:16rem;height:3.6rem}
}
@media (prefers-reduced-motion:reduce){#bg i,.tk,.row.hot,.row.hot .cd span,.row.hot .dot svg,.nw,.wv svg,#ov .big::before,#ov .big::after,#ov .big svg{animation:none!important}.mnc,.pgd i{transition:none!important}}

    qty:u.qty!==false,warn:N(u.warn,1,30,DEF.warn),win:N(u.win,5,180,DEF.win),done:N(u.done,1,60,DEF.done),snd:SNDS.includes(u.snd)?u.snd:DEF.snd,ann:u.ann!==false,voice:u.voice===true};

  const vp=S(o.vc&&o.vc.p,20)||'personne',vc={p:vp,pp:S(o.vc&&o.vc.pp,24)||vp+'s'};

/* ---------- signature ---------- */
const unb64u=t=>{t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
const KC={};
async function verify(p,b,s){
  try{
    if(!p||typeof p.x!=='string'||typeof p.y!=='string'||typeof b!=='string'||typeof s!=='string'||b.length>200000||s.length>200)return false;
    const id=p.x+'.'+p.y;
    const key=KC[id]||(KC[id]=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:p.x,y:p.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify']));
    return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,unb64u(s),new TextEncoder().encode(b));
  }catch(e){return false}
}

/* ---------- réseau ---------- */
async function getJ(url,ms){
  const ac=window.AbortController?new AbortController():null,t=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},ms||10000);
  try{const r=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:ac?ac.signal:undefined});let d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,d}}
  catch(e){return{ok:false,status:0,d:null}}
  finally{clearTimeout(t)}
}
async function apply(node){
  const my=++SEQ;
  if(node===null){DATA=null;LIVE.state='empty';draw(true);return}   /* nœud effacé : code changé dans Lago, ou rien encore envoyé */
  if(!node||typeof node!=='object'||typeof node.b!=='string'||typeof node.s!=='string'){LIVE.state='bad';draw(true);return}
  const ok=await verify(CFG.p,node.b,node.s);
  if(my!==SEQ)return;
  /* contenu non signé ou modifié : ignoré ; l'écran garde le dernier contenu valide (point rouge) */
  if(!ok){LIVE.state='bad';draw(!DATA);return}
  let o=null;try{o=clean(JSON.parse(node.b))}catch(e){}
  if(!o){LIVE.state='bad';draw(!DATA);return}
  if(o.off){DATA=null;LIVE.state='empty';LIVE.got=Date.now();draw(true);return}
  if(DATA&&o.d===DATA.d&&o.t&&DATA.t&&o.t<DATA.t)return;   /* contenu plus ancien que celui affiché : ignoré */
  DATA=o;LIVE.state='ok';LIVE.got=Date.now();
  if(o.lg!==LOGO_H)loadLogo(o.lg);
  theme(o.ui.th);draw(true);
}
const IMGOK=/^data:image\/(png|jpeg|webp|gif|svg\+xml)[;,]/;
function setLogo(a,b){LOGO=a||'';LOGO2=LOGO&&b?b:'';lgAnalyze(LOGO)}
/* luminosité du logo : pastille blanche sur fond sombre (logo foncé), pastille foncée sur fond clair (logo blanc) */
function lgAnalyze(src){
  LGI=null;if(!src)return;
  const im=new Image();
  im.onload=()=>{if(LOGO!==src)return;try{const w=48,h=Math.max(1,Math.round(48*(im.naturalHeight||1)/Math.max(1,im.naturalWidth||1))),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let s=0,a=0,n=0;for(let i=0;i<d.length;i+=4){const al=d[i+3]/255;if(al<.2)continue;s+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255*al;a+=al;n++}LGI={l:a?s/a:1,o:n/(w*h)}}catch(e){LGI={l:.5,o:1}}draw(true)};
  im.src=src;
}
function logoTag(cls){
  if(!LOGO)return'';
  const dk=document.body.classList.contains('th-dark'),alt=!!(dk&&LOGO2),i=LGI;let pl='';

}
async function loadLogo(h){

  }

}
async function poll(){
  if(!CFG||DEMO)return;
  const r=await getJ(nodeUrl('d'),12000);
  if(r.ok){LIVE.ok=Date.now();LIVE.err='';await apply(r.d)}
  else if(r.status===401||r.status===403){LIVE.state='denied';LIVE.err='denied';draw(true)}
  else{LIVE.err='net';draw(false)}
}
function listen(){
  if(!CFG||DEMO||!window.EventSource)return;
  try{if(ES)ES.close()}catch(e){}
  let es;try{es=new EventSource(nodeUrl('d'))}catch(e){return}
  ES=es;
  const onEv=(e,kind)=>{
    LIVE.ok=Date.now();LIVE.conn=true;
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(!m||typeof m!=='object')return;
    const path=String(m.path||'/');
    if(path==='/'){NODE=kind==='put'?m.data:Object.assign({},NODE||{},m.data||{})}
    else{const parts=path.split('/').filter(Boolean);if(parts.length!==1){poll();return}NODE=Object.assign({},NODE||{});if(m.data===null)delete NODE[parts[0]];else NODE[parts[0]]=m.data}
    apply(NODE);
  };
  es.addEventListener('put',e=>onEv(e,'put'));
  es.addEventListener('patch',e=>onEv(e,'patch'));
  es.addEventListener('keep-alive',()=>{LIVE.ok=Date.now();LIVE.conn=true});
  es.addEventListener('cancel',()=>{try{es.close()}catch(x){}if(ES===es)ES=null;LIVE.conn=false;poll();setTimeout(listen,30000)});
  es.addEventListener('auth_revoked',()=>{try{es.close()}catch(x){}if(ES===es)ES=null;LIVE.conn=false;setTimeout(listen,5000)});
  es.onopen=()=>{LIVE.conn=true;LIVE.ok=Date.now()};
  es.onerror=()=>{LIVE.conn=false;if(es.readyState===2){if(ES===es)ES=null;setTimeout(listen,15000)}};
}
function start(){
  LIVE.state='wait';draw(true);
  poll();listen();
}

/* ---------- association par code ---------- */
function parseCode(raw){
  const s=String(raw||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  let k='',i=s.length-1;
  for(;i>=0&&k.length<8;i--){if(s[i]!=='-')k=s[i]+k}
  const L=s.slice(0,i+1).replace(/^-+|-+$/g,'').toLowerCase();
  if(k.length!==8||![...k].every(c=>KEYS.includes(c))||!/^[a-z0-9][a-z0-9-]{1,62}$/.test(L))return null;
  return{L,k:k.toLowerCase()};
}
const hosts=L=>[`https://${L}-default-rtdb.europe-west1.firebasedatabase.app`,`https://${L}-default-rtdb.firebaseio.com`,`https://${L}.europe-west1.firebasedatabase.app`,`https://${L}.firebaseio.com`,`https://${L}-default-rtdb.asia-southeast1.firebasedatabase.app`,`https://${L}.asia-southeast1.firebasedatabase.app`];
async function pairCode(raw){
  const c=parseCode(raw);
  if(!c)return{err:'Ce code n’a pas le bon format. Il ressemble à NOM-DE-LA-BASE · XXXX-XXXX : recopiez-le exactement, tirets compris.'};
  const res=await Promise.all(hosts(c.L).map(async u=>({u,r:await getJ(u+'/tv/'+c.k+'/d.json',10000)})));
  for(const x of res){
    const d=x.r.d;
    if(x.r.ok&&d&&d.p&&await verify(d.p,d.b,d.s)){let o=null;try{o=clean(JSON.parse(d.b))}catch(e){}if(o)return{cfg:{u:x.u,k:c.k,p:{x:d.p.x,y:d.p.y},at:Date.now()}}}
  }
  if(res.some(x=>x.r.ok&&x.r.d===null))return{err:'Code reconnu, mais Lago n’a encore rien envoyé. Dans Lago, activez l’écran TV et gardez l’appli ouverte, puis réessayez.'};
  if(res.some(x=>x.r.status===401||x.r.status===403))return{err:'Ce code n’est pas (ou plus) autorisé. Vérifiez-le ; s’il est juste, l’administrateur doit recoller les règles Firebase (Lago › Paramètres › Réservations › Écran TV).'};
  return{err:'Code introuvable. Vérifiez qu’il est recopié exactement, tirets compris, et que l’écran est connecté à Internet.'};
}
function fromLink(){
  const m=/[#&?]c=([A-Za-z0-9_-]{20,3000})/.exec(location.hash+'&'+location.search);
  if(!m)return null;
  try{
    const o=JSON.parse(new TextDecoder().decode(unb64u(m[1])));
    const u=String(o.u||'').replace(/\/+$/,''),k=String(o.k||'');
    if(DBOK(u)&&KOK(k)&&o.p&&typeof o.p.x==='string'&&typeof o.p.y==='string')return{u,k,p:{x:o.p.x,y:o.p.y},at:Date.now()};
  }catch(e){}
  return null;
}

function dyn(P){
  app.querySelectorAll('[data-x]').forEach(el=>{
    const [k,v]=el.getAttribute('data-x').split(':'),n=+v;
    const t=k==='cd'||k==='in'?left(n-P.s):k==='hm'?hm(Math.floor(P.s/60)):k==='ss'?pad(P.s%60):'';
    if(el.textContent!==t)el.textContent=t;
  });
  /* carte et tarifs : une page toutes les 12 s */
  app.querySelectorAll('.mnc').forEach(el=>{
    const W=el.parentElement.clientWidth;if(!W)return;
    const gap=parseFloat(getComputedStyle(el).columnGap)||0,pages=Math.max(1,Math.round((el.scrollWidth+gap)/(W+gap))),pg=pages>1?Math.floor(P.s/12)%pages:0;
    MPG=pg;if(el.style.getPropertyValue('--pg')!==String(pg))el.style.setProperty('--pg',String(pg));
    const dots=el.closest('.card').querySelector('[data-pg]');
    if(dots){const h=pages>1?Array.from({length:pages},(_,i)=>`<i class="${i===pg?'on':''}"></i>`).join(''):'';if(dots.innerHTML!==h)dots.innerHTML=h}
  });
  /* anneaux : part de temps restante */
  app.querySelectorAll('[data-p]').forEach(el=>{
    const [a,b]=el.getAttribute('data-p').split(':').map(Number),p=b>a?Math.max(0,Math.min(1,(b-P.s)/(b-a))):0;
    el.style.setProperty('--p',p.toFixed(4));
  });
}
function draw(force){

  const k=h.replace(/(<span data-x="[^"]*">)[^<]*(<\/span>)/g,'$1$2').replace(/ nw"/g,'"').replace(/--pg:\d+/g,'')+'|'+stClass()[0];

/* ---------- fin de session : annonce, carillon, voix ---------- */
const SND={ctx:null,on:false};
function unlock(){
  try{
    if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)SND.ctx=new C()}
    if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
    if(window.speechSynthesis&&!SND.on){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
    SND.on=true;
  }catch(e){}
  sndChip();
}
function sndChip(){const want=DATA&&DATA.k==='s'&&(DATA.ui.snd!=='off'||DATA.ui.voice);sndBtn.hidden=!(want&&!SND.on)}
function chime(kind){
  const c=SND.ctx,ui=DATA&&DATA.ui;if(!c||!SND.on||!ui)return 0;
  if(c.state==='suspended')try{c.resume()}catch(e){}
  const m=c.createGain();m.gain.value=.9;m.connect(c.destination);const t0=c.currentTime+.06;
  const note=(f,t,d,type,g)=>{const o=c.createOscillator(),e=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g||.4,t+.015);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(m);o.start(t);o.stop(t+d+.05)};
  const bell=(f,t,d)=>{note(f,t,d,'sine',.42);note(f*2.0,t,d*.55,'sine',.11);note(f*3.01,t,d*.3,'sine',.05)};
  if(ui.snd==='off')return 0;
  if(kind==='warn'){bell(784,t0,1.2);bell(1046.5,t0+.38,1.5);return 1.9}
  if(ui.snd==='gong'){note(98,t0,4.6,'sine',.55);note(196.4,t0,3.2,'sine',.24);note(293.7,t0,2.2,'sine',.12);note(416,t0,1.3,'triangle',.05);return 4.2}
  if(ui.snd==='bip'){for(let i=0;i<3;i++)note(880,t0+i*.34,.2,'square',.16);return 1.2}
  [659.25,523.25,587.33,392].forEach((f,i)=>bell(f,t0+i*.62,1.7));return 3.9;
}
let VOX=null;
function say(txt,after){
  if(!SND.on||!DATA||!DATA.ui.voice||!window.speechSynthesis)return;
  setTimeout(()=>{try{
    const v=speechSynthesis.getVoices(),u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.96;
    VOX=VOX||v.find(x=>/^fr(-|_)FR/i.test(x.lang)&&/google|natural|neural|amélie|thomas/i.test(x.name))||v.find(x=>/^fr/i.test(x.lang))||null;
    if(VOX)u.voice=VOX;speechSynthesis.speak(u);
  }catch(e){}},Math.round((after||0)*1000));
}
function endFx(gs){
  const ui=DATA.ui,b=gs[0].b,many=gs.length>1,txt=gs[0].txt;
  ov.setAttribute('style',vars(b.hex));ov.className='on'+(many?' many':'');
  const t=txt?gs.map(g=>g.ov).join(' · '):'Bracelet'+(many?'s ':' ')+gs.map(g=>g.ov).join(' et ');
  ov.innerHTML=`<div class="big">${I.bell}</div><h1>${esc(t)}</h1><p>Votre session est terminée</p><small>${esc(ui.m3)}</small>`;
  clearTimeout(OVT);OVT=setTimeout(()=>{ov.className='';ov.innerHTML=''},14000);
  const d=chime('end');
  say(gs.map(g=>g.sp).join(', ')+', votre session est terminée. '+ui.m3,d+.2);
}
function warnFx(gs){
  const ui=DATA.ui,d=chime('warn');
  say(gs.map(g=>g.sp).join(', ')+', plus que '+ui.warn+' minute'+(ui.warn>1?'s':'')+'.',d+.1);
}
function events(P){
  const prev=PREV;PREV=P;
  if(!DATA||DATA.k!=='s'||!prev||prev.d!==P.d||P.s<=prev.s||P.s-prev.s>90||DATA.d!==P.d)return;
  const a=prev.s,b=P.s,ends={},warns={};
  for(const [s,u] of DATA.it){
    const g=gOf(s,u),E=g.E,W=E-DATA.ui.warn*60;
    if(a<E&&E<=b&&s*60<E)ends[g.k]=g;
    if(a<W&&W<=b&&s*60<=W)warns[g.k]=g;
  }
  const he=Object.values(ends).sort((x,y)=>x.E-y.E),hw=Object.values(warns).sort((x,y)=>x.E-y.E);
  if(he.length)endFx(he);
  else if(hw.length&&DATA.ui.ann)warnFx(hw);
}

/* ---------- commandes ---------- */
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function fsToggle(){
  try{
    if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){const r=f.call(e);if(r&&r.catch)r.catch(()=>{})}}
  }catch(e){}
}
let UNP=0;
function barDraw(){
  if(!CFG&&!DEMO){bar.innerHTML='';return}
  bar.innerHTML=`<button type="button" data-a="snd">${SND.on?'Son activé':'Activer le son'}</button><button type="button" data-a="fs">${fsOn()?'Quitter le plein écran':'Plein écran'}</button>${DEMO?'':`<button type="button" data-a="unpair" class="${UNP?'warn':''}">${UNP?'Confirmer : dissocier':'Dissocier cet écran'}</button>`}`;
}
function barShow(){
  if(!CFG&&!DEMO)return;
  barDraw();bar.classList.add('on');document.body.classList.remove('hidecur');
  clearTimeout(BART);BART=setTimeout(()=>{bar.classList.remove('on');UNP=0;document.body.classList.add('hidecur')},6000);
}
document.addEventListener('pointerdown',()=>{if(DATA&&!SND.on)unlock();barShow()},{passive:true});
document.addEventListener('pointermove',()=>barShow(),{passive:true});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='pcode')return;
  if(DATA&&!SND.on&&(e.key==='Enter'||e.key===' '||e.key==='Unidentified'||e.keyCode===23))unlock();

});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(e.target===sndBtn){unlock();return}
  if(!b)return;
  const a=b.dataset.a;
  if(a==='snd'){if(SND.on){SND.on=false;try{speechSynthesis.cancel()}catch(x){}}else unlock();barShow()}
  else if(a==='fs'){fsToggle();setTimeout(barShow,300)}
  else if(a==='unpair'){if(!UNP){UNP=1;barShow();return}unpair()}
  else if(a==='repair')unpair();
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='pf')return;e.preventDefault();

  const r=await pairCode(v);

  else{pairView(r.err);const i=$('#pcode');if(i)i.value=v}

function unpair(){
  try{if(ES)ES.close()}catch(e){}ES=null;
  CFG=null;DATA=null;NODE=null;setLogo('','');LOGO_H='';UNP=0;saveCfg(null);
  bar.classList.remove('on');sndBtn.hidden=true;ov.className='';pairView('');
}
let WL=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&(!WL||WL.released))WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(CFG&&!DEMO){poll();if(!ES)listen()}}});
