<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEF3F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Lago · Écran TV</title>
<style>
@font-face{font-family:'Lago Display';font-weight:600 800;font-style:normal;font-display:swap;src:url(fonts/display-700.woff) format('woff')}
@font-face{font-family:'Lago Sans';font-weight:400 500;font-style:normal;font-display:swap;src:url(fonts/body-400.woff) format('woff')}
@font-face{font-family:'Lago Sans';font-weight:600 800;font-style:normal;font-display:swap;src:url(fonts/body-700.woff) format('woff')}
:root{--b:#31ACF0;--bt:#1E7DB8;--a:#F76300;--ok:#12995A;--bad:#D6342C;
  --bg:#EEF3F9;--card:#FFFFFF;--ink:#0A1F4D;--mut:#5A6785;--line:#DDE5F0;--soft:#F3F6FB;
  --sh:0 1px 2px rgba(10,31,77,.05),0 1.2rem 2.8rem -1.5rem rgba(10,31,77,.28);
  --fd:'Lago Display','Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --fb:'Lago Sans','Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:clamp(10px,min(1.04vw,1.85vh),46px)}
.th-dark{--bt:#7CCBF5;--bg:#071633;--card:#0F2148;--ink:#F3F7FF;--mut:#A5B6D8;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.05);
  --sh:0 0 0 1px rgba(255,255,255,.06),0 1.5rem 3.6rem -1.8rem rgba(0,0,0,.65)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;cursor:default}
body.th-light{background:radial-gradient(110% 80% at 0% 0%,rgba(49,172,240,.13),rgba(49,172,240,0) 55%),radial-gradient(90% 80% at 100% 100%,rgba(247,99,0,.10),rgba(247,99,0,0) 60%),var(--bg)}
body.th-dark{background:radial-gradient(110% 80% at 0% 0%,rgba(49,172,240,.20),rgba(49,172,240,0) 55%),radial-gradient(90% 80% at 100% 100%,rgba(247,99,0,.16),rgba(247,99,0,0) 60%),var(--bg)}
body.hidecur{cursor:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- écran principal ---------- */
#tv{position:fixed;top:0;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:1.1rem;padding:1.3rem}
#tv.notk{grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:1.1rem;min-height:0;min-width:0}
.card{background:var(--card);border-radius:1.7rem;box-shadow:var(--sh);padding:1.4rem 1.6rem;min-height:0;min-width:0;position:relative;overflow:hidden}
.grow{flex:1 1 0}
.cbr{display:flex;align-items:center;justify-content:center;min-height:7.2rem;padding:1rem 1.4rem}
.cbr img{display:block;max-height:5.4rem;max-width:100%;object-fit:contain}
.cbr .nm{font-family:var(--fd);font-weight:800;font-size:2.2rem;line-height:1.05;text-align:center;letter-spacing:-.01em;overflow-wrap:anywhere}
h2.t{margin:0 0 1rem;font-family:var(--fd);font-weight:800;font-size:1.95rem;line-height:1.1;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;min-width:0}
h2.t>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.t .tot{margin-left:auto;flex:none;font-family:var(--fb);font-weight:700;font-size:1.35rem;color:var(--mut);display:flex;align-items:center;gap:.35rem}
h2.t .tag{flex:none;width:.85rem;height:.85rem;border-radius:50%;background:var(--a)}
.ico{width:1.2em;height:1.2em;flex:none}

/* rangées « en piste » (tailles en em : l'ensemble s'agrandit quand il y a peu de couleurs en piste) */
.rows{display:flex;flex-direction:column;gap:.8em;font-size:calc(1rem * var(--rs,1))}
.dot{flex:none;border-radius:50%;background:var(--c);color:var(--ci);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .34rem rgba(255,255,255,.32),0 .55rem 1.3rem -.45rem var(--c)}
.dot svg{display:none}
.lb{flex:1 1 auto;min-width:0}
.lb b{display:block;font-family:var(--fd);font-weight:800;line-height:1.05;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{flex:none;font-family:var(--fd);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.qty{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:.3rem;font-weight:700;color:var(--mut)}
.row{display:flex;align-items:center;gap:1.2em;padding:1em 1.3em;border-radius:1.35em;background:var(--tint);min-width:0}
.row .dot{width:4.6em;height:4.6em}
.row .dot svg{width:2.3em;height:2.3em}
.row .lb b{font-size:2.55em}
.row .lb{flex:1 1 8em}
.row .lb small{font-size:1.3em;margin-top:.2em}
.lb small .q{display:inline-flex;align-items:center;gap:.25em;margin-left:.7em;font-weight:700;vertical-align:-.12em}
.rows.few{gap:1.1em}.rows.few .row{padding:1.6em 1.5em}
.row .cd{font-size:3.4em}
.row .qty{font-size:1.55em;min-width:2.85em}
.row.hot{padding:1.35em 1.45em;background:var(--tint2);box-shadow:inset 0 0 0 .22rem var(--c)}
.row.hot .dot{width:5.4em;height:5.4em}
.row.hot .dot svg{display:block;animation:wave 2s ease-in-out infinite;transform-origin:50% 60%}
.row.hot .lb small{color:var(--ink);font-weight:700;white-space:normal;line-height:1.2}
.row.hot .cd{font-size:4.1em;color:var(--cdk);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.42}}
@keyframes wave{0%,62%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(16deg)}20%,40%{transform:rotate(-7deg)}}

/* petites rangées : départs, terminés, légende */
.grp{padding:.85rem 0 .3rem;border-top:.12rem dashed var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.gh{display:flex;align-items:baseline;gap:.7rem;margin:0 0 .45rem}
.gh b{font-family:var(--fd);font-weight:800;font-size:2.5rem;line-height:1;letter-spacing:-.01em}
.gh span{margin-left:auto;font-weight:700;font-size:1.4rem;color:var(--bt);white-space:nowrap}
.mini{display:flex;align-items:center;gap:.85rem;padding:.4rem 0;min-width:0}
.mini .dot{width:2.7rem;height:2.7rem;box-shadow:inset 0 0 0 .22rem rgba(255,255,255,.32)}
.mini .dot svg{width:1.45rem;height:1.45rem}
.mini .lb b{font-size:1.6rem}
.mini .lb small{font-size:1.1rem;margin-top:.1rem}
.mini .cd{font-size:1.6rem}
.mini .qty{font-size:1.35rem;min-width:3.2rem}
.mini.past{opacity:.45}
.cdn .mini .dot svg{display:block}
.msg{display:flex;gap:.6rem;align-items:center;background:rgba(214,52,44,.10);color:#A3241D;border-radius:1rem;padding:.75rem 1rem;font-weight:700;font-size:1.3rem;line-height:1.3;margin:-.2rem 0 .9rem}
.th-dark .msg{background:rgba(255,120,110,.14);color:#FFC1BA}
.empty{color:var(--mut);font-size:1.35rem;line-height:1.45;margin:.2rem 0 0}

/* horloge */
.cck{text-align:center;padding:1.3rem 1rem 1.1rem}
.hm{font-family:var(--fd);font-weight:800;font-size:6.4rem;line-height:.95;letter-spacing:-.035em;white-space:nowrap}
.hm i{font-style:normal;font-size:2.3rem;color:var(--mut);letter-spacing:0;margin-left:.15rem;vertical-align:.25em}
.dt{font-size:1.45rem;color:var(--mut);margin-top:.45rem;text-transform:capitalize}
.st{position:absolute;top:1rem;right:1.1rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 .3rem rgba(18,153,90,.16)}
.st.warn{background:#E9A100;box-shadow:0 0 0 .3rem rgba(233,161,0,.18)}
.st.off{background:var(--bad);box-shadow:0 0 0 .3rem rgba(214,52,44,.18)}
.by{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.8rem;font-size:.95rem;color:var(--mut);opacity:.75}
.by img{height:1.35rem;display:block}

/* accueil sans session */
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:1.2rem;padding:1rem}
.idle .wv{width:9rem;height:9rem;border-radius:2.6rem;background:linear-gradient(150deg,#5CC3F7,#31ACF0 55%,#1E8FD6);display:flex;align-items:center;justify-content:center;box-shadow:0 1.2rem 2.6rem -1.2rem rgba(30,143,214,.7)}
.idle .wv svg{width:5.4rem;height:5.4rem;color:#fff}
.idle h1{margin:0;font-family:var(--fd);font-weight:800;font-size:4.8rem;line-height:1.02;letter-spacing:-.025em}
.idle p{margin:0;font-size:1.9rem;color:var(--mut);line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:.6rem;padding:.75rem 1.4rem;border-radius:999px;background:var(--soft);font-weight:700;font-size:1.6rem;color:var(--ink)}
.pill i{width:.8rem;height:.8rem;border-radius:50%;background:var(--ok)}
.pill.cl i{background:var(--bad)}

/* bandeau défilant */
.tick{grid-column:1/-1;height:3.7rem;border-radius:1.25rem;background:#0A1F4D;color:#fff;overflow:hidden;display:flex;align-items:center;box-shadow:var(--sh)}
.th-dark .tick{background:rgba(255,255,255,.09)}
.tk{display:flex;flex:none;white-space:nowrap;will-change:transform;animation:tick linear infinite}
.tk span{display:inline-flex;align-items:center;font-size:1.65rem;font-weight:600;padding-left:3.2rem}
.tk span::after{content:'';display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:var(--a);margin-left:3.2rem}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* annonce plein écran à la fin d'une session */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4rem;padding:3rem;background:var(--c);color:var(--ci)}
#ov.on{display:flex;animation:ovin .45s ease-out}
#ov .big{width:13rem;height:13rem;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 .6rem rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
#ov .big svg{width:6.6rem;height:6.6rem}
#ov h1{margin:0;font-family:var(--fd);font-weight:800;font-size:7.4rem;line-height:1;letter-spacing:-.035em}
#ov p{margin:0;font-size:3.2rem;font-weight:700;line-height:1.15}
#ov small{font-size:2.3rem;opacity:.92;max-width:60rem;line-height:1.3}
#ov.many h1{font-size:5.6rem}
@keyframes ovin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}

/* commandes (apparaissent quand on touche l'écran) */
#bar{position:fixed;right:1.3rem;top:1.3rem;z-index:30;display:flex;gap:.6rem;opacity:0;pointer-events:none;transition:opacity .25s}
#bar.on{opacity:1;pointer-events:auto}
#bar button,#snd{border:0;border-radius:999px;padding:.85rem 1.35rem;background:#0A1F4D;color:#fff;font-weight:700;font-size:1.2rem;box-shadow:0 .8rem 2rem -.8rem rgba(0,0,0,.55);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
#bar button.warn{background:var(--bad)}
#bar button:focus-visible,#snd:focus-visible,.pc button:focus-visible{outline:.25rem solid var(--a);outline-offset:.2rem}
#snd{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);z-index:19;max-width:90vw;background:var(--a);font-size:1.35rem;padding:1rem 1.6rem}
#snd[hidden]{display:none}
#demo{position:fixed;left:50%;top:.35rem;transform:translateX(-50%);z-index:31;background:var(--a);color:#fff;font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;padding:.45rem .9rem;border-radius:999px}

/* association */
.pair{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:2rem;overflow:auto}
.pc{background:var(--card);border-radius:2.1rem;box-shadow:var(--sh);padding:3rem 3.4rem 2.6rem;width:100%;max-width:60rem;text-align:center}
.pc .lg{height:4.4rem;display:block;margin:0 auto}
.pc h1{margin:1.8rem 0 .7rem;font-family:var(--fd);font-weight:800;font-size:3.5rem;line-height:1.05;letter-spacing:-.025em}
.pc p{margin:0 0 1.6rem;font-size:1.5rem;color:var(--mut);line-height:1.45}
.pc p b{color:var(--ink)}
.pc form{display:flex;gap:.8rem}
.pc input{flex:1 1 auto;min-width:0;font:inherit;font-family:var(--fd);font-weight:800;font-size:2.3rem;letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:1.05rem 1rem;border-radius:1.25rem;border:.2rem solid var(--line);background:var(--card);color:var(--ink)}
.pc input::placeholder{color:#A9B4C9;letter-spacing:.03em}
.pc input:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 .4rem rgba(49,172,240,.22)}
.pc button{flex:none;border:0;border-radius:1.25rem;padding:0 2.3rem;min-height:5.4rem;background:linear-gradient(135deg,#FF8A2B,#F76300);color:#fff;font-weight:800;font-size:1.75rem;cursor:pointer;box-shadow:0 1rem 2rem -1.1rem rgba(247,99,0,.9)}
.pc button:disabled{opacity:.6;cursor:default}
.pc button.ghost{background:var(--soft);color:var(--ink);box-shadow:none;min-height:4.4rem;font-size:1.35rem;padding:0 1.6rem}
.pc .err{min-height:2rem;margin:1.1rem 0 0;font-size:1.35rem;font-weight:700;color:var(--bad);line-height:1.4}
.pc .ok{color:var(--ok)}
.pc .ft{margin:1.4rem 0 0;font-size:1.2rem}
.pc .acts{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
.spin{width:3.4rem;height:3.4rem;margin:1.8rem auto 0;border-radius:50%;border:.38rem solid var(--line);border-top-color:var(--b);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* écran vertical (tablette, télé en portrait) */
@media (orientation:portrait){
  :root{font-size:clamp(9px,min(1.75vw,1.05vh),40px)}
  #tv{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr) auto;grid-template-areas:"br ck" "lv lv" "up dn" "tk tk"}
  .col{display:contents}
  #tv.notk{grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"br ck" "lv lv" "up dn"}
  .cbr{grid-area:br}.cck{grid-area:ck}.clv{grid-area:lv}.cup{grid-area:up}.cdn{grid-area:dn}.tick{grid-area:tk}
  .hm{font-size:5.2rem}
}
@media (prefers-reduced-motion:reduce){.tk{animation:none}.row.hot .cd,.row.hot .dot svg{animation:none}}
</style>
</head>
<body class="th-light">
<div id="app" aria-live="off"></div>
<div id="ov" role="alert" aria-live="assertive"></div>
<div id="bar" role="toolbar" aria-label="Commandes de l’écran"></div>
<button id="snd" type="button" hidden>Touchez l’écran ou appuyez sur OK pour activer le son</button>
<script>
(()=>{
'use strict';
/* ===== Lago · Écran TV ====================================================================================
   Page à ouvrir sur une télé ou une tablette de l'accueil. Elle affiche en direct les bracelets en piste avec leur
   compte à rebours, les prochains départs, les sessions terminées, l'horloge, le logo et un texte défilant.
   - Association : code à taper (nom de la base + 8 caractères) ou lien envoyé depuis Lago (Paramètres › Écran TV).
   - Données : nœud tv/<clé>/d de la base Firebase de l'établissement, lu en direct (flux EventSource) avec relève de secours.
     Elles ne contiennent AUCUNE donnée client : seulement des horaires, des durées et des nombres de personnes.
   - Tout ce qui est affiché est SIGNÉ par Lago (ECDSA P-256) : la clé de vérification est enregistrée à l'association.
     Un contenu modifié ou non signé est ignoré : personne ne peut afficher autre chose sur l'écran.
   - Aucun cookie, aucun traceur ; seule la configuration de l'écran est gardée dans le navigateur. */

/* ---------- couleurs ---------- */
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const lum=h=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};const c=rgb(h);return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const con=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mix=(a,b,k)=>{const x=rgb(a),y=rgb(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*k).toString(16).padStart(2,'0')).join('')};
const ink=h=>con(h,'#FFFFFF')>=con(h,'#0A1F4D')?'#FFFFFF':'#0A1F4D';
function readable(h,dark){const bg=dark?'#0F2148':'#FFFFFF',to=dark?'#FFFFFF':'#0A1F4D';let c=h;for(let k=0;k<=1.001&&con(c,bg)<3.2;k+=.05)c=mix(h,to,k);return c}
function vars(h){const c=rgb(h),dk=document.body.classList.contains('th-dark');return`--c:${h};--ci:${ink(h)};--tint:rgba(${c},${dk?.13:.09});--tint2:rgba(${c},${dk?.24:.17});--cdk:${readable(h,dk)}`}

    const o={};f.formatToParts(date).forEach(p=>o[p.type]=p.value);
    return{d:o.year+'-'+o.month+'-'+o.day,s:(+o.hour%24)*3600+(+o.minute)*60+(+o.second),date,tz};
  }catch(e){return{d:date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate()),s:date.getHours()*3600+date.getMinutes()*60+date.getSeconds(),date,tz:undefined}}
}

function left(sec){sec=Math.max(0,Math.round(sec));if(sec>=3600)return Math.floor(sec/3600)+' h '+pad(Math.floor(sec%3600/60));return pad(Math.floor(sec/60))+':'+pad(sec%60)}

/* ---------- données reçues : nettoyage strict ---------- */
function clean(o){
  if(!o||typeof o!=='object'||o.v!==1)return null;
  if(o.off===true)return{v:1,off:true,t:+o.t||0};   /* écran désactivé dans Lago */
  const S=(v,n)=>String(v==null?'':v).replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,n);
  const N=(v,lo,hi,d)=>{v=Math.round(+v);return isFinite(v)&&v>=lo&&v<=hi?v:d};
  let tz='Europe/Paris';try{if(typeof o.tz==='string'&&o.tz.length<50&&o.tz){new Intl.DateTimeFormat('fr-FR',{timeZone:o.tz});tz=o.tz}}catch(e){}
  const it=(Array.isArray(o.it)?o.it:[]).slice(0,400).map(a=>Array.isArray(a)?[N(a[0],0,1439,-1),N(a[1],1,720,-1),N(a[2],1,9999,-1)]:null).filter(a=>a&&a[0]>=0&&a[1]>0&&a[2]>0);
  const br=(Array.isArray(o.br)&&o.br.length===6?o.br:BR0).map((x,i)=>Array.isArray(x)&&HEX.test(x[1]||'')?[S(x[0],20)||BR0[i][0],x[1]]:BR0[i]);
  const u=o.ui&&typeof o.ui==='object'?o.ui:{};
  const ui={th:u.th==='dark'?'dark':'light',t1:S(u.t1,60)||DEF.t1,t2:S(u.t2,60)||DEF.t2,t3:S(u.t3,60)||DEF.t3,m3:S(u.m3,140)||DEF.m3,tick:S(u.tick,400),
    qty:u.qty!==false,warn:N(u.warn,1,30,DEF.warn),win:N(u.win,5,180,DEF.win),done:N(u.done,1,60,DEF.done),snd:SNDS.includes(u.snd)?u.snd:DEF.snd,ann:u.ann!==false,voice:u.voice===true};
  const x=o.x===true;
  return{v:1,st:[10,15,20,30,45,60,90,120].includes(+o.st)?+o.st:15,t:+o.t||0,d:/^\d{4}-\d{2}-\d{2}$/.test(o.d||'')?o.d:'',tz,n:S(o.n,80),it,br,x,o:x?null:N(o.o,0,1440,null),c:x?null:N(o.c,0,1440,null),ui,lg:/^[a-f0-9]{8,64}$/.test(o.lg||'')?o.lg:''};
}

/* ---------- signature ---------- */
const unb64u=t=>{t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
const KC={};
async function verify(p,b,s){
  try{
    if(!p||typeof p.x!=='string'||typeof p.y!=='string'||typeof b!=='string'||typeof s!=='string'||b.length>200000||s.length>200)return false;
    const id=p.x+'.'+p.y;
    const key=KC[id]||(KC[id]=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:p.x,y:p.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify']));
    return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,unb64u(s),new TextEncoder().encode(b));
  }catch(e){return false}
}

/* ---------- configuration de l'écran (navigateur) ---------- */
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c&&DBOK(c.u)&&KOK(c.k)&&c.p&&c.p.x&&c.p.y)return c}catch(e){}return null}
function saveCfg(c){try{c?localStorage.setItem(LS,JSON.stringify(c)):localStorage.removeItem(LS)}catch(e){}}
const nodeUrl=p=>CFG.u+'/tv/'+CFG.k+'/'+p+'.json';

/* ---------- réseau ---------- */
async function getJ(url,ms){
  const ac=window.AbortController?new AbortController():null,t=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},ms||10000);
  try{const r=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:ac?ac.signal:undefined});let d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,d}}
  catch(e){return{ok:false,status:0,d:null}}
  finally{clearTimeout(t)}
}
async function apply(node){
  const my=++SEQ;
  if(node===null){DATA=null;LIVE.state='empty';draw(true);return}   /* nœud effacé : code changé dans Lago, ou rien encore envoyé */
  if(!node||typeof node!=='object'||typeof node.b!=='string'||typeof node.s!=='string'){LIVE.state='bad';draw(true);return}
  const ok=await verify(CFG.p,node.b,node.s);
  if(my!==SEQ)return;
  /* contenu non signé ou modifié : ignoré ; l'écran garde le dernier contenu valide (point rouge) */
  if(!ok){LIVE.state='bad';draw(!DATA);return}
  let o=null;try{o=clean(JSON.parse(node.b))}catch(e){}
  if(!o){LIVE.state='bad';draw(!DATA);return}
  if(o.off){DATA=null;LIVE.state='empty';LIVE.got=Date.now();draw(true);return}
  if(DATA&&o.d===DATA.d&&o.t&&DATA.t&&o.t<DATA.t)return;   /* contenu plus ancien que celui affiché : ignoré */
  DATA=o;LIVE.state='ok';LIVE.got=Date.now();
  if(o.lg!==LOGO_H)loadLogo(o.lg);
  theme(o.ui.th);draw(true);
}
async function loadLogo(h){
  LOGO_H=h;
  if(!h){LOGO='';draw(true);return}
  const r=await getJ(nodeUrl('l'),15000);
  if(LOGO_H!==h)return;
  if(r.ok&&r.d&&await verify(CFG.p,r.d.b,r.d.s)){
    try{const o=JSON.parse(r.d.b);if(o&&o.h===h&&typeof o.img==='string'&&o.img.length<200000&&/^data:image\/(png|jpeg|webp|gif|svg\+xml)[;,]/.test(o.img))LOGO=o.img}catch(e){}
  }
  draw(true);
}
async function poll(){
  if(!CFG||DEMO)return;
  const r=await getJ(nodeUrl('d'),12000);
  if(r.ok){LIVE.ok=Date.now();LIVE.err='';await apply(r.d)}
  else if(r.status===401||r.status===403){LIVE.state='denied';LIVE.err='denied';draw(true)}
  else{LIVE.err='net';draw(false)}
}
function listen(){
  if(!CFG||DEMO||!window.EventSource)return;
  try{if(ES)ES.close()}catch(e){}
  let es;try{es=new EventSource(nodeUrl('d'))}catch(e){return}
  ES=es;
  const onEv=(e,kind)=>{
    LIVE.ok=Date.now();LIVE.conn=true;
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(!m||typeof m!=='object')return;
    const path=String(m.path||'/');
    if(path==='/'){NODE=kind==='put'?m.data:Object.assign({},NODE||{},m.data||{})}
    else{const parts=path.split('/').filter(Boolean);if(parts.length!==1){poll();return}NODE=Object.assign({},NODE||{});if(m.data===null)delete NODE[parts[0]];else NODE[parts[0]]=m.data}
    apply(NODE);
  };
  es.addEventListener('put',e=>onEv(e,'put'));
  es.addEventListener('patch',e=>onEv(e,'patch'));
  es.addEventListener('keep-alive',()=>{LIVE.ok=Date.now();LIVE.conn=true});
  es.addEventListener('cancel',()=>{try{es.close()}catch(x){}if(ES===es)ES=null;LIVE.conn=false;poll();setTimeout(listen,30000)});
  es.addEventListener('auth_revoked',()=>{try{es.close()}catch(x){}if(ES===es)ES=null;LIVE.conn=false;setTimeout(listen,5000)});
  es.onopen=()=>{LIVE.conn=true;LIVE.ok=Date.now()};
  es.onerror=()=>{LIVE.conn=false;if(es.readyState===2){if(ES===es)ES=null;setTimeout(listen,15000)}};
}

/* ---------- association par code ---------- */
function parseCode(raw){
  const s=String(raw||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  let k='',i=s.length-1;
  for(;i>=0&&k.length<8;i--){if(s[i]!=='-')k=s[i]+k}
  const L=s.slice(0,i+1).replace(/^-+|-+$/g,'').toLowerCase();
  if(k.length!==8||![...k].every(c=>KEYS.includes(c))||!/^[a-z0-9][a-z0-9-]{1,62}$/.test(L))return null;
  return{L,k:k.toLowerCase()};
}
const hosts=L=>[`https://${L}-default-rtdb.europe-west1.firebasedatabase.app`,`https://${L}-default-rtdb.firebaseio.com`,`https://${L}.europe-west1.firebasedatabase.app`,`https://${L}.firebaseio.com`,`https://${L}-default-rtdb.asia-southeast1.firebasedatabase.app`,`https://${L}.asia-southeast1.firebasedatabase.app`];
async function pairCode(raw){
  const c=parseCode(raw);
  if(!c)return{err:'Ce code n’a pas le bon format. Il ressemble à NOM-DE-LA-BASE · XXXX-XXXX : recopiez-le exactement, tirets compris.'};
  const res=await Promise.all(hosts(c.L).map(async u=>({u,r:await getJ(u+'/tv/'+c.k+'/d.json',10000)})));
  for(const x of res){
    const d=x.r.d;
    if(x.r.ok&&d&&d.p&&await verify(d.p,d.b,d.s)){let o=null;try{o=clean(JSON.parse(d.b))}catch(e){}if(o)return{cfg:{u:x.u,k:c.k,p:{x:d.p.x,y:d.p.y},at:Date.now()}}}
  }
  if(res.some(x=>x.r.ok&&x.r.d===null))return{err:'Code reconnu, mais Lago n’a encore rien envoyé. Dans Lago, activez l’écran TV et gardez l’appli ouverte, puis réessayez.'};
  if(res.some(x=>x.r.status===401||x.r.status===403))return{err:'Ce code n’est pas (ou plus) autorisé. Vérifiez-le ; s’il est juste, l’administrateur doit recoller les règles Firebase (Lago › Paramètres › Écran TV).'};
  return{err:'Code introuvable. Vérifiez qu’il est recopié exactement, tirets compris, et que l’écran est connecté à Internet.'};
}
function fromLink(){
  const m=/[#&?]c=([A-Za-z0-9_-]{20,3000})/.exec(location.hash+'&'+location.search);
  if(!m)return null;
  try{
    const o=JSON.parse(new TextDecoder().decode(unb64u(m[1])));
    const u=String(o.u||'').replace(/\/+$/,''),k=String(o.k||'');
    if(DBOK(u)&&KOK(k)&&o.p&&typeof o.p.x==='string'&&typeof o.p.y==='string')return{u,k,p:{x:o.p.x,y:o.p.y},at:Date.now()};
  }catch(e){}
  return null;
}

function bracelet(h){const br=(DATA&&DATA.br)||BR0,c=br[((h%6)+6)%6];return{name:c[0],hex:c[1]}}
function model(P){
  const D=DATA,ui=D.ui,now=P.s,its=D.d===P.d?D.it:[];
  const live={},up={},done={};let next=null;
  for(const [s,u,n] of its){
    const h=Math.ceil((s+u)/60),E=h*3600,S0=s*60;
    if(S0<=now&&now<E){(live[h]=live[h]||{h,E,n:0}).n+=n}
    else if(S0>now){
      if(S0<=now+ui.win*60){const g=up[s]||(up[s]={s,n:0,rows:{}});g.n+=n;const r=g.rows[h]||(g.rows[h]={h,n:0,d:[]});r.n+=n;if(!r.d.includes(u))r.d.push(u)}
      if(next==null||s<next)next=s;
    }
    else if(E<=now&&now<E+ui.done*60){(done[h]=done[h]||{h,E,n:0}).n+=n}
  }
  const L=Object.values(live).sort((a,b)=>a.E-b.E);
  return{now,P,ui,live:L,up:Object.values(up).sort((a,b)=>a.s-b.s).slice(0,3),done:Object.values(done).sort((a,b)=>b.E-a.E),next,present:L.reduce((a,x)=>a+x.n,0),today:D.d===P.d};
}

/* ---------- fin de session : annonce, carillon, voix ---------- */
const SND={ctx:null,on:false};
function unlock(){
  try{
    if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)SND.ctx=new C()}
    if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
    if(window.speechSynthesis&&!SND.on){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
    SND.on=true;
  }catch(e){}
  sndChip();
}
function sndChip(){const want=DATA&&(DATA.ui.snd!=='off'||DATA.ui.voice);sndBtn.hidden=!(want&&!SND.on)}
function chime(kind){
  const c=SND.ctx,ui=DATA&&DATA.ui;if(!c||!SND.on||!ui)return 0;
  if(c.state==='suspended')try{c.resume()}catch(e){}
  const m=c.createGain();m.gain.value=.9;m.connect(c.destination);const t0=c.currentTime+.06;
  const note=(f,t,d,type,g)=>{const o=c.createOscillator(),e=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g||.4,t+.015);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(m);o.start(t);o.stop(t+d+.05)};
  const bell=(f,t,d)=>{note(f,t,d,'sine',.42);note(f*2.0,t,d*.55,'sine',.11);note(f*3.01,t,d*.3,'sine',.05)};
  if(ui.snd==='off')return 0;
  if(kind==='warn'){bell(784,t0,1.2);bell(1046.5,t0+.38,1.5);return 1.9}
  if(ui.snd==='gong'){note(98,t0,4.6,'sine',.55);note(196.4,t0,3.2,'sine',.24);note(293.7,t0,2.2,'sine',.12);note(416,t0,1.3,'triangle',.05);return 4.2}
  if(ui.snd==='bip'){for(let i=0;i<3;i++)note(880,t0+i*.34,.2,'square',.16);return 1.2}
  [659.25,523.25,587.33,392].forEach((f,i)=>bell(f,t0+i*.62,1.7));return 3.9;
}
let VOX=null;
function say(txt,after){
  if(!SND.on||!DATA||!DATA.ui.voice||!window.speechSynthesis)return;
  setTimeout(()=>{try{
    const v=speechSynthesis.getVoices(),u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.96;
    VOX=VOX||v.find(x=>/^fr(-|_)FR/i.test(x.lang)&&/google|natural|neural|amélie|thomas/i.test(x.name))||v.find(x=>/^fr/i.test(x.lang))||null;
    if(VOX)u.voice=VOX;speechSynthesis.speak(u);
  }catch(e){}},Math.round((after||0)*1000));
}
const nameL=h=>bracelet(h).name.toLowerCase();
function endFx(hs){
  const ui=DATA.ui,b=bracelet(hs[0]),many=hs.length>1,names=hs.map(h=>bracelet(h).name);
  ov.setAttribute('style',vars(b.hex));ov.className='on'+(many?' many':'');
  ov.innerHTML=`<div class="big">${I.bell}</div><h1>Bracelet${many?'s':''} ${esc(names.join(' et '))}</h1><p>Votre session est terminée</p><small>${esc(ui.m3)}</small>`;
  clearTimeout(OVT);OVT=setTimeout(()=>{ov.className='';ov.innerHTML=''},14000);
  const d=chime('end');
  say(hs.map(h=>'Bracelet '+nameL(h)).join(', ')+', votre session est terminée. '+ui.m3,d+.2);
}
function warnFx(hs){
  const ui=DATA.ui,d=chime('warn');
  say(hs.map(h=>'Bracelet '+nameL(h)).join(', ')+', plus que '+ui.warn+' minute'+(ui.warn>1?'s':'')+'.',d+.1);
}
function events(P){
  const prev=PREV;PREV=P;
  if(!DATA||!prev||prev.d!==P.d||P.s<=prev.s||P.s-prev.s>90||DATA.d!==P.d)return;
  const a=prev.s,b=P.s,ends={},warns={};
  for(const [s,u] of DATA.it){
    const h=Math.ceil((s+u)/60),E=h*3600,W=E-DATA.ui.warn*60;
    if(a<E&&E<=b&&s*60<E)ends[h]=1;
    if(a<W&&W<=b&&s*60<=W)warns[h]=1;
  }
  const he=Object.keys(ends).map(Number).sort((x,y)=>x-y),hw=Object.keys(warns).map(Number).sort((x,y)=>x-y);
  if(he.length)endFx(he);
  else if(hw.length&&DATA.ui.ann)warnFx(hw);
}

  const d=(()=>{const n=new Date(Date.now()+DEMO.off);return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())})();
  const it=[[600,90,14],[660,60,8],[705,60,17],[690,60,6],[675,120,9],[720,60,12],[720,90,5],[735,60,10],[750,60,7],[600,60,11]];
  const c=clean({v:1,t:Date.now(),d,tz,n:o.n||'Parc de démonstration',it,br:o.br,o:600,c:1140,ui:Object.assign({},DEF,{tick:'Bienvenue ! Chaussettes antidérapantes obligatoires · Anniversaires : réservez à l’accueil · Wifi gratuit'},o.ui||{}),lg:''});
  if(typeof o.logo==='string'&&/^data:image\/(png|jpeg|webp|gif|svg\+xml)[;,]/.test(o.logo)&&o.logo.length<2000000)LOGO=o.logo;
  return c;
}

/* ---------- boucle ---------- */
function loop(){
  if(DATA&&(CFG||DEMO)){const P=nowPark();events(P);draw(false)}
  sndChip();
}
function boot(){
  if(/^#demo/.test(location.hash)){
    DATA=demoData();theme(DATA.ui.th);
    document.body.insertAdjacentHTML('beforeend','<div id="demo">Aperçu · horaires simulés</div>');
    draw(true);setInterval(loop,1000);sndChip();return;
  }
  const L=fromLink();
  if(L){CFG=L;saveCfg(L);try{history.replaceState(null,'',location.pathname)}catch(e){}}
  else CFG=loadCfg();
  if(!CFG){pairView('');}
  else start();
  setInterval(loop,1000);
  wake();
  /* rechargement quotidien (vers 4 h 40) : récupère la dernière version de la page, sans rien perdre */
  const n=new Date(),t=new Date(n);t.setHours(4,40,0,0);if(t<=n)t.setDate(t.getDate()+1);
  setTimeout(()=>{if(navigator.onLine!==false)location.reload()},t-n);
}
window.__ecran={get DATA(){return DATA},get CFG(){return CFG},get LIVE(){return LIVE},parseCode,clean,model:()=>DATA&&model(nowPark()),events,nowPark,setDemoOffset:ms=>{if(DEMO)DEMO.off=ms}};
boot();
})();
</script>
