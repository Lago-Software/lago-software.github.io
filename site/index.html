<style>
body{margin:0;background:#FFFFFF}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
*{box-sizing:border-box}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes lgSpin{to{--ang:360deg}}
@keyframes lgWave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes lgDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}
@keyframes lgPulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}100%{box-shadow:0 0 0 12px rgba(249,115,22,0)}}
@keyframes lgPing{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.3);opacity:0}}
@keyframes lgBlink{50%{opacity:0}}
@keyframes lgMarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lgShine{from{background-position:0% 0}to{background-position:200% 0}}
@keyframes lgRise{from{opacity:0;transform:translateY(36px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lgPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.lg-card{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.lg-card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -18px rgba(29,78,216,.35)}
.lg-tilt{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.lg-tilt:hover{transform:perspective(1600px) rotateY(0deg) rotateX(0deg)!important}
.lg-btn{transition:transform .2s,box-shadow .2s,filter .2s}
.lg-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.lg-key{transition:transform .12s,background .2s}
@media (max-width:760px){.lg-hide-sm{display:none!important}}
.lg-key:active{transform:scale(.95)}
@supports (animation-timeline: view()){.lg-rv{animation:lgRise linear both;animation-timeline:view();animation-range:entry 0% cover 24%}}
.lg-still *,.lg-still *::before,.lg-still *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    var tags = lo ? [['Bleu', '#2563EB'], ['Orange', '#F97316'], ['Vert', '#16A34A'], ['Jaune', '#EAB308'], ['Violet', '#7C3AED'], ['Rose', '#DB2777']]
                  : [['Léa', '#2563EB'], ['Tom', '#F97316'], ['Inès', '#16A34A'], ['Malo', '#EAB308'], ['Sarah', '#7C3AED'], ['Nina', '#DB2777']];
    var times = occR.map(function (o, i) { var m = 14 * 60 + i * 15; return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); });
    var slots = occR.map(function (r, i) {
      var occ = Math.round(r * SEC.cap);
      var c = self.tileColors(occ / SEC.cap);
      return { time: times[i], label: occ >= SEC.cap ? 'Complet' : occ + ' / ' + SEC.cap, bg: c.bg, fg: c.fg,
        border: i === S.sel ? '2.5px solid #0B1B3A' : '2.5px solid transparent',
        pick: function () { self.setState({ sel: i }); } };
    });
    var so = Math.round(occR[S.sel] * SEC.cap), tg = tags[S.sel % tags.length];
    var sel = { time: times[S.sel], occ: so, cap: SEC.cap, left: Math.max(0, SEC.cap - so), pct: Math.min(100, Math.round(so / SEC.cap * 100)),
      unit: SEC.u.charAt(0).toUpperCase() + SEC.u.slice(1), tagLabel: lo ? 'Bracelet' : 'Équipe', bracelet: tg[0], braceletHex: tg[1],
      status: so >= SEC.cap ? 'Complet : la vente et la réservation en ligne sont bloquées automatiquement.' : (so / SEC.cap >= 0.85 ? 'Bientôt complet : alerte envoyée à l’accueil.' : 'Ouvert à la vente en caisse et en ligne.') };

    var checkLabels = this.CHECKS[SEC.fam];
    var done = S.checks.filter(Boolean).length;
    var checks = checkLabels.map(function (l, i) {
      var on = S.checks[i];
      return { label: l, mark: on ? '✓' : '', bg: on ? '#EFF4FF' : '#FFFFFF', border: on ? '#93C5FD' : '#E2E8F2',
        box: on ? '#2563EB' : '#B7C3D6', boxFill: on ? '#2563EB' : '#FFFFFF',
        toggle: function () { var c = S.checks.slice(); c[i] = !c[i]; self.setState({ checks: c }); } };
    });
    var t = S.tab;

    return {
      rootClass: motion ? '' : 'lg-still',
      waveD: d,
      words: words, heroChips: chipList(S.act), sectorChips: chipList(S.sector), sectorCards: sectorCards,
      actOffset: (-1.12 * S.act) + 'em', actUnit: A.u, actWhere: A.where, actPlan: A.plan, actCap: A.cap,
      live: live, livePct: Math.round(S.liveR * 100), heroSlots: heroSlots,
      marquee: marquee,

      posInfo: SEC.info, posCats: posCats, posProducts: posProducts, posLines: posLines, posEmpty: posLines.length === 0,
      salesCount: S.sales, ticketNo: String(S.ticketNo).padStart(4, '0'), dateLabel: dateLabel,
      posTotalLabel: self.fmt(total), vatRate: vatRate, vatLabel: self.fmt(vat),
      hasDisc: S.posDisc > 0 && posLines.length > 0, discPct: S.posDisc, discLabel: self.fmt(discAmt),
      discBtn: S.posDisc ? 'Remise −' + S.posDisc + ' %' : 'Remise', discBg: dBtn.bg, discFg: dBtn.fg, discBd: dBtn.bd,
      splitBtn: split > 1 ? 'Diviser ÷ ' + split : 'Diviser', splitBg: sBtn.bg, splitFg: sBtn.fg, splitBd: sBtn.bd,
      isSplit: split > 1 && total > 0, splitInfo: split + ' paiements de ' + self.fmt(partAmt),
      posHasClient: S.posClient, posNoClient: !S.posClient, clientPts: 240 + (step === 'paid' ? earn : 0), earnPts: earn,
      cashOpts: cashOpts, posGivenLabel: S.posGiven > 0 ? self.fmt(S.posGiven) : '—',
      posChangeLabel: enough ? self.fmt(S.posGiven - total) : '—', cashValidOp: enough ? 1 : 0.45,
      receiptOpts: receiptOpts, receiptMsg: receiptMsg, receiptMsgShow: receiptMsg !== '',
      payLabel: payLabel, receiptDisc: S.posDisc > 0, clientLine: S.posClient ? 'Fidélité : +' + earn + ' pts' : '',
      posExtra: SEC.extra.map(function (e) { return { t: e }; }), posThanks: SEC.thanks,
      posToast: SEC.toast + (S.posClient ? ' · +' + earn + ' pts' : ''), posToastColor: SEC.toastColor,
      posBtnOp: total === 0 ? 0.45 : 1,
      posIdle: step === 'idle', posCard: step === 'card', posCashStep: step === 'cash', posPaid: step === 'paid',
      cardWait: split > 1 ? 'Paiement ' + S.posPart + '/' + split + ' en attente…' : 'En attente du terminal…',
      tpeIdle: step === 'idle', tpePartLabel: split > 1 ? 'Paiement ' + S.posPart + '/' + split : 'Sans contact',
      tpeAmount: self.fmt(split > 1 ? partAmt : total),
      tpeQr: step === 'paid' && rec === 'qr', tpeOk: step === 'paid' && rec !== 'qr',
      tpeOkSub: S.posClient ? '+' + earn + ' pts fidélité' : (S.posPay === 'cash' ? 'Rendu : ' + self.fmt(Math.max(0, S.posGiven - total)) : (split > 1 ? split + ' paiements reçus' : 'Merci !')),
      qrCells: this.QR,
      receiptY: step === 'paid' && rec === 'print' ? '0%' : '102%',
      printerLed: step === 'paid' && rec === 'print' ? '#16A34A' : '#F97316',
      cycleDisc: function () { if (S.posStep !== 'idle') return; self.setState({ posDisc: S.posDisc === 0 ? 10 : S.posDisc === 10 ? 20 : 0 }); },
      cycleSplit: function () { if (S.posStep !== 'idle') return; self.setState({ posSplit: split >= 3 ? 1 : split + 1 }); },
      toggleClient: function () { if (S.posStep === 'card') return; self.setState({ posClient: !S.posClient }); },
      posPayCard: function () {
        if (total === 0 || S.posStep !== 'idle') return;
        clearTimeout(self.posT);
        self.setState({ posStep: 'card', posPart: 1, posPay: 'card' });
        var tick = function (n) {
          self.posT = setTimeout(function () {
            if (n < split) { self.setState({ posPart: n + 1 }); tick(n + 1); }
            else { self.setState(function (s) { return { posStep: 'paid', sales: s.sales + 1 }; }); }
          }, motion ? 1900 : 10);
        };
        tick(1);
      },
      posPayCash: function () { if (total === 0 || S.posStep !== 'idle') return; self.setState({ posStep: 'cash', posPay: 'cash', posGiven: 0 }); },
      posCancelCash: function () { self.setState({ posStep: 'idle', posGiven: 0 }); },
      posConfirmCash: function () { if (!enough) return; self.setState(function (s) { return { posStep: 'paid', sales: s.sales + 1 }; }); },
      posReset: function () {
        clearTimeout(self.posT);
        self.setState(function (s) { return self.freshSale({ posCart: {}, ticketNo: s.posStep === 'paid' ? s.ticketNo + 1 : s.ticketNo }); });
      },

      showAvant: function () { self.setState({ ba: 'avant' }); },
      showAvec: function () { self.setState({ ba: 'avec' }); },
      baAvantBg: avec ? 'transparent' : '#0B1B3A', baAvantFg: avec ? '#33415C' : '#FFFFFF',
      baAvecBg: avec ? 'linear-gradient(135deg,#2563EB,#1D4ED8)' : 'transparent', baAvecFg: avec ? '#FFFFFF' : '#33415C',
      baStageBg: avec ? '#F4F7FC' : '#FFF8F2', baStageBd: avec ? '#BFD3F5' : '#F5C9A6',
      baHeadOp: avec ? 1 : 0, baHeadY: avec ? 0 : -20,
      baCards: baCards,

      aiQText: S.listening ? 'Je vous écoute…' : qa.q, aiQColor: S.listening ? '#C2410C' : '#0B1B3A',
      aiAnswer: S.listening ? '' : qa.a.slice(0, S.aiN), aiTyping: !S.listening && S.aiN < qa.a.length,
      aiChips: aiChips, listening: S.listening,
      micClick: function () {
        clearInterval(self.aiT); clearTimeout(self.micT);
        self.setState({ listening: true });
        var next = (S.aiQ + 1) % self.QA.length;
        self.micT = setTimeout(function () { self.ask(next); }, motion ? 1500 : 10);
      },

      slots: slots, sel: sel,
      checks: checks, doneCount: done, checkTotal: checkLabels.length, checkPct: Math.round(done / checkLabels.length * 100),
      checkTitle: lo ? 'Contrôle visuel quotidien' : 'Checklist d’ouverture',
      reportTitle: done === checkLabels.length ? (lo ? 'Parc prêt à ouvrir' : 'Prêt à ouvrir') : 'Contrôle en cours',
      isPlanning: t === 'planning', isControle: t === 'controle',
      showPlanning: function () { self.setState({ tab: 'planning' }); },
      showControle: function () { self.setState({ tab: 'controle' }); },
      tabPlanningBg: t === 'planning' ? '#0B1B3A' : 'transparent', tabPlanningFg: t === 'planning' ? '#FFFFFF' : '#33415C',
      tabControleBg: t === 'controle' ? '#0B1B3A' : 'transparent', tabControleFg: t === 'controle' ? '#FFFFFF' : '#33415C'
    };
  }
}
Component.prototype.render = function () { return lagoTemplate(this.renderVals()); };
LagoReact.createRoot(document.getElementById('app')).render(h(Component, {}));
</script>
