<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4FD7">
<meta name="application-name" content="Lago"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lago">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lago</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}</style>
</head><body>
<title>Lago</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: navigation latérale + espace de travail. Le planning est l'écran central.
   Palette: bleu (structure, parc) et orange (action, bar). Park bleu, Bar orange, Événement turquoise, Gestion ardoise. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F5FF; --ink:#0A1F4D; --muted:#566785; --line:#D7DFEE;
  --brand:#1D4FD7; --brand-ink:#FFFFFF; --brand-soft:#DCE6FC; --side:#1D4FD7; --side-ink:#FFFFFF;
  --pay:#FF7A1A; --pay-ink:#1F0F00;
  --ok:#1C8553; --warn:#E8690B; --bad:#C63A3A;
  --c-entree:#1D4FD7; --c-anniv:#0F2A66; --c-snack:#EE6F0C; --c-shop:#5A6B8C;
  --shadow:0 12px 40px rgba(8,20,50,.22);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:120px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 32px)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.05em;color:var(--ink)}
.logo svg{width:30px;height:30px;color:var(--brand)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-decoration:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand);color:var(--brand-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot button{text-align:left;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700;line-height:1.1}
.top .sub{color:var(--muted);text-transform:capitalize;font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.logo-m{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--surface-2);font-weight:650}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--ink) 8%)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn-pay{width:100%;min-height:56px;border-radius:14px;background:var(--pay);color:var(--pay-ink);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.btn-pay:disabled{opacity:.4}
.ix{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:16px;margin-bottom:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;min-height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:40px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:118px;padding:12px;border-radius:14px;text-align:left;
  background:color-mix(in srgb,var(--cat) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 24%,var(--line));transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cat)}
.tile .n{font-weight:650;font-size:15px;line-height:1.2;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile .p{font-family:var(--f-display);font-weight:700;font-size:19px}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

.cart{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.cart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px}
.cart-h h2{font-size:18px}
.sec{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-weight:600;text-align:left}
.pick.set{border-style:solid;color:var(--ink);background:var(--bg)}
.pick .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.slotrow .lbl{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slotrow .ix{width:44px;height:44px;border-radius:10px}
.warn-t{color:var(--bad);font-size:13px;font-weight:600}
.lines{overflow:auto;flex:1;min-height:70px;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto 74px;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.ln .nm{font-weight:600;line-height:1.25}
.ln .u{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.step b{min-width:26px;text-align:center}
.ln .t{text-align:right;font-weight:650}
.cart-empty{padding:26px 16px;text-align:center;color:var(--muted)}
.disc{display:flex;gap:6px;flex-wrap:wrap}
.disc .chip{min-height:34px;padding:6px 12px}
.tot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tot .r{display:flex;justify-content:space-between;color:var(--muted)}
.tot .r.big{color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:24px;margin-bottom:6px}
.cartbar{display:none}
.cart-scrim{display:none}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn{width:100%;text-align:left}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cat);flex:none}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin-top:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.warn{background:var(--warn)}
.bar i.full{background:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin-bottom:12px}
.mrow .bar{grid-column:1/-1}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:420px;height:auto}
.ch-grid{stroke:var(--line);fill:none}
.ch-t{fill:var(--muted);font:11px var(--f-body)}
.ch-bar{fill:var(--brand)}
.vrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.vrow.h{border-top:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vrow span:not(:first-child){text-align:right}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
.sl{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 12px;width:100%;text-align:left;border-radius:14px}
.sl:hover{background:var(--surface-2)}
.sl .tm{font-family:var(--f-display);font-weight:700;font-size:18px}
.sl .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.scrim{position:fixed;inset:0;background:rgba(4,18,20,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(540px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mh h2{font-size:22px}
.due{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:14px;background:var(--brand-soft)}
.due strong{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meth{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-weight:650;text-align:left}
.meth:hover{background:var(--brand-soft)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .pm{font-weight:650}
.given{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.given .chip{min-height:34px;padding:6px 12px}
.sum{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.sum .r{display:flex;justify-content:space-between}
.sum .r.k{font-weight:700;font-size:17px}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed var(--line);width:100%;margin:6px 0}
.success{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo{font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn);font-weight:700;display:inline-block;width:fit-content}

/* illustrations, onglets, planning, congés, contrôle, accueil */
.art{display:block;width:100%;height:auto;aspect-ratio:120/76;border-radius:10px}
.art .bg{fill:color-mix(in srgb,var(--cat) 14%,var(--surface))}
.art .a1{fill:var(--cat)}.art .a2{fill:color-mix(in srgb,var(--cat) 38%,var(--surface))}.art .a3{fill:var(--surface)}
.art .s{stroke:var(--cat);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.art .d{stroke:var(--surface);stroke-width:2;stroke-linecap:round;fill:none}
.art .t{fill:var(--cat);font:700 30px var(--f-display)}
.tile{min-height:0;gap:8px;background:var(--surface);border:1px solid var(--line);padding:8px 8px 12px}
.tile .n{font-weight:650;font-size:14px;line-height:1.2;margin-top:0;padding:0 4px}
.tile .p{padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.tile .badge{top:14px;right:14px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);margin-bottom:16px;max-width:100%;overflow-x:auto}
.tabs button{padding:9px 16px;border-radius:10px;font-weight:650;color:var(--muted);white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;margin-bottom:14px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--ink);font-weight:600}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.home .card h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1.1}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px;border-radius:20px;background:var(--brand);color:var(--brand-ink);margin-bottom:14px;overflow:hidden}
.hero h2{font-size:26px}.hero p{opacity:.85;margin-top:2px}
.hero .btn{background:var(--pay);color:var(--pay-ink)}
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.wk table{border-collapse:collapse;width:100%;min-width:640px}
.wk th,.wk td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.wk th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wk th.tdy{color:var(--brand)}
.wk td:first-child,.wk th:first-child{text-align:left;padding-left:12px;min-width:150px}
.wk tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:34px;height:34px;font-size:13px}
.who small{display:block;color:var(--muted);font-size:12px}
.sh{width:100%;min-height:44px;border-radius:10px;font-weight:700;font-size:12px;line-height:1.15;background:var(--surface-2);color:var(--muted)}
.sh.M{background:color-mix(in srgb,var(--c-snack) 22%,var(--surface));color:var(--ink)}
.sh.S{background:color-mix(in srgb,var(--c-anniv) 22%,var(--surface));color:var(--ink)}
.sh.J{background:color-mix(in srgb,var(--c-entree) 24%,var(--surface));color:var(--ink)}
.sh.L{background:color-mix(in srgb,var(--c-shop) 22%,var(--surface));color:var(--ink);cursor:default}
.sh small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cov td{font-size:13px;font-weight:700}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wknav b{flex:1;text-align:center;min-width:150px}
.chk{padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .q{font-weight:650;margin-bottom:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:48px;border-radius:12px;background:var(--surface-2);font-weight:700}
.yn button.ok.on{background:var(--ok);color:#fff}
.yn button.ko.on{background:var(--bad);color:#fff}
.chk input{margin-top:8px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog .bar{flex:1}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.hist span.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--ok)}
.hist span.ko{background:color-mix(in srgb,var(--bad) 20%,var(--surface));color:var(--bad)}
/* panier lisible, réservation */
.cart{border-radius:20px}
.cart-h h2{font-size:22px}
.pick{min-height:48px}
.pick .xx{display:grid;place-items:center;width:32px;height:32px}
.info{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--brand-soft)}
.info b{font-size:16px}
.info small{display:block;color:var(--muted);font-size:13px}
.info.or{background:color-mix(in srgb,var(--pay) 20%,var(--surface))}
.rwd{display:flex;gap:6px;flex-wrap:wrap}
.rwd .chip{border-color:var(--pay);min-height:40px}
.rwd .chip.on{background:var(--pay);color:var(--pay-ink);border-color:var(--pay)}
.gh{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cat);background:color-mix(in srgb,var(--cat) 9%,var(--surface))}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}

/* style Roller */
.tlw{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow-x:auto;box-shadow:0 10px 28px rgba(10,31,77,.05);margin-bottom:12px}
.tlr{min-width:calc(190px + var(--n)*30px);padding:12px}
.tlbody{position:relative;--lw:190px}
.tlrow{display:grid;grid-template-columns:var(--lw) 1fr;align-items:stretch;margin-bottom:6px}
.tll{display:flex;flex-direction:column;justify-content:center;padding:0 12px 0 4px;min-width:0}
.tll b{font-size:14px}
.tll span{font-size:12px;color:var(--muted)}
.tlg{display:grid;grid-template-columns:repeat(var(--n),minmax(30px,1fr));gap:3px}

.tc.past{opacity:.5}
.tc.cur{outline:3px solid var(--pay);outline-offset:1px}
.tc.shut,.dl.shut{background:repeating-linear-gradient(135deg,#E8ECF4 0 5px,#DCE2EE 5px 10px);color:var(--muted)}
.tlg.ev{min-height:50px;background:var(--surface-2);border-radius:8px;align-items:stretch;padding:3px}
.tev{display:flex;flex-direction:column;justify-content:center;text-align:left;padding:4px 10px;border-radius:7px;line-height:1.15;overflow:hidden;grid-row:1}

.tfree{grid-column:1/-1;display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--muted)}
.nowv{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad);left:calc(var(--lw) + (100% - var(--lw)) * var(--f));pointer-events:none;z-index:4}
.sinfo{display:grid;grid-template-columns:repeat(4,auto);gap:8px 18px;padding:12px 14px;border-radius:14px;background:var(--surface-2);justify-content:space-between}
.sinfo>div{display:flex;flex-direction:column}

.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.at{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}

/* tuiles du menu */
.gsearch{position:relative;margin:14px 0 14px}
.gsearch>svg{position:absolute;left:16px;top:15px;width:20px;height:20px;color:var(--muted)}
.gsearch input{width:100%;min-height:52px;padding:0 16px 0 46px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
#gsr:not(:empty){position:absolute;left:0;right:0;top:56px;z-index:30;background:#fff;border-radius:16px;box-shadow:0 14px 36px rgba(10,31,77,.2);padding:6px 10px;max-height:340px;overflow:auto}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.mt{position:relative}
.mt-main{width:100%;min-height:132px;border-radius:18px;background:var(--surface);box-shadow:0 1px 2px rgba(10,31,77,.06),0 10px 24px rgba(10,31,77,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:15px;transition:transform .1s}
.mt-main:hover{transform:translateY(-2px)}
.mt-ic{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--g-brand,var(--brand));color:#fff}
.mt-ic svg{width:28px;height:28px}
.mt:nth-child(even) .mt-ic{background:var(--g-pay,var(--pay));color:var(--pay-ink)}

.mt:hover .mt-sub,.mt:focus-within .mt-sub{display:flex}

/* sous-menus de l'accueil */
.mt.has::after{content:'';position:absolute;right:14px;bottom:14px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);opacity:.6;pointer-events:none}
.mt:hover>.mt-main,.mt:focus-within>.mt-main{transform:translateY(-2px);box-shadow:0 14px 30px rgba(29,79,215,.22)}
.mt-sub{position:absolute;left:-6px;right:-6px;top:100%;z-index:30;display:none;flex-direction:column;gap:2px;margin-top:10px;padding:8px;min-width:200px;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(10,31,77,.06),0 22px 48px rgba(10,31,77,.24);animation:subin .14s ease-out}
.mt-sub::before{content:'';position:absolute;left:0;right:0;top:-14px;height:14px}
.mt-sub::after{content:'';position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;background:#fff;transform:rotate(45deg);border-radius:3px;box-shadow:-2px -2px 3px rgba(10,31,77,.06)}
.mt:hover>.mt-sub,.mt:focus-within>.mt-sub{display:flex}
.mt-sub button{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;text-align:left;font-size:14px;font-weight:650;color:var(--ink)}
.mt-sub .si{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;background:var(--brand-soft);color:var(--brand);transition:background .12s,color .12s}
.mt-sub .si svg{width:18px;height:18px}
.mt-sub .sl2{flex:1;white-space:nowrap}
.mt-sub .sa{width:7px;height:7px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:0;transition:opacity .12s,transform .12s}
.mt-sub button:hover{background:color-mix(in srgb,var(--brand) 8%,#fff)}
.mt-sub button:hover .si{background:var(--g-brand,var(--brand));color:#fff}
.mt-sub button:hover .sa{opacity:.8;transform:translateX(2px) rotate(45deg)}
.mtiles .mt:nth-child(even) .mt-sub .si{background:color-mix(in srgb,var(--pay) 16%,#fff);color:#C25200}
.mtiles .mt:nth-child(even) .mt-sub button:hover .si{background:var(--g-pay,var(--pay));color:var(--pay-ink)}
@keyframes subin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (hover:none){.mt-sub{position:static;display:flex;margin:6px 0 0;padding:4px;box-shadow:none;background:var(--surface-2);animation:none}.mt-sub::before,.mt-sub::after{display:none}.mt-main{min-height:110px}.mt.has::after{display:none}}

};

/* ---------- données ---------- */
const CATS=[{id:'park',name:'Park',v:'--c-entree'},{id:'bar',name:'Bar',v:'--c-snack'},{id:'event',name:'Événement',v:'--c-anniv'},{id:'gestion',name:'Gestion',v:'--c-shop'}];

    P('b1','Chaussettes antidérapantes','shop',250,20),P('b2','Gourde','shop',800,20),P('b3','T-shirt du parc','shop',1500,20)
  ];

  return [C('Camille Martin','06 12 34 56 01','camille.martin@exemple.fr'),C('Lucas Bernard','06 12 34 56 02','lucas.bernard@exemple.fr'),

function seedSales(){
  let r=11;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
  const now=new Date(),d0=today(),list=[];
  for(let i=0;i<18;i++){
    const h=10+Math.floor(rnd()*8),m=Math.floor(rnd()*60);
    const ts=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m).getTime();
    const q1=1+Math.floor(rnd()*4);
    const lines=[{pid:['p1','p1','p2','p3'][Math.floor(rnd()*4)],qty:q1}];
    if(rnd()<.5)lines.push({pid:'p4',qty:1});
    if(rnd()<.6)lines.push({pid:['s1','s2','s3','s4','s5','s6'][Math.floor(rnd()*6)],qty:1+Math.floor(rnd()*3)});
    if(rnd()<.4)lines.push({pid:'b1',qty:Math.min(q1,3)});
    const c={lines,disc:{t:'pct',v:0},clientId:rnd()<.25?S.clients[Math.floor(rnd()*S.clients.length)].id:null,slotDate:d0,slotM:h*60};
    const T=totals(c);const x=rnd();
    const pays=x<.6?[{m:'card',amt:T.total}]:x<.85?[{m:'cash',amt:T.total,given:T.total}]:[{m:'ancv',amt:T.total}];
    list.push(finalize(c,pays,ts,true));
  }
  list.sort((a,b)=>a.ts-b.ts);
  return list;
}

/* ---------- calculs ---------- */
const prod=id=>S.products.find(p=>p.id===id);
function totalsBase(c){
  let sub=0,items=0,jumpers=0,dur=0;
  const L=c.lines.map(l=>{const p=prod(l.pid);const t=p.price*l.qty;sub+=t;items+=l.qty;if(p.jumper){jumpers+=l.qty;dur=Math.max(dur,p.dur||60)}return{...l,p,t}});
  const promo=c.disc.t==='pct'?Math.round(sub*c.disc.v/100):Math.min(sub,c.disc.v*100);

  const T=totals(c);const vat={};

  });

}
function baseBooked(date,h){if(S.noDemo)return 0;
  const d=new Date(date+'T12:00'),we=d.getDay()===0||d.getDay()===6;
  const prof=[.15,.35,.6,.8,.95,.9,.7,.45,.25][Math.max(0,Math.min(8,Math.round((h-S.settings.open)/Math.max(1,S.settings.close-S.settings.open)*8)))];
  const j=Math.abs(Math.sin(h*12.9898+d.getDate()*78.233+d.getMonth()*3.1)*43758.5453)%1;
  return Math.min(S.settings.cap,Math.round(S.settings.cap*prof*(we?1:.55)*(.75+.35*j)));
}
function bookedOld(date,h){
  const key=date+'|'+h;
  return Math.min(S.settings.cap,baseBooked(date,h)+S.sales.filter(s=>s.slot===key).reduce((a,s)=>a+s.jumpers,0));
}

function niceStep(v){const raw=v/4;return [5000,10000,20000,25000,50000,100000,200000,500000].find(s=>s>=raw)||1000000}

  const step=niceStep(Math.max(...byH,1)),max=step*4;
  const W=640,H=230,L=52,R=8,T=10,B=26,pw=W-L-R,ph=H-T-B,bw=pw/HOURS.length;

  byH.forEach((v,i)=>{const h=ph*v/max,x=L+bw*i+bw*.2;svg+=`<rect class="ch-bar" x="${x}" y="${T+ph-h}" width="${bw*.6}" height="${Math.max(h,0)}" rx="4"/><text class="ch-t" x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${HOURS[i]}h</text>`});

    <div class="card"><h3>Ventes par catégorie</h3>${CATS.filter(c=>ct[c.id]).map(c=>mr(c.name,eur(ct[c.id]),Math.round(ct[c.id]/(ca||1)*100),`background:var(${c.v})`)).join('')||'<p class="muted">Aucune vente aujourd’hui.</p>'}</div></div>

const SHIFT={M:['Matin','9h30–15h30'],S:['Soir','14h–20h'],J:['Journée','9h30–19h30']};
let MIN_STAFF=3,CP_TOTAL=25;
function seedStaff(){
  const P=(id,n,r)=>({id,name:n,role:r});
  return [P('e1','Sarah Lambert','resp'),P('e2','Mehdi Benali','accueil'),P('e3','Chloé Girard','mon'),P('e4','Yanis Moreau','mon'),P('e5','Emma Faure','anniv'),P('e6','Tom Leroy','mon')];
}
function seedLeaves(){
  const t=today(),L=(id,s,f,to,st)=>({id:uid(),staffId:s,from:f,to:to,status:st});
  return [L('',"e3",addDays(t,9),addDays(t,13),'ok'),L('',"e5",addDays(t,16),addDays(t,18),'pending'),L('',"e2",addDays(t,-20),addDays(t,-16),'ok')];
}
function seedShifts(){}
const CHECKS=[
  {g:'Zones de jeu',items:[['toiles','Toiles de trampoline'],['coussins','Coussins de protection'],['matelas','Matelas'],['mousse','Fosses en mousse'],['filets','Filets']]},
  {g:'Airbags',items:[['airbags','État des airbags'],['pression','Pression des airbags','val']]},
  {g:'Accueil du public',items:[['conformite','Conformité à l’accueil du public']]}
];
const CHECK_IDS=CHECKS.flatMap(g=>g.items.map(i=>i[0]));
function seedChecks(){
  const o={};
  for(let i=1;i<=6;i++){const d=addDays(today(),-i),items={};CHECK_IDS.forEach(k=>items[k]={s:'ok',note:''});
    if(i===3){items.filets={s:'ko',note:'Maille déchirée côté fosse, réparée par Yanis'}}
    o[d]={items,press:'',by:S.staff[i%S.staff.length].id,ts:new Date(d+'T09:'+pad(10+i*3)+':00').getTime(),done:true};}
  return o;
}
const staffOf=id=>S.staff.find(s=>s.id===id)||{name:'?',role:'mon'};
const wdOf=ds=>new Date(ds+'T12:00').getDay();
function leaveDays(f,t){const o=[];let d=f,n=0;while(d<=t&&n<60){const w=wdOf(d);if(w!==0&&w!==6)o.push(d);d=addDays(d,1);n++}return o}
function onLeave(id,ds){return S.leaves.find(l=>l.staffId===id&&l.status==='ok'&&ds>=l.from&&ds<=l.to)}
function shiftOf(ds,id){
  if(onLeave(id,ds))return'L';
  const k=ds+'|'+id;if(S.shifts[k]!==undefined)return S.shifts[k];
  const i=S.staff.findIndex(s=>s.id===id),w=wdOf(ds);
  if(w===i%7||w===(i+3)%7)return'R';
  return['J','M','S','M','S','J'][i%6];
}
function onDuty(ds){return S.staff.filter(s=>['M','S','J'].includes(shiftOf(ds,s.id)))}
function leaveUsed(id,st){return S.leaves.filter(l=>l.staffId===id&&st.includes(l.status)).reduce((a,l)=>a+leaveDays(l.from,l.to).length,0)}
const checkToday=()=>S.checks[today()]||null;
function ctrlBanner(){
  const c=checkToday();
  if(c&&c.done)return '';
  return `<div class="banner"><span>Le contrôle visuel du jour n’est pas encore validé.</span><a class="btn" href="#controle">Faire le contrôle</a></div>`;
}

/* ---------- après encaissement : événement, points, paliers ---------- */
function palierMail(cl,p){
  return {subject:'Bravo '+firstName(cl.name)+', vous avez atteint le palier '+p.name+' !',
    body:'Bonjour '+firstName(cl.name)+',\n\nMerci pour votre fidélité chez '+S.settings.name+'. Vous avez atteint '+p.pts+' points : '+eur(p.amt)+' offerts vous attendent lors de votre prochain passage. Donnez simplement votre nom en caisse.\n\nÀ très vite !\nL’équipe'};
}
function sendPalierMail(cl,p){
  if(!S.settings.autoMail||!cl.optin||!cl.email)return false;
  const m=palierMail(cl,p);
  S.mails.unshift({id:uid(),ts:Date.now(),kind:'auto',to:cl.name,email:cl.email,subject:m.subject,body:m.body,count:1});
  return true;
}
function afterSaleBase(sale,c){
  if(c.event&&c.lines.some(l=>prod(l.pid).event)){
    const ep=c.lines.map(l=>prod(l.pid)).find(p=>p&&p.event);
    S.events.push({id:uid(),date:c.event.date,h:c.event.h,dur:2,room:c.event.room,title:c.event.title,guests:ep?ep.guests:10,pack:c.event.pack,clientId:c.clientId||null,sale:sale.no});
  }
  const cl=c.clientId?clientById(c.clientId):null;if(!cl)return;
  const rw=rewardOf(c);
  if(rw){const r=cl.rewards.find(r=>r.pal===c.rewardPal&&!r.used);if(r)r.used=true}
  const before=cl.pts,earned=Math.floor(sale.total/100*S.settings.ppe);cl.pts+=earned;sale.pts=earned;
  PAL.forEach(p=>{if(before<p.pts&&cl.pts>=p.pts){cl.rewards.push({pal:p.id,used:false});
    const sent=sendPalierMail(cl,p);
    setTimeout(()=>toast('Palier '+p.name+' atteint par '+firstName(cl.name)+(sent?' : e-mail automatique envoyé':'')),500)}});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'bkday':{book.date=d.d;
      if(book.ev){if(book.h!=null&&!Object.keys(ROOMS).some(r=>roomFree(book.date,book.h,r)))book.h=null;if(book.room&&(book.h==null||!roomFree(book.date,book.h,book.room)))book.room=null}
      else if(book.h!=null&&S.settings.cap-booked(book.date,book.h)<=0)book.h=null;
      renderBook();break}
    case 'bkh':{book.h=d.h===''?null:+d.h;if(book.ev&&book.room&&book.h!=null&&!roomFree(book.date,book.h,book.room))book.room=null;
      if(!book.ev&&book.h!=null)book.qty=Math.max(1,Math.min(book.qty,S.settings.cap-booked(book.date,book.h)));renderBook();break}
    case 'bkq':book.qty=Math.max(1,book.qty+ +d.d);renderBook();break;
    case 'bkroom':book.room=d.r;renderBook();break;
    case 'bkok':if(bookReady())bookApply();break;
    case 'rwd':cart.rewardPal=cart.rewardPal===d.p?null:d.p;drawCart();break;
    case 'rebook':{const l=cart.lines.find(l=>prod(l.pid).jumper);if(l)openBook(l.pid,true);break}
    case 'rebookev':{const l=cart.lines.find(l=>prod(l.pid).event);if(l)openBook(l.pid,false);break}
  }
});

/* ---------- départs toutes les 15 minutes ---------- */
let QSTART=600,QEND=1125;
const QS=[];for(let m=QSTART;m<=QEND;m+=15)QS.push(m);
const fm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function nextQ(){const n=new Date(),m=n.getHours()*60+Math.ceil(n.getMinutes()/15)*15;return m<QSTART?QSTART:m>QEND?null:m}
function occ(date,m){
  const h=Math.floor(m/60),base=h>=S.settings.open&&h<S.settings.close?baseBooked(date,h):0;let ex=0;
  S.sales.forEach(s=>{if(s.slot&&s.slot.startsWith(date)){const st=+s.slot.split('|')[1];if(st<=m&&m<st+(s.dur||60))ex+=s.jumpers}});
  return Math.min(S.settings.cap,base+ex);
}
function leftFor(date,start,dur){let mx=0;for(let t=start;t<start+dur;t+=15)mx=Math.max(mx,occ(date,t));return S.settings.cap-mx}
const booked=(date,h)=>occ(date,h*60);
const hdrCells=()=>Array.from({length:AX1-AX0},(_,i)=>`<span class="hh" style="grid-column:${i*4+1}/span 4">${AX0+i}h</span>`).join('');
function nowLine(ds){const n=new Date(),t=n.getHours()+n.getMinutes()/60;return ds===today()&&t>=AX0&&t<=AX1?`<i class="now" style="left:${(t-AX0)/(AX1-AX0)*100}%"></i>`:''}
const dayChips=ds=>`<div class="chips">${Array.from({length:7},(_,i)=>addDays(today(),i)).map((d,i)=>`<button class="chip ${d===ds?'on':''}" data-act="day" data-d="${d}">${i===0?'Aujourd’hui':dshort(d)}</button>`).join('')}</div>`;
const tlRow=(ds,lab,sub,inner,extra='')=>`<div class="tl-row"><div class="tl-lab">${lab}${sub?`<small>${sub}</small>`:''}</div><div class="tl-track ${extra}">${inner}${nowLine(ds)}</div></div>`;
const tlHead=ds=>`<div class="tl-row hd"><div class="tl-lab"></div><div class="tl-track hdt">${hdrCells()}${nowLine(ds)}</div></div>`;

/* ---------- réservation guidée, départs de 15 minutes ---------- */
function openBook(id,change){
  const p=prod(id),ev=!!p.event,T=totals(cart);
  book={pid:id,change,ev,qty:1,dur:change?(T.dur||60):(p.dur||60),date:ev?(cart.event?cart.event.date:today()):cart.slotDate,
    m:ev?(cart.event?cart.event.h*60:null):cart.slotM,hh:null,room:ev&&cart.event?cart.event.room:null,
    title:ev&&cart.event?cart.event.title:(cart.clientId?'Anniversaire de '+firstName(clientById(cart.clientId).name):'')};
  book.hh=!ev&&book.m!=null?Math.floor(book.m/60):null;
  renderBook();
}
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const bkPast=m=>book.date===today()&&m+15<=nowMin();
const bkNeed=()=>totals(cart).jumpers+(book.change?0:book.qty);
function bookReady(){
  if(book.ev)return book.m!=null&&!!book.room&&!!book.title.trim();
  if(book.m==null)return false;
  return leftFor(book.date,book.m,book.dur)>=bkNeed()&&!bkPast(book.m);
}
function renderBook(){
  const p=prod(book.pid);
  const dayHtml=`<div class="chips" style="margin:0">${Array.from({length:7},(_,i)=>addDays(today(),i)).map((d,i)=>`<button class="chip ${d===book.date?'on':''}" data-act="bk2day" data-d="${d}">${i===0?'Aujourd’hui':dshort(d)}</button>`).join('')}</div>`;
  let body;
  if(!book.ev){
    const hrs=HOURS.map(h=>{const best=Math.max(...[0,15,30,45].map(q=>bkPast(h*60+q)?0:leftFor(book.date,h*60+q,book.dur)));
      return `<button class="hr ${book.hh===h?'on':''}" data-act="bk2hh" data-h="${h}" ${best<=0?'disabled':''}><b>${h}h</b><span>${[0,15,30,45].every(q=>bkPast(h*60+q))?'passé':best<=0?'complet':best+' places'}</span></button>`}).join('');
    const qs=book.hh==null?'':`<div class="lab">Heure de départ</div><div class="hrs">${[0,15,30,45].map(q=>{const m=book.hh*60+q,left=bkPast(m)?0:leftFor(book.date,m,book.dur);
      return `<button class="hr ${book.m===m?'on':''}" data-act="bk2m" data-m="${m}" ${left<=0?'disabled':''}><b>${fm(m)}</b><span>${bkPast(m)?'passé':left<=0?'complet':left+' places'}</span></button>`}).join('')}</div>`;
    const left=book.m!=null?leftFor(book.date,book.m,book.dur):S.settings.cap,need=bkNeed();
    body=`<div class="lab">Heure</div><div class="hrs">${hrs}</div>${qs}
      ${book.m!=null?(b=>`<div class="brl">${swatch(b.color)}<b>Bracelet ${b.name}</b><span class="muted">${book.dur} min, sortie à ${b.exit}, valable jusqu’à ${b.until}h</span></div>`)(bracelet(book.m,book.dur)):''}
      ${book.change?'':`<div class="lab">Nombre de personnes</div>
      <div class="qtyx"><button class="ix" data-act="bk2q" data-d="-1" aria-label="Moins">${ic('minus')}</button><b class="num">${book.qty}</b><button class="ix" data-act="bk2q" data-d="1" aria-label="Plus">${ic('plus')}</button><span class="muted">${eur(p.price*book.qty)}</span></div>`}
      ${book.m!=null&&need>left?`<p class="warn-t">Il ne reste que ${left} place${left>1?'s':''} sur ce départ.</p>`:''}`;
  }else{
    const hrs=EVH.map(h=>{const n=Object.keys(ROOMS).filter(r=>roomFree(book.date,h,r)).length;
      return `<button class="hr ${book.m===h*60?'on':''}" data-act="bk2eh" data-h="${h}" ${n?'':'disabled'}><b>${pad(h)}:00</b><span>${n?n+' salle'+(n>1?'s':'')+' libre'+(n>1?'s':''):'complet'}</span></button>`}).join('');
    const rooms=Object.entries(ROOMS).map(([r,l])=>{const ok=book.m!=null&&roomFree(book.date,book.m/60,r);
      return `<button class="hr ${book.room===r?'on':''}" data-act="bkroom" data-r="${r}" ${ok?'':'disabled'}><b>${l}</b><span>${book.m==null?'choisir une heure':ok?'libre':'occupée'}</span></button>`}).join('');
    body=`<div class="lab">Début de l’événement (durée 2 h)</div><div class="hrs">${hrs}</div><div class="lab">Salle</div><div class="hrs">${rooms}</div>
      <div class="field"><label for="bktitle">Nom de l’événement</label><input id="bktitle" value="${esc(book.title)}" placeholder="Anniversaire de Léo" autocomplete="off"></div>`;
  }
  showModal(`${mh(book.ev?'Réserver l’événement':book.change?'Changer le créneau':'Réserver le créneau')}<p><b>${esc(p.name)}</b> <span class="muted">· ${eur(p.price)}</span></p>
    <div><div class="lab" style="margin-bottom:8px">Jour</div>${dayHtml}</div>${body}
    <button class="btn-pay" data-act="bkok" ${bookReady()?'':'disabled'}>${book.change?'Valider le créneau':'Ajouter au panier'}</button>`);
}
function bookApply(){
  const p=prod(book.pid);
  if(book.ev){
    cart.lines=cart.lines.filter(l=>!prod(l.pid).event);cart.lines.push({pid:p.id,qty:1});
    cart.event={date:book.date,h:book.m/60,room:book.room,title:book.title.trim(),pack:p.name};
  }else{
    cart.slotDate=book.date;cart.slotM=book.m;

function bracelet(start,dur){const endM=start+dur,until=Math.ceil(endM/60),c=BR[until%6];return{name:c[0],color:c[1],until,exit:fm(endM)}}

const SAT=[[0,[232,241,255]],[.3,[255,240,205]],[.6,[255,184,120]],[.85,[240,92,80]],[1,[196,28,40]]];
function satStyle(p){
  p=Math.max(0,Math.min(1,p));let a=SAT[0],b=SAT[SAT.length-1];
  for(let i=0;i<SAT.length-1;i++)if(p>=SAT[i][0]&&p<=SAT[i+1][0]){a=SAT[i];b=SAT[i+1];break}
  const t=b[0]===a[0]?0:(p-a[0])/(b[0]-a[0]),c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*t));
  const lum=(c[0]*299+c[1]*587+c[2]*114)/1000;
  return[`rgb(${c})`,lum>150?'#0A1F4D':'#FFFFFF'];
}

   ${isAdmin()?`<button class="btn" data-act="slotshut" data-m="${m}" style="width:100%">${shut?'Rouvrir ce créneau':'Fermer ce créneau aux ventes'}</button>`:''}
   <div class="grp-h">Choix d’activités</div>
   <div class="atiles">${prods.map(p=>`<div class="at" style="--cat:var(${cat(p.cat).v})"><div class="atart">${art(p)}</div><b>${esc(p.name)}</b><span class="muted num">${eur(p.price)}</span><div class="step"><button data-act="sq" data-id="${p.id}" data-d="-1" aria-label="Retirer un">${ic('minus')}</button><b class="num">${slotSel[p.id]||0}</b><button data-act="sq" data-id="${p.id}" data-d="1" aria-label="Ajouter un">${ic('plus')}</button></div></div>`).join('')}</div>
   ${need>left&&!shut?`<p class="warn-t">Il ne reste que ${Math.max(0,left)} place${left>1?'s':''} sur ce créneau.</p>`:''}${shut?'<p class="warn-t">Ce créneau est fermé aux ventes.</p>':''}${past?'<p class="warn-t">Ce créneau est déjà passé.</p>':''}

Derniers incidents : ${inc.join(' | ')||'aucun'}.
Dernières maintenances : ${mn.join(' | ')||'aucune'}.`;

async function aiRun(prompt,{json=false,onText}={}){
  ctl.busy=true;
  try{return json?await SAMPLE.json(prompt,{modelTier:'quick'}):(await SAMPLE(prompt,{modelTier:'default',onText})).text}
  finally{ctl.busy=false}
}
function aiShow(t){ctl.aiOut=t;const o=$('#aiout');if(o)o.textContent=t}
const AIRULES='Tu es l’assistant intégré de Lago, logiciel de gestion de parc de trampolines. Réponds en français, de façon courte, concrète et factuelle, sans inventer de données absentes. Tu aides à la sécurité et à l’exploitation ; tu ne remplaces pas un contrôle réglementaire.';
async function aiAction(k){
  try{
    if(k==='mon'){const r=monRec();aiShow('Analyse en cours…');
      const rows=MPTS.map((l,i)=>`${l} : ${r.items[i]||'non renseigné'}`).join('\n');
      const prev=Object.entries(S.monthly).filter(([kk])=>kk<ctl.mon).sort().slice(-3).map(([kk,x])=>kk+' NC: '+(MPTS.filter((_,i)=>x.items[i]==='NC').join('; ')||'aucun')).join('\n');
      await aiRun(AIRULES+'\nAnalyse ce contrôle mensuel : 1) résumé en une phrase, 2) points NC et priorité (urgent / à planifier), 3) récurrences avec les mois précédents, 4) l’ouverture au public est-elle raisonnable ? Maximum 120 mots.\n\n'+rows+'\nPressions : '+r.p1+' / '+r.p2+' hPa\nObservations : '+r.obs+'\nMois précédents :\n'+(prev||'aucun'),{onText:({text})=>aiShow(text)})}
    else if(k==='incs'){aiShow('Analyse en cours…');
      await aiRun(AIRULES+'\nVoici les incidents. Repère les tendances (zones, types, horaires, publics), les risques et propose 3 actions de prévention. Maximum 130 mots.\n\n'+S.incidents.map(x=>`${x.date} ${x.time} | ${x.who} | ${x.types.join('/')} | douleur ${x.pain==null?'?':x.pain} | ${x.desc}`).join('\n'),{onText:({text})=>aiShow(text)})}
    else if(k==='incdraft'){const n=($('#incnotes')||{}).value||'';if(n.trim().length<8){toast('Saisissez quelques notes');return}
      ctl.inc.notes=n;toast('Rédaction en cours…');
      const j=await aiRun(AIRULES+'\nÀ partir de ces notes d’un employé, rédige la description factuelle de l’incident (3 à 5 phrases, neutre, sans jugement ni faute attribuée, sans rien inventer). Réponds uniquement en JSON : {"description":string,"types":[parmi '+JSON.stringify(ITYPES)+'],"douleur":nombre 0-10 ou null}.\n\nNotes : '+n,{json:true});
      if(j&&typeof j.description==='string'){ctl.inc.desc=j.description;if(Array.isArray(j.types)&&!ctl.inc.types.length)ctl.inc.types=j.types.filter(x=>ITYPES.includes(x));if(typeof j.douleur==='number'&&ctl.inc.pain==null)ctl.inc.pain=Math.max(0,Math.min(10,Math.round(j.douleur)));subR();toast('Description rédigée : relisez avant de signer')}}
    else if(k==='mntsug'){const d=ctl.mnt;if(!d.pb.trim()){toast('Décrivez d’abord le problème');return}
      toast('Réflexion en cours…');
      const j=await aiRun(AIRULES+'\nUn employé décrit un problème sur l’équipement « '+d.equip+' » (maintenance '+d.type.toLowerCase()+'). Propose une action concrète et les pièces probables. Réponds uniquement en JSON : {"action":string,"pieces":string}.\n\nProblème : '+d.pb,{json:true});
      if(j&&j.action){if(!d.action)d.action=String(j.action);if(!d.pieces&&j.pieces)d.pieces=String(j.pieces);subR();toast('Suggestion ajoutée : à vérifier')}}
  }catch(e){const m=AIERR[e.code];if(e.code==='not_granted'||e.code==='sampling_disabled'){SAMPLE=null;subR()}if(m!=='')toast(m||'L’assistant est indisponible');if(e.text&&k==='mon'||e.text&&k==='incs')aiShow(e.text);else if(k==='mon'||k==='incs')aiShow('')}
  ctl.busy=false;
}

  if(!q.trim()||ctl.busy||!SAMPLE)return;

  try{const r=await SAMPLE(turns,{cache:false,modelTier:'default',onText:({text})=>{const b=bub();if(b)b.textContent=text}});

function pdfBuild(title,sub,foot,fn){
  const W=595,H=842,M=42,pages=[];let cur,y;
  const st=S.settings,LG=st.logoJ?{bin:atob(st.logoJ.split(',')[1]),w:st.logoW,h:st.logoH}:null;
  const MAP={'’':"'",'‘':"'",'“':'"','”':'"','–':'-','—':'-','…':'...','•':'-','→':'->','€':'\x80','œ':'\x9c','Œ':'\x8c'};
  const enc=s=>String(s==null?'':s).replace(/\u202f/g,' ').replace(/[’‘“”–—…•→€œŒ]/g,c=>MAP[c]).replace(/[^\x09\x20-\xff]/g,'?').replace(/[\\()]/g,'\\$&').replace(/\t/g,' ');

async function doPdf(k,id){

function fileToData(file,max,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.drawImage(im,0,0,w,h);const png=c.toDataURL('image/png');
    x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);
    cb({png,jpg:c.toDataURL('image/jpeg',.85),w,h})};
    im.onerror=()=>toast('Image illisible');im.src=fr.result};
  fr.readAsDataURL(file);
}

const SKEY='lago-sess',LKEY='lago-lastacc';
let LOCKS={};
async function hashPw(pw,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+pw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const s=salt+'|'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16)}
}
const accs=()=>S.accounts||(S.accounts=[]);
const pendingCount=()=>accs().filter(a=>a.status==='pending').length;
let ME=null;
const curAcc=()=>ME;const curStaff=()=>ME&&ME.staffId||'';
const gate=()=>$('#gate')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'gate'}));
function gateShellBase(inner){const st=S.settings;gate().innerHTML=`<div class="gcard"><div class="glogo">${st.logo?`<img src="${st.logo}" alt="">`:`<span class="lmark">${ic('wave')}</span><span class="lt">lago</span>`}</div><p class="gname">${esc(st.name)}</p>${inner}</div>`;gate().hidden=false}
function gateStart(){
  const act=accs().filter(a=>a.status==='active');
  if(!accs().length)return gateSetup();
  const last=(()=>{try{return localStorage.getItem(LKEY)}catch(e){return null}})();
  act.sort((a,b)=>(b.id===last)-(a.id===last));
  gateShell(`<h2>Qui êtes-vous ?</h2><div class="gav">${act.map(a=>`<button class="gu" data-act="g_pick" data-id="${a.id}">${avA(a,0)}<b>${esc(a.name.split(' ')[0])}</b></button>`).join('')}</div>
   <div class="gfoot"><button class="btn" data-act="g_other">Autre compte</button><button class="btn" data-act="g_new">${ic('plus')}Créer mon compte</button></div>`);
}
function gateSetup(){gateShell(`<h2>Bienvenue sur Lago</h2><p class="muted">Créez le compte administrateur. Il validera ensuite les comptes de l’équipe.</p>${gform('setup')}`)}
function gform(kind){
  const nw=kind==='new'||kind==='setup';
  return `<form id="gform" data-kind="${kind}">
   ${nw?`<div class="field"><label for="gn">Prénom et nom</label><input id="gn" required autocomplete="name"></div>`:''}
   <div class="field"><label for="gi">Identifiant (e-mail ou pseudo)</label><input id="gi" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" ${kind==='pick'?'value="'+esc(gform.ident||'')+'" readonly':''}></div>
   <div class="field"><label for="gp">Mot de passe</label><input id="gp" type="password" required minlength="6" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="${nw?'new-password':'current-password'}"></div><label class="check" style="margin:-4px 0 10px"><input type="checkbox" id="gshow">Afficher le mot de passe</label>
   
   ${kind==='new'?`<div class="field"><label for="gstf">Je suis (facultatif)</label><select id="gstf"><option value="">—</option>${(S.staff||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>`:''}
   ${kind!=='new'&&kind!=='setup'?`<label class="check"><input type="checkbox" id="grem" checked>Rester connecté</label>`:''}
   <p id="gerr" class="gerr"></p><button class="btn primary gbtn" type="submit">${kind==='new'?'Demander mon compte':kind==='setup'?'Créer et entrer':'Se connecter'}</button>
   ${kind==='pick'||kind==='other'?'<button type="button" class="glink" data-act="g_forgot">Mot de passe oublié ?</button>':''}<div class="gfoot">${kind==='new'||kind==='other'?'<button type="button" class="btn" data-act="g_back">Retour</button>':kind==='pick'?'<button type="button" class="btn" data-act="g_back">Changer de compte</button>':''}</div></form>`;
}
function gatePick(id){const a=accs().find(x=>x.id===id);gform.ident=a.ident;
  gateShell(`<div class="gpick">${avA(a,1)}<h2>${esc(a.name)}</h2></div>${gform('pick')}`);gform.ident='';
  const f=$('#gform');f.dataset.id=id;setTimeout(()=>{const p=$('#gp');if(p)p.focus()},50)}
function login(a,remember){
  ME=a;ROLEMODE=a.admin?'admin':'operator';PROF=a.admin?'-':(a.profileId||'-');
  try{localStorage.setItem(LKEY,a.id);(remember===false?sessionStorage:localStorage).setItem(SKEY,a.id);if(remember===false)localStorage.removeItem(SKEY)}catch(e){}
  gate().hidden=true;tab.staff=(a.admin||perm('staff:all'))?tab.staff:'monplan';chrome();if(location.hash!=='#accueil'){location.hash='accueil'}else route();chrome();armLock();noteNew();
  if(a.admin&&pendingCount())toast(pendingCount()+' demande(s) de compte à valider');
}
function logout(){ME=null;ROLEMODE='operator';PROF='-';try{localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY)}catch(e){}closeModal();chrome();route();gateStart()}
function bootGateBase(){
  let id=null;try{id=localStorage.getItem(SKEY)||sessionStorage.getItem(SKEY)}catch(e){}
  const a=accs().find(x=>x.id===id&&x.status==='active');
  if(a)login(a);else gateStart();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='gform')return;e.preventDefault();
  const f=e.target,k=f.dataset.kind,err=m=>{$('#gerr').textContent=m},btn=f.querySelector('button[type=submit]');
  const ident=$('#gi').value.trim().toLowerCase(),pw=$('#gp').value.trim();btn.disabled=true;
  try{
    if(k==='new'||k==='setup'){
      
      if(accs().some(a=>a.ident===ident)){err('Cet identifiant existe déjà.');return}
      const id=uid(),first=k==='setup';
      const a={id,name:$('#gn').value.trim(),ident,pwd:pw?await hashPw(pw,id):'',status:first?'active':'pending',admin:first,profileId:'',staffId:k==='new'?$('#gstf').value:'',ts:Date.now()};
      accs().push(a);save();
      if(first)login(a,true);
      else gateShell(`<div class="gpick"><span class="avatar big ok">${ic('check')}</span><h2>Demande envoyée</h2></div><p class="muted" style="text-align:center">Votre compte sera utilisable dès que l’administrateur l’aura validé.</p><div class="gfoot"><button class="btn primary" data-act="g_back">Retour</button></div>`);
    }else{
      const a=k==='pick'?accs().find(x=>x.id===f.dataset.id):accs().find(x=>x.ident===ident);
      if(!a){err(cloudOn()?'Compte introuvable. Vérifiez l’identifiant, ou choisissez votre prénom dans la liste.':'Compte introuvable : cet appareil n’est pas connecté à l’équipe. Ouvrez le lien d’équipe envoyé par votre responsable.');return}
      const lk=LOCKS[a.id];if(lk&&lk.until>Date.now()){err('Trop d’essais. Réessayez dans '+Math.ceil((lk.until-Date.now())/1000)+' s.');return}
      if(a.status==='pending'){err('Compte en attente : l’administrateur doit le valider dans Paramètres › Comptes › Demandes à valider.');return}
      if(a.status!=='active'){err('Ce compte est désactivé. Contactez l’administrateur.');return}
      if(!a.pwd){a.pwd=await hashPw(pw,a.id);save()}else if(await hashPw(pw,a.id)!==a.pwd&&await hashPw($('#gp').value,a.id)!==a.pwd){const l=LOCKS[a.id]=LOCKS[a.id]||{n:0,until:0};l.n++;if(l.n>=5){l.until=Date.now()+30000;l.n=0}err('Mot de passe incorrect. Un oubli ? Touchez « Mot de passe oublié ? » ci-dessous.');$('#gp').value='';$('#gp').focus();return}
      delete LOCKS[a.id];login(a,$('#grem')?$('#grem').checked:true);
    }
  }finally{btn.disabled=false}
});

function hoursInit(){const st=S.settings;if(!S.hours){S.hours={week:{},exc:[]};for(let d=0;d<7;d++)S.hours.week[d]={closed:false,o:st.open*60,c:st.close*60}}}
function hoursFor(ds){
  hoursInit();const dow=new Date(ds+'T12:00:00').getDay();let r={...S.hours.week[dow],label:''};
  S.hours.exc.forEach(x=>{if(ds>=x.from&&ds<=x.to)r={closed:!!x.closed,o:x.o,c:x.c,label:x.label||''}});return r;
}
const openAt=(ds,t)=>{const h=hoursFor(ds);return !h.closed&&t>=h.o&&t+15<=h.c};
function syncEnvelope(){
  hoursInit();const all=[...Object.values(S.hours.week),...S.hours.exc].filter(x=>!x.closed);if(!all.length)return;
  S.settings.open=Math.floor(Math.min(...all.map(x=>x.o))/60);S.settings.close=Math.ceil(Math.max(...all.map(x=>x.c))/60);applySettings();
}

function countUp(el){
  const txt=el.textContent,mt=txt.match(/[\d   ]+(?:,\d+)?/);if(!mt)return;
  const raw=mt[0],dec=(raw.split(',')[1]||'').length,val=parseFloat(raw.replace(/[\s  ]/g,'').replace(',','.'));if(!isFinite(val)||val===0)return;
  const pre=txt.slice(0,mt.index),post=txt.slice(mt.index+raw.length),t0=performance.now(),D=700;
  const f=v=>v.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=pre+f(val*e)+post;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}

let TXBusy=false,TXMark=false,TXq=0,editOn=false,editActive=false,TXO=null;
function applyTexts(){
  if(TXBusy)return;
  const T=safeMode()?{}:(S.settings.texts||{}),keys=Object.keys(T);
  if(!keys.length&&!TXMark)return;
  TXBusy=true;
  try{
    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest('#lago-edit')))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
    const L=[];let n;while((n=w.nextNode()))L.push(n);
    let marked=false;
    L.forEach(n=>{
      const cur=n.nodeValue,t=cur.trim(),o=n.__lo;
      if(o!==undefined){
        if(Object.prototype.hasOwnProperty.call(T,o)){marked=true;if(t!==T[o])n.nodeValue=cur.replace(t,()=>T[o])}
        else{n.nodeValue=cur.replace(t,()=>o);delete n.__lo}
      }else if(t&&Object.prototype.hasOwnProperty.call(T,t)){n.__lo=t;marked=true;n.nodeValue=cur.replace(t,()=>T[t])}
    });
    TXMark=marked||keys.length>0;
  }finally{TXBusy=false;try{if(TXO)TXO.takeRecords()}catch(e){}}
}
try{TXO=new MutationObserver(()=>{if(TXBusy||TXq)return;TXq=requestAnimationFrame(()=>{TXq=0;applyTexts()})});TXO.observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}
function textAt(x,y,el){
  let n=null;
  try{
    if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r&&r.startContainer.nodeType===3)n=r.startContainer}
    else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p&&p.offsetNode&&p.offsetNode.nodeType===3)n=p.offsetNode}
  }catch(_){}
  if(!n||!n.nodeValue.trim()){n=null;for(const c of el.childNodes)if(c.nodeType===3&&c.nodeValue.trim()){n=c;break}}
  return n;
}

function mpWeeks(sid){
  const start=addDays(addDays(today(),-dowOf(today())),mp.off*7),W=[];

  if(c||r.length){r.push(c);if(r.some(x=>x.trim()))R.push(r)}return R}
function tableFromText(t){
  t=t.replace(/^﻿/,'');
  if(/^\s*<(\?xml|!doctype|html|table|meta)/i.test(t)||/<table/i.test(t.slice(0,3000))){
    const doc=new DOMParser().parseFromString(t,'text/html'),R=[];
    doc.querySelectorAll('tr').forEach(tr=>{const r=[...tr.children].filter(x=>/^t[dh]$/i.test(x.tagName)).map(x=>x.textContent.replace(/\s+/g,' ').trim());if(r.some(x=>x))R.push(r)});

async function unzipX(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const F={};
  for(let i=0;i<n;i++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);

  return{names:Object.keys(F),async get(name){const f=F[name];if(!f)return null;const s=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true),data=u.subarray(s,s+f.csz);

  const z=await unzipX(buf),px=s=>new DOMParser().parseFromString(s,'application/xml');

  if(sst)px(sst).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
  if(!sheets.length)throw new Error('sheet');

  doc.querySelectorAll('sheetData row').forEach(row=>{const r=[];
    row.querySelectorAll('c').forEach(c=>{const ref=c.getAttribute('r')||'',col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t'),v=c.querySelector('v');let val='';
      if(t==='s'&&v)val=ss[+v.textContent]||'';else if(t==='inlineStr')val=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;
      r[col>=0?col:r.length]=val});
    for(let i=0;i<r.length;i++)if(r[i]===undefined)r[i]='';

async function readTable(file){
  const buf=await file.arrayBuffer(),u=new Uint8Array(buf.slice(0,4));

function qDate(v){v=String(v==null?'':v).trim();if(/^\d{5}(\.\d+)?$/.test(v)&&+v>20000&&+v<80000)return xlD(v);
  let m=v.match(/(\d{1,2})\s+(janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c)[a-zé.]*\.?\s+(\d{4})/i);
  if(m){const k=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'].findIndex(x=>norm(m[2]).startsWith(x.slice(0,4))||norm(m[2]).startsWith(x));if(k>=0)return m[3]+'-'+pad(k+1)+'-'+pad(+m[1])}
  return pDate(v)}
function qTime(v){v=String(v==null?'':v).trim();if(/^\d+(\.\d+)?$/.test(v)){const x=parseFloat(v);if(x>0&&x<1)return Math.round(x*1440);if(x>20000&&x<80000&&x%1)return Math.round((x%1)*1440);return null}return pTime(v)}
function qRange(v){const m=String(v||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?\s*[-–àa>]+\s*(\d{1,2})\s*[:hH]\s*(\d{2})?/);if(!m)return null;const a=+m[1]*60+(+m[2]||0),b=+m[3]*60+(+m[4]||0);return b>a?b-a:null}
function qAuto(head){const map={},used=new Set(),saved=(S.qwmeta&&S.qwmeta.map)||{};
  QWF.forEach(([k,,re])=>{let i=saved[k]!==undefined?head.findIndex(h=>h===saved[k]):-1;
    if(i<0)i=head.findIndex((h,j)=>!used.has(j)&&re.test(norm(h)));
    if(i>=0){map[k]=i;used.add(i)}});
  return map}

/* import / mise à jour */
function qwImport(head,rows,map,fname){
  const g=(r,k)=>map[k]!==undefined?String(r[map[k]]==null?'':r[map[k]]).trim():'';
  const out=[];let skip=0,canc=0;
  rows.forEach(r=>{
    const d=qDate(g(r,'date'));let t=map.time!==undefined?qTime(g(r,'time')):qTime(g(r,'date'));
    const j=map.n!==undefined?parseInt(g(r,'n')):1;
    if(!d||t==null||!(j>0)){skip++;return}
    if(map.stat!==undefined&&QCANCEL.test(g(r,'stat'))){canc++;return}
    const dur=map.dur!==undefined?(parseInt(g(r,'dur'))||null):null,rg=qRange(g(r,'time'));
    out.push({id:uid(),ref:g(r,'ref'),date:d,start:Math.floor(t/15)*15,dur:dur||rg||60,n:j,name:g(r,'name'),act:g(r,'act'),phone:g(r,'phone'),mail:g(r,'mail'),stat:g(r,'stat')});
  });
  if(!out.length)return{ok:false,skip,canc};
  const dates=out.map(x=>x.date).sort(),a=dates[0],b=dates[dates.length-1];
  S.qwres=qwres().filter(x=>x.date<a||x.date>b).concat(out);
  qwRebuild();
  const mp={};QWF.forEach(([k])=>{if(map[k]!==undefined)mp[k]=head[map[k]]});
  S.qwmeta={ts:Date.now(),file:fname||'',n:out.length,from:a,to:b,map:mp,skip,canc};
  save();return{ok:true,n:out.length,skip,canc,from:a,to:b};
}
/* le planning clients lit des « ventes » : on les régénère depuis les réservations Qweekle */
function qwRebuild(){
  S.sales=S.sales.filter(s=>!s.qw);let k=0;
  qwres().forEach(x=>{S.sales.push({id:'qw'+x.id,no:'QW-'+(++k),ts:new Date(x.date+'T'+hmm(x.start)+':00').getTime(),lines:[],sub:0,disc:0,total:0,vat:{},pay:[],clientId:null,slot:x.date+'|'+x.start,dur:x.dur||60,jumpers:x.n,qw:true,qwName:x.name||'',qwRef:x.ref||''})});
}
function qwFinish(head,rows,fname){
  const map=qAuto(head),need=['date'].filter(k=>map[k]===undefined);
  if(!need.length&&(map.time!==undefined||rows.some(r=>qTime(r[map.date])!=null))){
    const r=qwImport(head,rows,map,fname);
    if(r.ok){qwTab=null;vQwRes($('#sub'));toast(r.n+' réservation(s) à jour'+(r.canc?' · '+r.canc+' annulée(s) ignorée(s)':''));return}
  }
  qwTab={head,rows,map,fname};vQwRes($('#sub'));toast('Vérifiez l’association des colonnes');
}

  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',e=>{d=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();has=true;c.dataset.has='1';e.preventDefault()});
  c.addEventListener('pointermove',e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>c.addEventListener(n,()=>{d=false}));
  c.clear=()=>{x.clearRect(0,0,c.width,c.height);delete c.dataset.has};
}

/* ---------- X. codes promo, carnets de séances, check-in QR ---------- */
/* --- encodeur QR (octets, correction M, versions 1 à 10) --- */
const QR=(()=>{
  const ECCPB=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const rawCw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return Math.floor(r/8)};
  const rsDiv=(deg)=>{const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=mul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const res=new Array(div.length).fill(0);for(const b of data){const f=b^res.shift();res.push(0);div.forEach((c,i)=>{res[i]^=mul(c,f)})}return res};
  function make(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let ver=0;for(let v=1;v<=10;v++){const cap=rawCw(v)-ECCPB[v-1]*NB[v-1];if(bytes.length+2+(v>=10?1:0)<=cap){ver=v;break}}
    if(!ver)throw new Error('trop long');
    const n=ver*4+17,cap=rawCw(ver)-ECCPB[ver-1]*NB[ver-1];
    const bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver>=10?16:8);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    for(let p=0xEC;data.length<cap;p^=0xEC^0x11)data.push(p);
    const nb=NB[ver-1],eb=ECCPB[ver-1],raw=rawCw(ver),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(eb);
    const blocks=[];for(let i=0,k=0;i<nb;i++){const len=sl-eb+(i<ns?0:1);const d=data.slice(k,k+len);k+=len;const e=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-eb||j>=ns)all.push(b[i])});
    const M=Array.from({length:n},()=>new Array(n).fill(false)),F=Array.from({length:n},()=>new Array(n).fill(false));
    const setFn=(x,y,d)=>{if(x>=0&&x<n&&y>=0&&y<n){M[y][x]=d;F[y][x]=true}};
    for(let i=0;i<n;i++){setFn(6,i,i%2===0);setFn(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));setFn(cx+dx,cy+dy,d!==2&&d!==4)}};
    finder(3,3);finder(n-4,3);finder(3,n-4);
    if(ver>1){const na=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(na*2-2))*2,pos=[6];for(let p=n-7;pos.length<na;p-=step)pos.splice(1,0,p);
      for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setFn(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}}
    const fmt=mask=>{const d=0<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setFn(8,i,g(i));setFn(8,7,g(6));setFn(8,8,g(7));setFn(7,8,g(8));for(let i=9;i<15;i++)setFn(14-i,8,g(i));
      for(let i=0;i<8;i++)setFn(n-1-i,8,g(i));for(let i=8;i<15;i++)setFn(8,n-15+i,g(i));setFn(8,n-8,true)};
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)!==0,a=n-11+i%3,bb=Math.floor(i/3);setFn(a,bb,c);setFn(bb,a,c)}}
    let k=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-vert:vert;if(!F[y][x]&&k<all.length*8){M[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)!==0;k++}}}
    const pen=m=>{let s=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=M[y][x];if(F[y][x])continue;void v}return s};void pen;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&(x+y)%2===0)M[y][x]=!M[y][x];
    fmt(0);
    return M;
  }
  return{make};
})();
function qrSvg(text,px){
  let M;try{M=QR.make(String(text))}catch(e){return ''}
  const n=M.length,q=4;let d='';
  for(let y=0;y<n;y++){let x=0;while(x<n){if(M[y][x]){let l=1;while(x+l<n&&M[y][x+l])l++;d+=`M${x+q} ${y+q}h${l}v1h-${l}z`;x+=l}else x++}}
  return `<svg class="x3qr" viewBox="0 0 ${n+2*q} ${n+2*q}" width="${px||150}" height="${px||150}" shape-rendering="crispEdges" role="img" aria-label="QR code ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* --- codes promo --- */
const promos=()=>S.promos||(S.promos=[]);
const pNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const promoFind=code=>{const n=pNorm(code);return n?promos().find(p=>pNorm(p.code)===n):null};
const promoUses=p=>S.sales.filter(s=>s.promo&&s.promo.code===p.code);
function promoState(p){
  if(p.off)return 'off';if(p.from&&p.from>today())return 'soon';if(p.to&&p.to<today())return 'exp';
  if(p.max&&promoUses(p).length>=p.max)return 'full';return 'ok';
}
const PSTL={ok:['Actif','ok'],off:['Désactivé','bad'],soon:['À venir',''],exp:['Expiré','bad'],full:['Épuisé','bad']};
function promoCalc(c,T,rest){
  const p=promoFind(c.promo);if(!p||promoState(p)!=='ok')return null;
  if(p.min&&T.sub<p.min)return null;
  let el=p.cat?T.L.filter(l=>l.p.cat===p.cat).reduce((a,l)=>a+l.t,0):T.sub;el=Math.min(el,rest);
  const amt=p.t==='pct'?Math.round(el*p.v/100):Math.min(el,Math.round(p.v*100));
  return amt>0?{amt,code:p.code}:null;
}

/* --- carnets de séances --- */
const passes=()=>S.passes||(S.passes=[]);
const pdefs=()=>{if(!S.passDefs){const p5=S.products.find(p=>p.id==='p5');S.passDefs=p5?[{pid:'p5',n:10,months:12,dur:60}]:[]}return S.passDefs};
const findPass=code=>{const n=pNorm(code);return n?passes().find(p=>pNorm(p.code)===n):null};
function passState(p){return p.off?'off':p.left<=0?'used':(p.exp&&p.exp<today())?'exp':'ok'}
const PSLX={ok:['Valide','ok'],used:['Terminé',''],exp:['Expiré','bad'],off:['Désactivé','bad']};
function passCode(){let c;do{c='CS-';for(let i=0;i<8;i++){c+=GA[Math.floor(Math.random()*GA.length)];if(i===3)c+='-'}}while(passes().some(p=>p.code===c));return c}
function passCalc(c,T){
  const p=findPass(c.pass&&c.pass.code);if(!p||passState(p)!=='ok')return null;
  const maxD=p.dur||60,units=[];
  T.L.forEach(l=>{if(l.p.jumper&&(l.p.dur||60)<=maxD)for(let i=0;i<l.qty;i++)units.push(l.p.price)});
  units.sort((a,b)=>b-a);const k=Math.min(p.left,units.length);if(!k)return null;
  return{amt:units.slice(0,k).reduce((a,b)=>a+b,0),k,code:p.code};
}

/* --- totaux : carnet puis code promo --- */
function totals(c){
  const T=totalsBase(c);if(!T.L.length||(!c.promo&&!c.pass))return T;
  let rest=T.total,pAmt=0,pInfo=null,pcAmt=0,pcInfo=null;
  if(c.pass){const r=passCalc(c,T);if(r){pAmt=Math.min(r.amt,rest);rest-=pAmt;pInfo=r}}
  if(c.promo){const r=promoCalc(c,T,rest);if(r){pcAmt=r.amt;pcInfo=r}}
  return{...T,disc:T.disc+pAmt+pcAmt,total:T.total-pAmt-pcAmt,pAmt,pInfo,pcAmt,pcInfo};
}
function finalize(c,pays,ts,demo){
  const s=finalizeBase(c,pays,ts,demo),T=totals(c);
  if(T.pcInfo)s.promo={code:T.pcInfo.code,amt:T.pcAmt};
  if(T.pInfo)s.passUse={code:T.pInfo.code,k:T.pInfo.k,amt:T.pAmt};
  return s;
}

}

const CKEY='lago-cloud',CBOX='lago-cloud-box';
const CLOUD_SKIP=['held'],LOCAL_KEYS=['seen'];
const JM='\u0001J',NM='\u0001N',EA='\u0001A',EO='\u0001O';
const isO=x=>!!x&&typeof x==='object';
const same=(a,b)=>a===b||(isO(a)&&isO(b)&&JSON.stringify(a)===JSON.stringify(b));
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CKEY)||'null')}catch(e){return null}}
function cloudOn(){const c=cloudCfg();return !!(c&&c.u&&c.r)}
function cloudSet(c){try{c?localStorage.setItem(CKEY,JSON.stringify(c)):localStorage.removeItem(CKEY)}catch(e){}}
const kEnc=k=>String(k).replace(/[.$#\[\]\/%\x00-\x1f\x7f]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'))||'%00';
const kDec=k=>k==='%00'?'':k.replace(/%([0-9A-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
/* données Lago -> arbre Firebase */
function proj(v,key){
  if(v===undefined||typeof v==='function')return undefined;
  if(v===null)return NM;
  if(typeof v==='number')return isFinite(v)?v:undefined;
  if(typeof v!=='object')return v;
  if(Array.isArray(v)){
    if(!v.length)return EA;
    const ok=v.every(e=>isO(e)&&!Array.isArray(e)&&typeof e.id==='string'&&e.id&&!('_a' in e))&&new Set(v.map(e=>e.id)).size===v.length;
    if(!ok)return JM+JSON.stringify(v);
    const o={_a:1};
    v.forEach(e=>{const p=proj(e);if(p!==undefined)o[kEnc(e.id)]=p});
    if(!v.every(e=>typeof e.ts==='number'))o._o=JM+JSON.stringify(v.map(e=>e.id));
    return o;
  }
  const o={};let n=0;
  for(const k in v){if(LOCAL_KEYS.includes(k))continue;const p=proj(v[k]);if(p!==undefined){o[kEnc(k)]=p;n++}}
  return n?o:EO;
}
function projS(){const o={};for(const k in S){if(CLOUD_SKIP.includes(k))continue;const p=proj(S[k]);if(p!==undefined)o[kEnc(k)]=p}return o}
/* arbre Firebase -> données Lago */
function dec(n){
  if(typeof n==='string'){if(n===NM)return null;if(n===EA)return [];if(n===EO)return {};if(n.startsWith(JM)){try{return JSON.parse(n.slice(JM.length))}catch(e){return undefined}}return n}

    if(n._a){
      const items=Object.keys(n).filter(k=>k!=='_a'&&k!=='_o').map(k=>dec(n[k])).filter(x=>isO(x)&&typeof x.id==='string');
      let ord=[];if(typeof n._o==='string'){try{ord=JSON.parse(n._o.slice(JM.length))}catch(e){}}
      const pos=new Map(ord.map((id,i)=>[id,i])),allTs=items.every(x=>typeof x.ts==='number');
      items.sort((a,b)=>{
        if(allTs&&a.ts!==b.ts)return a.ts-b.ts;
        const pa=pos.has(a.id)?pos.get(a.id):1e9,pb=pos.has(b.id)?pos.get(b.id):1e9;
        return pa!==pb?pa-pb:(a.id<b.id?-1:1);
      });
      return items;
    }
    const o={};for(const k in n){const v=dec(n[k]);if(v!==undefined)o[kDec(k)]=v}return o;
  }
  return n;
}

function merge3(b,l,r){

function diffT(r,m,path,out){

function migrateImgs(){
  if(!S||S.imgMig===1||!Array.isArray(S.products))return;
  const P=S.products;
  const kind=p=>{
    if(p.img||p.cat!=='park'||!p.jumper)return null;
    const n=String(p.name||'').toLowerCase().replace(/[\s.]/g,'');
    if(/1h30/.test(n))return 'h15';
    if(/(^|[^0-9])2h(?!30)/.test(n))return 'h2';
    if(/(^|[^0-9])1h(?!30)/.test(n))return 'h1';
    const d=+p.dur||0;return d===90?'h15':d===120?'h2':d===60?'h1':null;
  };
  P.forEach(p=>{const k=kind(p);if(k)p.img=SESS_IMG[k]});
  if(!P.some(p=>p.jumper&&p.cat==='park'&&(+p.dur===120||/(^|[^0-9])2h(?!30)/.test(String(p.name||'').toLowerCase().replace(/[\s.]/g,''))))&&!P.some(p=>p.id==='p6'))
    P.push({id:'p6',name:'Session 2 h',cat:'park',price:2200,tva:10,active:false,jumper:true,dur:120,img:SESS_IMG.h2});
  S.imgMig=1;save();
}
/* ---- comptes : création directe par l'administrateur, écran de connexion à jour ---- */
function vSetAcc(m){
  vSetAccBase(m);
  if(!isAdmin())return;
  const h=[...m.querySelectorAll('h3')].find(x=>x.textContent.trim()==='Comptes');
  if(h&&!m.querySelector('[data-act="x4_acadd"]'))h.insertAdjacentHTML('afterend','<div class="acts" style="margin:6px 0 10px"><button class="btn primary" data-act="x4_acadd">'+ic('plus')+'Ajouter un compte</button></div><p class="muted" style="font-size:13px;margin:0 0 8px">Le compte est utilisable tout de suite, sans validation. Donnez ensuite l’identifiant et le mot de passe à la personne.</p>');
  const p=[...m.querySelectorAll('p.muted')].find(x=>/restent sur cet appareil/.test(x.textContent));
  if(p)p.textContent='Les accès sont définis par les profils (Paramètres › Profils). Les comptes sont partagés avec l’équipe quand « Équipe connectée » est active ; les mots de passe sont chiffrés. Un compte demandé depuis l’écran de connexion doit d’abord être validé ci-dessus.';
  if(typeof mailCard==='function')mailCard(m);
}
function x4AccModal(){
  const pr=S.profiles||[];
  showModal(`${mh('Ajouter un compte')}<form id="x4acform">
   <div class="field"><label for="x4n">Prénom et nom</label><input id="x4n" required></div>
   <div class="field"><label for="x4i">Identifiant (pseudo ou e-mail)</label><input id="x4i" required autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>
   <div class="field"><label for="x4m">E-mail (facultatif)</label><input id="x4m" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Pour « Mot de passe oublié »"></div>
   <div class="field"><label for="x4p">Mot de passe (6 caractères min.)</label><input id="x4p" type="text" minlength="6" required autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>
   <div class="field"><label for="x4a">Accès</label><select id="x4a"><option value="">Aucun accès</option>${pr.map((p,i)=>`<option value="${p.id}" ${i===0?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="admin">Administrateur (accès complet)</option></select></div>
   <div class="field"><label for="x4s">Employé lié (facultatif)</label><select id="x4s"><option value="">—</option>${(S.staff||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
   <p id="x4err" class="gerr"></p><button class="btn primary" type="submit" style="width:100%">Créer le compte</button></form>`);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="x4_acadd"]');if(b&&isAdmin())x4AccModal()});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='x4acform')return;e.preventDefault();
  if(!isAdmin())return;
  const err=m=>{$('#x4err').textContent=m};
  const name=$('#x4n').value.trim(),ident=$('#x4i').value.trim().toLowerCase(),pw=$('#x4p').value.trim(),v=$('#x4a').value;
  if(!name||!ident)return;
  if(pw.length<6){err('6 caractères minimum pour le mot de passe.');return}
  if(accs().some(a=>a.ident===ident)){err('Cet identifiant existe déjà.');return}
  const em=($('#x4m').value||'').trim().toLowerCase();
  if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)){err('Adresse e-mail invalide.');return}
  const id=uid();
  accs().push({id,name,ident,...(em?{email:em}:{}),pwd:await hashPw(pw,id),status:'active',admin:v==='admin',profileId:v==='admin'?'':v,staffId:$('#x4s').value,ts:Date.now()});
  save();closeModal();vSetAcc($('#sub'));renderNav();toast('Compte créé : '+name);
});
/* l'écran « Qui êtes-vous ? » se met à jour tout seul quand un compte arrive de l'équipe */
setInterval(()=>{
  const g=document.getElementById('gate');if(!g||g.hidden||!g.querySelector('.gav'))return;
  const ids=accs().filter(a=>a.status==='active').map(a=>a.id).sort().join();
  if(g.dataset.ids===undefined){g.dataset.ids=ids;return}
  if(g.dataset.ids!==ids){g.dataset.ids=ids;gateStart()}
},1500);
/* ---- écran de connexion : état de l'équipe, afficher le mot de passe ---- */
const LAGO_V='v40';
function gateShell(inner){gateShellBase(inner);gateStat()}
function gateStat(){
  const g=document.getElementById('gate');if(!g||g.hidden)return;
  const card=g.querySelector('.gcard');if(!card)return;
  let el=card.querySelector('.gstat');if(!el){el=document.createElement('p');el.className='gstat muted';card.appendChild(el)}
  let h;
  if(cloudOn()){const ok=CL.state==='ok';h=`<span class="${ok?'g-ok':'g-off'}">●</span> Équipe ${ok?'connectée':'hors ligne'} · ${accs().length} compte(s)`}
  else h='○ Cet appareil n’est pas connecté à l’équipe. Employé ? Ouvrez le lien d’équipe envoyé par votre responsable, sans créer de compte ici.';
  el.innerHTML=h+` <span class="gv">${LAGO_V}</span>`;
}
setInterval(gateStat,2000);
document.addEventListener('change',e=>{if(e.target.id==='gshow'){const p=document.getElementById('gp');if(p)p.type=e.target.checked?'text':'password'}});

function gbSections(n){
  const out=[];
  homeList().filter(t=>(isAdmin()||t[2]!=='params')&&!opHidden(t[2])).forEach(([l,i,v,t,sub])=>{
    if(norm(l).includes(n))out.push([l,i,v,t]);
    sub.filter(x=>subOk(x[1],x[2])&&!opHidden(x[1])&&(!x[2]||tabsFor(x[1]).some(y=>y[0]===x[2]))).forEach(([sl,sv,st])=>{if(norm(sl).includes(n)&&norm(sl)!==norm(l))out.push([l+' › '+sl,i,sv,st])})
  });
  return out.slice(0,6);
}
function gbLocal(q){
  const n=norm(q);if(n.length<2)return '';
