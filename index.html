<style>
/* Layout: navigation latérale + espace de travail. Le planning est l'écran central.
   Palette: bleu (structure, parc) et orange (action, bar). Park bleu, Bar orange, Événement turquoise, Gestion ardoise. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F5FF; --ink:#0A1F4D; --muted:#566785; --line:#D7DFEE;
  --brand:#1D4FD7; --brand-ink:#FFFFFF; --brand-soft:#DCE6FC; --side:#1D4FD7; --side-ink:#FFFFFF;
  --pay:#FF7A1A; --pay-ink:#1F0F00;
  --ok:#1C8553; --warn:#E8690B; --bad:#C63A3A;
  --c-entree:#1D4FD7; --c-anniv:#0F2A66; --c-snack:#EE6F0C; --c-shop:#5A6B8C;
  --shadow:0 12px 40px rgba(8,20,50,.22);
  --f-display:'Lago Display','Lago Sans',system-ui,sans-serif;
  --f-body:'Lago Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:120px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 32px)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.05em;color:var(--ink)}
.logo svg{width:30px;height:30px;color:var(--brand)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-decoration:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand);color:var(--brand-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot button{text-align:left;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700;line-height:1.1}
.top .sub{color:var(--muted);text-transform:capitalize;font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.logo-m{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--surface-2);font-weight:650}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--ink) 8%)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn-pay{width:100%;min-height:56px;border-radius:14px;background:var(--pay);color:var(--pay-ink);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.btn-pay:disabled{opacity:.4}
.ix{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:16px;margin-bottom:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;min-height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:40px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:118px;padding:12px;border-radius:14px;text-align:left;
  background:color-mix(in srgb,var(--cat) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 24%,var(--line));transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cat)}
.tile .n{font-weight:650;font-size:15px;line-height:1.2;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile .p{font-family:var(--f-display);font-weight:700;font-size:19px}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

.cart{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.cart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px}
.cart-h h2{font-size:18px}
.sec{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-weight:600;text-align:left}
.pick.set{border-style:solid;color:var(--ink);background:var(--bg)}
.pick .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.slotrow .lbl{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slotrow .ix{width:44px;height:44px;border-radius:10px}
.warn-t{color:var(--bad);font-size:13px;font-weight:600}
.lines{overflow:auto;flex:1;min-height:70px;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto 74px;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.ln .nm{font-weight:600;line-height:1.25}
.ln .u{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.step b{min-width:26px;text-align:center}
.ln .t{text-align:right;font-weight:650}
.cart-empty{padding:26px 16px;text-align:center;color:var(--muted)}
.disc{display:flex;gap:6px;flex-wrap:wrap}
.disc .chip{min-height:34px;padding:6px 12px}
.tot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tot .r{display:flex;justify-content:space-between;color:var(--muted)}
.tot .r.big{color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:24px;margin-bottom:6px}
.cartbar{display:none}
.cart-scrim{display:none}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn{width:100%;text-align:left}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cat);flex:none}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin-top:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.warn{background:var(--warn)}
.bar i.full{background:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin-bottom:12px}
.mrow .bar{grid-column:1/-1}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:420px;height:auto}
.ch-grid{stroke:var(--line);fill:none}
.ch-t{fill:var(--muted);font:11px var(--f-body)}
.ch-bar{fill:var(--brand)}
.vrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.vrow.h{border-top:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vrow span:not(:first-child){text-align:right}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
.sl{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 12px;width:100%;text-align:left;border-radius:14px}
.sl:hover{background:var(--surface-2)}
.sl .tm{font-family:var(--f-display);font-weight:700;font-size:18px}
.sl .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.scrim{position:fixed;inset:0;background:rgba(4,18,20,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(540px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mh h2{font-size:22px}
.due{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:14px;background:var(--brand-soft)}
.due strong{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meth{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-weight:650;text-align:left}
.meth:hover{background:var(--brand-soft)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .pm{font-weight:650}
.given{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.given .chip{min-height:34px;padding:6px 12px}
.sum{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.sum .r{display:flex;justify-content:space-between}
.sum .r.k{font-weight:700;font-size:17px}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed var(--line);width:100%;margin:6px 0}
.success{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo{font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn);font-weight:700;display:inline-block;width:fit-content}

/* illustrations, onglets, planning, congés, contrôle, accueil */
.art{display:block;width:100%;height:auto;aspect-ratio:120/76;border-radius:10px}
.art .bg{fill:color-mix(in srgb,var(--cat) 14%,var(--surface))}
.art .a1{fill:var(--cat)}.art .a2{fill:color-mix(in srgb,var(--cat) 38%,var(--surface))}.art .a3{fill:var(--surface)}
.art .s{stroke:var(--cat);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.art .d{stroke:var(--surface);stroke-width:2;stroke-linecap:round;fill:none}
.art .t{fill:var(--cat);font:700 30px var(--f-display)}
.tile{min-height:0;gap:8px;background:var(--surface);border:1px solid var(--line);padding:8px 8px 12px}
.tile .n{font-weight:650;font-size:14px;line-height:1.2;margin-top:0;padding:0 4px}
.tile .p{padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.tile .badge{top:14px;right:14px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);margin-bottom:16px;max-width:100%;overflow-x:auto}
.tabs button{padding:9px 16px;border-radius:10px;font-weight:650;color:var(--muted);white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;margin-bottom:14px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--ink);font-weight:600}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.home .card h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1.1}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px;border-radius:20px;background:var(--brand);color:var(--brand-ink);margin-bottom:14px;overflow:hidden}
.hero h2{font-size:26px}.hero p{opacity:.85;margin-top:2px}
.hero .btn{background:var(--pay);color:var(--pay-ink)}
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.wk table{border-collapse:collapse;width:100%;min-width:640px}
.wk th,.wk td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.wk th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wk th.tdy{color:var(--brand)}
.wk td:first-child,.wk th:first-child{text-align:left;padding-left:12px;min-width:150px}
.wk tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:34px;height:34px;font-size:13px}
.who small{display:block;color:var(--muted);font-size:12px}
.sh{width:100%;min-height:44px;border-radius:10px;font-weight:700;font-size:12px;line-height:1.15;background:var(--surface-2);color:var(--muted)}
.sh.M{background:color-mix(in srgb,var(--c-snack) 22%,var(--surface));color:var(--ink)}
.sh.S{background:color-mix(in srgb,var(--c-anniv) 22%,var(--surface));color:var(--ink)}
.sh.J{background:color-mix(in srgb,var(--c-entree) 24%,var(--surface));color:var(--ink)}
.sh.L{background:color-mix(in srgb,var(--c-shop) 22%,var(--surface));color:var(--ink);cursor:default}
.sh small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cov td{font-size:13px;font-weight:700}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wknav b{flex:1;text-align:center;min-width:150px}
.chk{padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .q{font-weight:650;margin-bottom:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:48px;border-radius:12px;background:var(--surface-2);font-weight:700}
.yn button.ok.on{background:var(--ok);color:#fff}
.yn button.ko.on{background:var(--bad);color:#fff}
.chk input{margin-top:8px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog .bar{flex:1}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.hist span.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--ok)}
.hist span.ko{background:color-mix(in srgb,var(--bad) 20%,var(--surface));color:var(--bad)}
/* panier lisible, réservation */
.cart{border-radius:20px}
.cart-h h2{font-size:22px}
.pick{min-height:48px}
.pick .xx{display:grid;place-items:center;width:32px;height:32px}
.info{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--brand-soft)}
.info b{font-size:16px}
.info small{display:block;color:var(--muted);font-size:13px}
.info.or{background:color-mix(in srgb,var(--pay) 20%,var(--surface))}
.rwd{display:flex;gap:6px;flex-wrap:wrap}
.rwd .chip{border-color:var(--pay);min-height:40px}
.rwd .chip.on{background:var(--pay);color:var(--pay-ink);border-color:var(--pay)}
.gh{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cat);background:color-mix(in srgb,var(--cat) 9%,var(--surface))}

/* =====================================================================
   v47 · refonte visuelle : couche « moderne » posée par-dessus (dernière du fichier)
   Principes : fond teinté + cartes blanches, une seule couleur d'action (orange),
   menu marine, angles généreux, ombres douces, textes en minuscules lisibles.
   ===================================================================== */
:root{
  --canvas:color-mix(in srgb,var(--bg) 95.5%,var(--brand));
  --hair:color-mix(in srgb,var(--line) 62%,transparent);
  --grid:color-mix(in srgb,var(--ink) 30%,var(--surface));
  --grid-2:color-mix(in srgb,var(--ink) 52%,var(--surface));
  --ink-2:color-mix(in srgb,var(--ink) 72%,var(--bg));
  --sh-1:0 1px 2px rgba(12,22,48,.05);
  --sh-2:0 1px 2px rgba(12,22,48,.04),0 8px 26px rgba(12,22,48,.06);
  --sh-3:0 2px 6px rgba(12,22,48,.05),0 22px 54px rgba(12,22,48,.13);
  --shadow:0 24px 70px rgba(8,16,40,.3);
  --ease:cubic-bezier(.2,.75,.25,1);
  --ring:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);
  --side-deep:color-mix(in oklab,var(--side) 20%,#070b19);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--canvas);letter-spacing:-.003em;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--brand) 22%,transparent)}
h1,h2,h3{letter-spacing:-.025em}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 22%,transparent) transparent}

/* ---------- logo ---------- */
.lmark{background:var(--pay);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -2px color-mix(in srgb,var(--pay) 55%,transparent);border-radius:12px}
.logo .lt,.logo-m .lt{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);-webkit-text-fill-color:var(--ink);font-weight:800;letter-spacing:-.05em}
.side .logo .lt{color:#fff;-webkit-text-fill-color:#fff}
.glogo .lmark{background:var(--pay)}

/* ---------- menu de gauche ---------- */

    border:1px solid rgba(255,255,255,.07);box-shadow:0 1px 2px rgba(7,11,25,.25),0 28px 56px -22px rgba(7,11,25,.55)}
  .side .logo{padding:4px 8px 6px}

    color:color-mix(in srgb,var(--side-ink) 66%,transparent);transition:background .15s var(--ease),color .15s var(--ease)}

  .nav a:hover{background:color-mix(in srgb,var(--side-ink) 8%,transparent);color:var(--side-ink)}

/* ---------- barre de recherche du haut ---------- */
.gbar{background:color-mix(in srgb,var(--canvas) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:0;box-shadow:0 1px 0 var(--hair)}
.gbox{min-height:46px;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}

/* ---------- titres de page ---------- */

.top .sub{font-size:13.5px;color:var(--muted)}

/* ---------- boutons ---------- */
.btn{border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:620;box-shadow:var(--sh-1);
  transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease),transform .08s var(--ease),filter .15s}

.btn.primary{box-shadow:0 1px 2px rgba(12,22,48,.18),0 6px 14px -4px color-mix(in srgb,var(--brand) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.primary:hover{background:var(--brand);filter:brightness(1.09);border-color:transparent}
a.btn.primary{color:var(--brand-ink)}

.btn.warnbtn{box-shadow:0 1px 2px rgba(12,22,48,.15),0 6px 14px -4px color-mix(in srgb,var(--pay) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}

/* ---------- pastilles, puces, onglets ---------- */
.pill{padding:3px 10px;font-weight:650;background:color-mix(in srgb,var(--ink) 6%,var(--surface));color:var(--ink-2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:color-mix(in srgb,var(--warn) 82%,#5a2a00)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.chip{border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);font-weight:600;transition:background .15s,border-color .15s}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 20%,var(--line))}
.tabs,.seg{background:color-mix(in srgb,var(--ink) 5.5%,var(--canvas));border-radius:15px;padding:4px;gap:2px}
.tabs button,.seg button{border-radius:11px;font-weight:620;color:var(--muted);transition:background .15s var(--ease),color .15s,box-shadow .15s}

.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(12,22,48,.1),0 2px 8px rgba(12,22,48,.06)}
.banner{border-radius:16px;font-weight:560;border:1px solid color-mix(in srgb,var(--warn) 28%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

/* ---------- cartes, indicateurs, lignes ---------- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--sh-2);padding:20px}
.card h3{font-size:16.5px;font-weight:680;letter-spacing:-.02em;margin-bottom:14px}

.kpi .v,.big{color:var(--ink);font-weight:700;letter-spacing:-.04em}
.kpi .v{font-size:34px}

.row{border-top:1px solid var(--hair)}

/* ---------- formulaires ---------- */
.field label,.lab{font-size:13px;font-weight:620;letter-spacing:0;text-transform:none;color:var(--ink-2)}

input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}

.hero h2{font-size:40px;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.hero .eyebrow{font-size:14px;font-weight:600;letter-spacing:0;text-transform:capitalize;opacity:1;color:var(--muted);margin-bottom:6px}

.hero .btn,.hero .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-1)}
.hero .btn:hover{background:var(--surface-2)}
.hero a.btn,.hero a.btn.ghost{color:var(--ink)}
.board{padding:20px}
.bh h3{font-size:16px}
.bcomp textarea{min-height:46px;border-radius:14px}
.mtiles{gap:14px}
.mt-main{border:1px solid var(--hair);border-radius:22px;box-shadow:var(--sh-2);min-height:128px;gap:12px;font-weight:650;font-size:15px;letter-spacing:-.01em;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
.mt-ic{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--brand) 11%,var(--surface));color:var(--brand);box-shadow:none}
.mt:nth-child(even) .mt-ic{background:color-mix(in srgb,var(--pay) 15%,var(--surface));color:color-mix(in srgb,var(--pay) 80%,#7a2c00)}
.mt:hover>.mt-main,.mt:focus-within>.mt-main{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}

/* ---------- caisse : catégories ---------- */
.chips{gap:8px}

  transition:background .15s,border-color .15s,box-shadow .15s,color .15s}

.chips .cat:hover{border-color:color-mix(in srgb,var(--cat) 45%,var(--line))}
.chips .cat.on{background:color-mix(in srgb,var(--cat) 12%,var(--surface));border-color:var(--cat);color:var(--ink);box-shadow:0 0 0 1px var(--cat) inset,var(--sh-1)}
.chips .cat.on::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--cat) 22%,transparent)}

/* ---------- caisse : produits ---------- */
.grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--sh-1);overflow:hidden;padding:0;gap:0;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--cat) 35%,var(--line))}
.tile:active{transform:scale(.97);box-shadow:var(--sh-1)}

  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 3px rgba(8,16,40,.25)}

/* ---------- caisse : le ticket ---------- */
.cart{background:var(--surface);border:1px solid var(--hair);border-radius:26px;box-shadow:var(--sh-3)}
.cart-h{padding:18px 20px 12px}
.cart-h h2{font-size:21px;font-weight:700;letter-spacing:-.03em}
.sec{padding:0 20px 14px}
.pick{border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--ink) 20%,var(--line));background:transparent;transition:background .15s,border-color .15s}
.pick:hover{background:var(--surface-2);border-color:var(--brand)}
.pick.set{border-style:solid;border-color:var(--line);background:var(--surface-2)}
.lines{border-top:1px solid var(--hair);padding:0 4px}
.cart-empty{padding:34px 20px;font-size:14.5px}
.tot{position:relative;padding:18px 20px 20px;border-top:2px dashed color-mix(in srgb,var(--ink) 14%,var(--line));background:color-mix(in srgb,var(--ink) 2.5%,var(--surface));gap:8px}
.tot::before,.tot::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--canvas);border:1px solid var(--hair);box-shadow:inset 0 1px 3px rgba(12,22,48,.08)}
.tot::before{left:-12px}.tot::after{right:-12px}
.tot .r{font-size:14.5px}
.tot .r.big{font-size:36px;font-weight:700;letter-spacing:-.045em;margin-bottom:8px;align-items:baseline}
.tot .r.big span:first-child{font-size:17px;font-weight:620;letter-spacing:-.01em;color:var(--muted)}
.btn-pay{min-height:60px;border-radius:18px;font-size:19px;letter-spacing:-.02em;
  box-shadow:0 1px 2px rgba(12,22,48,.15),0 14px 28px -10px color-mix(in srgb,var(--pay) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.4);transition:filter .15s,transform .08s}
.btn-pay:hover:not(:disabled){filter:brightness(1.06)}
.btn-pay:active:not(:disabled){transform:scale(.985)}
.btn-pay:disabled{background:color-mix(in srgb,var(--ink) 7%,var(--surface));color:var(--muted);box-shadow:none;opacity:1}
.cbar{border-radius:999px;box-shadow:var(--sh-3);border:1px solid var(--hair)}
.cbar button.go{background:var(--pay);color:var(--pay-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.cbar button.x{color:var(--bad)}

/* ---------- fenêtres, messages ---------- */
.scrim{background:rgba(8,14,34,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:vfade .18s var(--ease)}
.modal{border:1px solid var(--hair);border-radius:26px;box-shadow:var(--shadow);padding:24px;animation:vpop .22s var(--ease)}
.mh h2{font-size:22px;letter-spacing:-.03em}
.toast{background:color-mix(in srgb,var(--ink) 94%,#000);color:#fff;border-radius:16px;padding:13px 20px;box-shadow:var(--sh-3);font-weight:560;letter-spacing:-.005em}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes vpop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes vview{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main.vt>*{animation:vview .3s var(--ease) both}
#main.vt>*:nth-child(n+4){animation-duration:.2s}

/* ---------- plannings ---------- */
.dcard{padding:18px 20px 16px;scroll-margin-top:84px}
.dch{gap:10px 14px}
.dtl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dch h3{font-size:21px;letter-spacing:-.02em}
.plcov{font-size:12px}
.dtw{border:1.5px solid var(--grid);border-radius:16px;background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt{border-collapse:collapse;min-width:540px;width:100%;table-layout:fixed}
.dt th,.dt td{border:1px solid var(--grid);padding:0}
.dt thead th{background:var(--surface-2);color:var(--ink-2);font-weight:650;border-bottom:2px solid var(--grid-2);padding:9px 2px 7px;vertical-align:bottom}
.pav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:0;flex:none}
.dt thead .pav{margin:0 auto 5px}
.pnm{display:block;font-size:12px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.dt th.lv{opacity:.55}
.dt .slc{width:66px;background:var(--surface-2);color:var(--ink-2);font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums;position:sticky;left:0;z-index:2;box-shadow:inset -2px 0 0 var(--grid-2)}
.dt thead .slc{z-index:3}
.dt th.cv,.dt td.cv{width:62px;border-left:2px solid var(--grid-2);background:var(--surface-2);text-align:center}
.dt td.jn{border-top-style:hidden}
.dt tbody tr:last-child th,.dt tbody tr:last-child td{border-bottom:0}
.dt tr>*:first-child{border-left:0}
.dt tr>*:last-child{border-right:0}
.dt thead tr>*{border-top:0}
.pc{border-radius:0;height:42px;min-height:42px;position:relative;line-height:1.15;background:transparent}
.pc.w,.pc.g{background:transparent}
.pc.w:hover,.pc.g:hover{background:transparent;filter:brightness(.93)}
.pc.w::before,.pc.g::before{content:'';position:absolute;left:4px;right:4px;top:var(--e,var(--ts,-1px));bottom:var(--fb,var(--bt,-1px));background:var(--c)}
.pc.g::before{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,#fff) 0 5px,color-mix(in srgb,var(--c) 18%,#fff) 5px 10px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,#fff)}
.dt td.bs{--ts:4px}
.dt td.be{--bt:4px}
.dt td.bs .pc::before{border-top-left-radius:11px;border-top-right-radius:11px}
.dt td.be .pc::before{border-bottom-left-radius:11px;border-bottom-right-radius:11px}
.pc .bl{position:absolute;left:9px;right:7px;top:calc(var(--e,var(--ts,0px)) + 6px);z-index:1;font-size:11px;font-weight:750;line-height:1.1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;letter-spacing:0}
.pc:not(.w):not(.g):not(.ro):not(.off):hover{background:var(--brand-soft)}
.pc:not(.w):not(.g):not(.ro):not(.off):hover::after{content:'+';position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--brand)}
.pc:focus-visible{outline:2px solid var(--brand);outline-offset:-3px;z-index:2}
.dt td.cv .pill.ok,.dt td.cv .pill.warn{background:transparent;color:var(--ink-2);font-weight:650}
.plcov{background:transparent;border:1px solid color-mix(in srgb,currentColor 32%,transparent);font-weight:650}
.plcov.ok{color:var(--muted)}
/* vue d'ensemble de la semaine */
.wkc{margin-bottom:14px;padding:18px 20px}
.wkh{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;cursor:pointer;list-style:none}
.wkh::-webkit-details-marker{display:none}
.wkc[open] .wkh{margin-bottom:10px}
.wkh h3::after{content:'';display:inline-block;width:8px;height:8px;margin-left:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-3px) rotate(45deg);transition:transform .2s var(--ease)}
.wkc[open] .wkh h3::after{transform:translateY(0) rotate(-135deg)}
.wkh h3{margin:0}
.wkleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wkleg .wn{min-width:22px;height:22px;font-size:11px;border-radius:7px;margin-left:8px}
.wkleg .wn:first-child{margin-left:0}
.wkw{overflow-x:auto}
.wk{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed;min-width:300px}
.wk,.wk th,.wk td{border:0;background:none}
.wk th{font-size:12px;font-weight:650;color:var(--muted);text-align:center;padding:0 0 2px;white-space:nowrap}
.wk tbody th{text-align:left;width:56px;padding:0}
.wkd{font:inherit;font-weight:700;color:var(--ink);padding:0 8px;border-radius:10px;min-height:32px;width:100%;text-align:left}
.wkd:hover{background:var(--brand-soft)}
.wk td{text-align:center;padding:0}
.wn{display:inline-grid;place-items:center;min-width:100%;height:32px;border-radius:10px;font-weight:750;font-size:14px;font-variant-numeric:tabular-nums;font-style:normal}
.wn.ok{background:var(--surface-2);color:var(--ink-2)}
.wn.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.wn.bad{background:color-mix(in srgb,var(--bad) 11%,var(--surface));color:var(--bad)}
.wk td.no{color:var(--grid-2);font-size:18px;line-height:32px}
.wkn{margin:10px 0 0;font-size:13px}
/* totaux d'heures */
.tts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:0 12px;padding:12px 14px 18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--hair);color:var(--ink);text-align:left;overflow:hidden}
.tt .pav{width:38px;height:38px;font-size:13px}
.ttx{display:flex;flex-direction:column;min-width:0}
.tt small{font-size:13px;font-weight:650;color:var(--ink-2)}
.tt b{font-size:22px;line-height:1.1}
.tt em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;opacity:1}
.tbar{position:absolute;left:14px;right:14px;bottom:8px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,var(--surface))}
.tbar::after{content:'';position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:99px;background:var(--c)}
@media (max-width:560px){
  .dcard,.wkc{padding:14px 12px 12px}
  .dt{min-width:500px}
  .dt .slc{width:58px;font-size:12px}
  .dt th.cv,.dt td.cv{width:54px}
  .wn{height:30px;font-size:13px}
  .wk td.no{line-height:30px}
  .wk tbody th{width:46px}
}
.dch .plbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.plt{padding:6px 12px;font-size:13px;min-height:0;gap:6px}
.btn.plt svg{width:15px;height:15px}
.plcuts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.plcut{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--grid);font-size:13px}
.plcut i{width:10px;height:10px;border-radius:50%;flex:none}
.plcut em{font-style:normal;color:var(--muted);font-weight:600}
.pltf .plr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.pltf .plr:last-of-type{border-bottom:0}
.pltf .plr .plwho{display:flex;align-items:center;gap:9px;min-width:0;font-weight:650}
.pltf .plr .plwho span.plnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pltf .plr .plwho i{width:12px;height:12px;border-radius:50%;flex:none}
.pltf .plr label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.pltf .plr select{min-width:92px;padding:8px 10px}
.pltf .plr .plph{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pltf .plr .plph b{color:var(--ink)}
.pltf .plr .plph.cut b{color:var(--brand)}
@media (max-width:560px){.pltf .plr{grid-template-columns:1fr 1fr}.pltf .plr .plwho{grid-column:1/-1}.pltf .plr select{width:100%}}
.phead{background:color-mix(in srgb,var(--canvas) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mpd{border:1px solid var(--hair);border-radius:16px;box-shadow:var(--sh-1)}
.mpw .mpwh b{font-size:15px}
.dl{border-radius:16px}

/* ---------- chat ---------- */
.tk-m.me .tk-t{background:var(--brand);color:var(--brand-ink);border-radius:18px 18px 5px 18px}
.tk-m .tk-t{border-radius:18px 18px 18px 5px}

/* ---------- écran de connexion ---------- */
#gate{background:
  radial-gradient(1100px 700px at 12% -10%,color-mix(in srgb,var(--brand) 55%,#0a1233),transparent 60%),
  radial-gradient(900px 620px at 100% 110%,color-mix(in srgb,var(--pay) 62%,#2a0d00),transparent 58%),
  color-mix(in oklab,var(--brand) 26%,#060a18)}
.gcard{border-radius:30px;padding:34px 30px;box-shadow:0 40px 90px -20px rgba(2,6,23,.7);border:1px solid rgba(255,255,255,.5)}
.gcard h2{font-size:23px;letter-spacing:-.035em}
.gu{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1)}
.gu:hover{border-color:var(--brand);box-shadow:var(--sh-2);transform:translateY(-2px)}
.gbtn{min-height:54px;border-radius:15px;font-size:16px}

/* ---------- menu mobile ---------- */
@media (max-width:900px){
  .mnav{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--hair);box-shadow:0 -8px 30px rgba(12,22,48,.07)}
  .mn{color:color-mix(in srgb,var(--ink) 52%,var(--bg));font-weight:600}
  .mn.on{color:var(--brand);font-weight:700}
  .mn.on .mi{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
  .mn .mi{transition:background .2s var(--ease)}
  .mn .nbadge,.ms-t .nbadge{background:var(--pay);color:var(--pay-ink)}
  .ms-panel{border-radius:28px 28px 0 0;box-shadow:var(--sh-3)}
  .ms-t{border-radius:20px;background:color-mix(in srgb,var(--ink) 4%,var(--surface));border:1px solid var(--hair)}
  .ms-t svg{color:var(--brand)}
  .ms-t.on{background:var(--brand);color:var(--brand-ink)}
  .ms-me{border-radius:18px;background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
  .cartbar{background:var(--ink);color:#fff;border-radius:20px;box-shadow:var(--sh-3);min-height:58px}
  .cartbar strong{color:var(--pay)}
  .cart{border-radius:28px 28px 0 0}
  .hero{padding:24px 22px;border-radius:26px}
  .hero h2{font-size:34px}
  .top h1{font-size:28px}
  .mt-main{min-height:112px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile .n{padding:10px 12px 13px;min-height:54px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  #main.vt>*,.modal,.scrim{animation:none!important}
  html{scroll-behavior:auto}
}

/* retouches */
.btn.primary.gjoinb{background:var(--surface);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));box-shadow:none}
.btn.primary.gjoinb:hover{background:var(--brand-soft);filter:none}
.plact{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- contrôle quotidien : deux pressions d'airbag ---------- */
.chk .prs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.chk .prl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.chk .prl input{margin-top:0;width:100%;min-width:0}

/* ---------- documents de contrôle ---------- */
.bacts{display:flex;gap:8px;flex-wrap:wrap}
.docs{padding:4px 18px 18px}
.dgm{margin:20px 0 2px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;text-transform:none}
.docrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.dti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.dti svg{width:20px;height:20px}
.dk-daily{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.dk-monthly{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.dk-inc{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.dk-mnt{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.docmain{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;background:none;border:0;padding:2px 0;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
.docmain b{font-size:15px}
.docmain .muted{font-size:13px;line-height:1.35}
.docmain .dsub{color:var(--ink-2)}
.docmain:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.docrow .btn.docpdf{padding:7px 16px;min-height:38px}
.dn{opacity:.6;font-variant-numeric:tabular-nums;margin-left:2px}
.docv .kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px}
.docv .kv>span{color:var(--muted)}
.docv .kv b{text-align:right;font-weight:650}
.dlines{margin:14px 0 0;padding-left:18px;font-size:14px;display:grid;gap:5px}
@media (max-width:560px){
  .docrow{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  .docrow .dti{grid-row:1/3;align-self:start}
  .docrow .pill{grid-column:2;grid-row:2;justify-self:start}
  .docrow .btn.docpdf{grid-column:3;grid-row:1/3}
}

/* ---- numérisation d'un rapport papier (IA) ---- */
.card.scan{border:1.5px solid color-mix(in srgb,#6A4DF0 35%,var(--line,#dde1ea));background:linear-gradient(180deg,color-mix(in srgb,#6A4DF0 5%,var(--card,#fff)),var(--card,#fff))}
.card.scan h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card.scan>.muted{font-size:13px;margin:0 0 12px;max-width:64ch}
.scanacts{display:flex;flex-wrap:wrap;gap:8px}
.scanbtn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.scanbtn .i{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;flex:none}
.scanbtn.off{opacity:.45;pointer-events:none}
@media (hover:hover) and (pointer:fine){.scancam{display:none}}
.scanst{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.scanst.busy{flex-direction:row;align-items:center;gap:10px;background:color-mix(in srgb,#6A4DF0 8%,transparent)}
.scanst.bad{background:color-mix(in srgb,#d93025 9%,transparent);color:#9b1c13}
.scanst.ok{background:color-mix(in srgb,#1e9e5a 10%,transparent)}
.scanst.ok .btn{margin-top:6px}
.scanst .scannote{color:#8a5a00}
.scanspin{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,#6A4DF0 25%,transparent);border-top-color:#6A4DF0;animation:scansp .8s linear infinite;flex:none}
@keyframes scansp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scanspin{animation-duration:2.4s}}
.aifill{box-shadow:0 0 0 2px color-mix(in srgb,#6A4DF0 55%,transparent);border-radius:8px;background-color:color-mix(in srgb,#6A4DF0 6%,transparent)}
.tgs.aifill{padding:3px}
.impo .scanbtn{margin-left:8px}
@media (max-width:560px){.scanacts .btn{flex:1 1 100%;justify-content:center}}

/* ---- congés payés (v52) ---- */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin-bottom:14px}
.lvc{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:11px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.lvc .pav{width:38px;height:38px;font-size:13px;grid-row:1}
.lvn{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lvn b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvn small{color:var(--muted);font-size:12.5px}
.lvbig{grid-column:1/-1;display:flex;align-items:baseline;gap:7px;margin-top:14px}
.lvbig b{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.lvbig b.low{color:#B45309}.lvbig b.neg{color:#C62828}
.lvbig span{font-size:13.5px;color:var(--muted);font-weight:600}
.lvbar{grid-column:1/-1;display:flex;height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.lvbar .u{background:var(--c);height:100%}
.lvbar .p{height:100%;background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);opacity:.6}
.lvch{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:600}
.lvch .t{margin-left:auto;font-weight:500}
.lvch .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-0.5px;background:var(--c)}
.lvch .sw.p{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c)}
.lvcard h3{display:flex;align-items:center;gap:8px}
.lvr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.lvr:first-of-type{border-top:0}
.lvr .pav{width:34px;height:34px;font-size:12px}
.lvw{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;min-width:0}
.lvw b{flex:0 0 100%;font-size:15px}
.lvw .muted{font-size:13.5px}
.lvact{grid-column:1/-1;display:flex;gap:8px;padding-left:46px}
.lvact .btn{min-height:40px;padding:8px 18px}
@media (min-width:901px){.lvact{grid-column:auto;padding-left:0}.lvr:has(.lvact){grid-template-columns:auto minmax(0,1fr) auto auto}}
@media (max-width:560px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lvc{padding:13px;grid-template-columns:auto minmax(0,1fr)}.lvc .pav{width:34px;height:34px}.lvbig b{font-size:32px}.lvact .btn{flex:1}.lvact{padding-left:0}}

/* ---- chat d'équipe (v52) ---- */
.tkcard{border-radius:20px!important}
.tk-wrap{position:relative;display:flex;flex-direction:column;min-height:0}
.tk-list{padding:16px 14px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 4%,var(--surface-2)),var(--surface-2));scroll-behavior:smooth}
.tk-day span{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(4px);box-shadow:0 1px 2px rgba(10,31,77,.06)}
.tk-m{margin-top:10px}.tk-m.grp{margin-top:2px}
.tk-av .avatar{box-shadow:0 0 0 2px var(--surface)}
.tk-n{font-weight:750;font-size:12.5px;padding-left:4px;letter-spacing:.005em}
.tk-m .tk-t{box-shadow:0 1px 1.5px rgba(10,31,77,.07);border:0;padding:9px 13px;font-size:15px}
.tk-m.me .tk-t{box-shadow:0 2px 6px color-mix(in srgb,var(--brand) 28%,transparent)}
.tk-m.grp:not(.me) .tk-t{border-top-left-radius:6px}.tk-m.grp.me .tk-t{border-top-right-radius:6px}
.tk-i{display:flex;align-items:center;gap:4px;font-size:11.5px;opacity:.85}
.tk-m:not(:hover):not(:focus-within) .tk-rb:not(.on){opacity:.35}
.tk-rb{background:none;border:0;padding:2px 5px;font-size:14px;line-height:1;border-radius:99px;cursor:pointer;color:var(--muted);min-width:28px;min-height:24px}
.tk-rb:hover,.tk-rb.on{background:var(--surface);opacity:1;color:var(--ink);box-shadow:0 1px 2px rgba(10,31,77,.1)}
.tk-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:-2px}
.tk-m.me .tk-rx{justify-content:flex-end}
.tk-re{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;cursor:pointer;min-height:26px;box-shadow:0 1px 1px rgba(10,31,77,.05)}
.tk-re b{font-size:11.5px;color:var(--muted)}
.tk-re.mine{border-color:color-mix(in srgb,var(--brand) 55%,transparent);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.tk-re.mine b{color:var(--brand)}
.tk-pick{display:flex;gap:2px;padding:4px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(10,31,77,.14);width:max-content;max-width:100%}
.tk-m.me .tk-pick{align-self:flex-end}
.tk-pick button{width:38px;height:38px;border-radius:50%;border:0;background:none;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.tk-pick button:hover{background:var(--surface-2);transform:scale(1.15)}
.tk-quick{display:flex;gap:6px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:var(--surface)}
.tk-quick::-webkit-scrollbar{display:none}
.tk-quick[hidden]{display:none}
.tk-q{flex:none;padding:7px 13px;border-radius:99px;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:color-mix(in srgb,var(--brand) 6%,var(--surface));color:var(--brand);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;min-height:36px}
.tk-q:hover{background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.tk-comp{border-top:0;padding:8px 10px 10px}
.tk-quick[hidden]+.tk-comp{border-top:1px solid var(--line)}
.tk-comp textarea{border-radius:22px;padding:11px 16px;background:var(--surface-2);border-color:transparent}
.tk-comp textarea:focus{background:var(--surface);border-color:var(--brand);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.tk-down{position:absolute;right:14px;bottom:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 16px rgba(10,31,77,.18);display:grid;place-items:center;cursor:pointer;color:var(--ink);z-index:2}
.tk-down[hidden]{display:none}
.tk-down svg{width:20px;height:20px}
.tk-empty{gap:8px}
.tk-eic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 10%,var(--surface));margin-bottom:4px}
.tk-empty .tk-eic svg{width:30px;height:30px}
.tk-empty b{color:var(--ink);font-size:16px}
@media (prefers-reduced-motion:reduce){.tk-list{scroll-behavior:auto}.tk-pick button{transition:none}}

@media (hover:hover){.tk-m:not(:hover):not(:focus-within) .tk-del{opacity:0}.tk-del{transition:opacity .12s}}
@media (min-width:701px){.chero svg.cillu{width:150px;height:100px}}

/* ---- congés payés : ajout automatique (v53) ---- */
.lvnx{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:2px}
.cpcard{grid-column:1/-1}
.cpcard .cplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.cprow{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px 12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cpwho{display:flex;flex-direction:column;min-width:0}.cpwho b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cpwho small{font-size:12.5px;white-space:nowrap}
.cpfs{grid-column:2;display:flex;gap:10px;flex-wrap:wrap}
.cpf{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.cpf input{min-height:40px;width:9.5em;font-size:15px}
.cpf input[data-cpn]{width:5.5em;text-align:right}

/* ---- accueil : tuiles compactes sur écran tactile (v54) ---- */
@media (hover:none){
  .mtiles{grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:10px;margin-bottom:14px}
  .mt-sub,.mt.has::after{display:none!important}
  .mt-main,.mt:hover>.mt-main,.mt:focus-within>.mt-main{
    flex-direction:row;justify-content:flex-start;align-items:center;gap:11px;text-align:left;
    min-height:66px;padding:10px 12px;border-radius:18px;border:1px solid var(--hair);
    box-shadow:0 1px 2px rgba(10,31,77,.05),0 6px 14px rgba(10,31,77,.05);transform:none;
    font-size:14.5px;line-height:1.15;letter-spacing:-.01em}
  .mt-main>span:last-child{min-width:0;overflow-wrap:anywhere}
  .mt-ic{width:42px;height:42px;flex:none;border-radius:13px}
  .mt-ic svg{width:23px;height:23px}
  .mt-main:active{transform:scale(.97);background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
}
@media (hover:none) and (max-width:600px){
  .mtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (hover:none) and (max-width:380px){
  .mt-main,.mt:hover>.mt-main,.mt:focus-within>.mt-main{gap:8px;padding:9px 10px;font-size:13.5px}
  .mt-ic{width:34px;height:34px;border-radius:11px}
  .mt-ic svg{width:20px;height:20px}
}
@media (hover:none) and (max-width:340px){
  .mt-main,.mt:hover>.mt-main,.mt:focus-within>.mt-main{flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:84px;font-size:13px}
  .mt-main>span:last-child{overflow-wrap:normal}
}

/* ---- conformité de la caisse (v55) ---- */
.cfdup{margin:0 0 10px;padding:8px 10px;border:2px dashed color-mix(in srgb,var(--pay) 70%,#7a2c00);border-radius:12px;text-align:center;font-weight:800;letter-spacing:.08em;color:color-mix(in srgb,var(--pay) 80%,#7a2c00);background:color-mix(in srgb,var(--pay) 8%,var(--surface))}
.cfdup small{display:block;margin-top:2px;font-weight:600;letter-spacing:0;font-size:12px;color:var(--muted)}
.cfdup.cfcx{border-color:#c43b3b;color:#a02828;background:color-mix(in srgb,#c43b3b 7%,var(--surface))}
.cfseal{font-size:11px;line-height:1.5;color:var(--muted);word-break:break-all}
.cfleg1{font-size:12px;color:var(--muted)}
.cfacts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.cfacts .btn{display:inline-flex;align-items:center;gap:8px}
.cfacts .btn svg{width:18px;height:18px}
.cfno{color:#a02828;border-color:color-mix(in srgb,#c43b3b 40%,var(--line))}
.cfcols{align-items:start}
.cfcard h3{margin-bottom:10px}
.cfst{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:650;font-size:14px;margin-bottom:10px}
.cfst.ok{background:color-mix(in srgb,var(--ok,#1f9d55) 12%,var(--surface));color:color-mix(in srgb,var(--ok,#1f9d55) 85%,#0b3b20)}
.cfst.bad{background:color-mix(in srgb,#c43b3b 12%,var(--surface));color:#a02828}
.cfk{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:14px}
.cfk:last-of-type{border-bottom:0}
.cfk span{color:var(--muted)}
.cfwarn{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px;background:color-mix(in srgb,var(--pay) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--pay) 35%,var(--line))}
.cfnote{font-size:13px;margin:12px 0 0}
.cflist{display:flex;flex-direction:column;max-height:360px;overflow:auto}
.cfj{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.cfj:last-child{border-bottom:0}
.cfj.bad{color:#a02828}.cfj.warn{color:color-mix(in srgb,var(--pay) 80%,#7a2c00)}
.cft{flex:none;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700}
.cfj small{flex-basis:100%}
.cfvr{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;margin-bottom:10px}
.cfvr.ok{background:color-mix(in srgb,var(--ok,#1f9d55) 12%,var(--surface))}
.cfvr.bad{background:color-mix(in srgb,#c43b3b 12%,var(--surface))}
.cfvr span{font-size:13px;color:var(--muted)}
.cfleg h4{margin:14px 0 4px;font-size:14px}.cfleg h4:first-child{margin-top:0}.cfleg p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2,var(--ink))}
.cflegb{display:block;margin:10px auto 0;font-size:13px}
.cfzr .r span:last-child{font-variant-numeric:tabular-nums}
.cfzc{margin-top:14px}

/* v55 : liste des comptes lisible sur téléphone (les réglages passent à la ligne) */
.acrow{flex-wrap:wrap;align-items:center;gap:8px 10px}
.acrow .grow{flex:1 1 calc(100% - 64px);min-width:0;overflow-wrap:anywhere}
.acrow select{flex:1 1 150px;min-width:0;width:auto}
.acrow .btn{flex:0 0 auto;white-space:nowrap}

/* =====================================================================
   v59 · couche « dégradés » : bleu + orange de la marque
   Posée en dernier. Rien ne change de place : seulement fonds, bordures, ombres.
   Une seule chose très marquée par écran (menu, bandeau d'accueil, boutons d'action),
   le reste reste calme : cartes blanches avec un liseré bleu→orange très léger.
   ===================================================================== */
:root{
  --b0:#0B2468;--b1:#1D4FD7;--b2:#3C7BF6;--b3:#8FB4FF;
  --o0:#F25C05;--o1:#FF7A1A;--o2:#FFA43F;--o3:#FFD3A8;
  --g-blue:linear-gradient(135deg,#1A45C8 0%,#2F6DF0 100%);
  --g-orange:linear-gradient(135deg,#FF6A0C 0%,#FFA03A 100%);
  --g-sun:linear-gradient(115deg,#1D4FD7 0%,#6A63E6 46%,#FF7A1A 100%);
  --g-ink:linear-gradient(100deg,#0A1F4D 0%,#1D4FD7 78%);
  --g-hair:linear-gradient(135deg,rgba(29,79,215,.26) 0%,rgba(110,110,230,.14) 50%,rgba(255,122,26,.30) 100%);
  --g-card:linear-gradient(180deg,#FFFFFF 0%,#FAFBFF 100%);
  --sh-blue:0 1px 2px rgba(12,22,48,.04),0 14px 34px -12px rgba(29,79,215,.20);
  --sh-btn-b:0 1px 2px rgba(10,31,77,.22),0 10px 20px -6px rgba(29,79,215,.55),inset 0 1px 0 rgba(255,255,255,.22);
  --sh-btn-o:0 1px 2px rgba(120,40,0,.22),0 12px 24px -8px rgba(255,106,12,.65),inset 0 1px 0 rgba(255,255,255,.38);
  --ring:0 0 0 4px rgba(29,79,215,.16),0 0 0 1px rgba(29,79,215,.5);
}

/* ---------- fond de page : deux lueurs, bleue à gauche et orange à droite ---------- */
body{
  background:
    radial-gradient(1000px 520px at -6% -8%,rgba(29,79,215,.11),transparent 62%),
    radial-gradient(900px 480px at 106% -6%,rgba(255,122,26,.11),transparent 62%),
    radial-gradient(800px 420px at 50% 112%,rgba(60,123,246,.07),transparent 65%),
    #F5F8FE;
  background-attachment:fixed,fixed,fixed,scroll;
}
.gbar{background:linear-gradient(180deg,rgba(245,248,254,.92),rgba(245,248,254,.78))}
.gb-go{background:var(--g-blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px -3px rgba(29,79,215,.55)}
.gbox:focus-within{border-color:rgba(29,79,215,.55);box-shadow:var(--ring)}

/* ---------- logo ---------- */
.lmark{background:var(--g-orange);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -3px rgba(255,106,12,.6)}
.glogo .lmark{background:var(--g-orange)}

/* ---------- titres ---------- */
.top h1{background:var(--g-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content;max-width:100%;padding-bottom:2px}
.rolepill{background:linear-gradient(180deg,#fff,#F3F7FF);border-color:rgba(29,79,215,.18)}
.rolepill.adm svg{color:var(--b1)}

/* ---------- menu de gauche (ordinateur) ---------- */
@media (min-width:901px){
  .side{
    background:
      radial-gradient(280px 240px at 0% 0%,rgba(60,123,246,.48),transparent 70%),
      linear-gradient(180deg,transparent 58%,rgba(104,64,214,.22) 80%,rgba(214,86,70,.34) 92%,rgba(255,122,26,.55) 100%),
      linear-gradient(170deg,#13338F 0%,#0C2262 46%,#081548 100%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 1px 2px rgba(7,11,25,.3),0 30px 60px -22px rgba(12,34,120,.7),inset 0 1px 0 rgba(255,255,255,.14)}
  .nav a:hover{background:rgba(255,255,255,.10)}
  .nav a.on{background:linear-gradient(100deg,rgba(255,122,26,.40) 0%,rgba(255,255,255,.14) 62%,rgba(255,255,255,.07) 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 6px 16px -8px rgba(255,122,26,.6)}
  .nav a.on svg{color:#FFB264;filter:drop-shadow(0 0 6px rgba(255,150,60,.55))}
  .subnav{border-left-color:rgba(255,255,255,.18)}
  .subnav button.on{background:linear-gradient(100deg,rgba(255,255,255,.20),rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .subnav button:hover{background:rgba(255,255,255,.09)}
  .navacc{border-top-color:rgba(255,255,255,.14)}
}
.nav a .nbadge{background:var(--g-orange);box-shadow:0 3px 8px -2px rgba(255,106,12,.7)}

/* ---------- boutons ---------- */
.btn{background:linear-gradient(180deg,#FFFFFF 0%,#F4F7FD 100%);border-color:rgba(29,79,215,.16)}
.btn:hover{background:linear-gradient(180deg,#FFFFFF 0%,#EAF0FE 100%);border-color:rgba(29,79,215,.34)}
.btn.primary,.btn.primary:hover,.btn.primary:focus-visible{background:var(--g-blue);color:#fff;border-color:transparent;box-shadow:var(--sh-btn-b)}
.btn.primary:hover{filter:brightness(1.08) saturate(1.05)}
a.btn.primary{color:#fff}
.btn.warnbtn,.btn.warnbtn:hover,.btn-pay,.btn-pay:hover:not(:disabled),.hero .btn.primary,.hero .btn.primary:hover{background:var(--g-orange);color:#fff;border-color:transparent;box-shadow:var(--sh-btn-o);text-shadow:0 1px 0 rgba(160,50,0,.25)}
.btn-pay:disabled{background:linear-gradient(180deg,#EEF2FA,#E6EBF6);color:var(--muted);box-shadow:none;text-shadow:none}
.btn.ghost,.btn.ghost:hover{background:transparent}
.btn.ghost:hover{background:rgba(29,79,215,.06)}
.btn.danger{background:linear-gradient(180deg,#fff,#FFF6F6)}
.btn.primary.gjoinb{background:linear-gradient(180deg,#fff,#F0F5FF);color:var(--b1);box-shadow:none}
.ix{background:linear-gradient(180deg,#fff,#F3F7FF);border-color:rgba(29,79,215,.16)}
.chip{background:linear-gradient(180deg,#fff,#F4F7FD);border-color:rgba(29,79,215,.16)}
.chip.on,.dy.on{background:var(--g-blue);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(29,79,215,.7)}

/* ---------- onglets et segments ---------- */
.tabs,.seg{background:linear-gradient(180deg,rgba(29,79,215,.07),rgba(29,79,215,.045));box-shadow:inset 0 1px 2px rgba(12,22,48,.06)}
.tabs button.on,.seg button.on{background:var(--g-blue);color:#fff;box-shadow:0 6px 14px -6px rgba(29,79,215,.75),inset 0 1px 0 rgba(255,255,255,.22)}
.tabs button.on *,.seg button.on *{color:inherit}

/* ---------- cartes : fond très léger, liseré bleu→orange ---------- */
.card,.kpi,.dcard,.wkc,.board,.mpd{
  border:1px solid transparent;
  background:var(--g-card) padding-box,var(--g-hair) border-box;
  box-shadow:var(--sh-blue)}
.card.scan{background:linear-gradient(180deg,color-mix(in srgb,#6A4DF0 5%,#fff),#fff) padding-box,linear-gradient(135deg,rgba(106,77,240,.4),rgba(29,79,215,.2)) border-box}
.kpi:nth-child(even){background:linear-gradient(160deg,#FFFFFF 0%,#FFF7EF 100%) padding-box,var(--g-hair) border-box}
.kpi:nth-child(odd){background:linear-gradient(160deg,#FFFFFF 0%,#F3F7FF 100%) padding-box,var(--g-hair) border-box}
.kpi .v{background:var(--g-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content;max-width:100%}
.kpi:nth-child(even) .v{background:linear-gradient(100deg,#B33C00 0%,#FF6A0C 80%);-webkit-background-clip:text;background-clip:text}
.row{border-top-color:rgba(29,79,215,.10)}
.avatar{background:linear-gradient(135deg,#DCE6FC,#FFE2C8);color:var(--b1);box-shadow:inset 0 0 0 1px rgba(29,79,215,.12)}
.pill{background:linear-gradient(180deg,#F3F6FC,#EAEFF9)}
.pill.ok{background:linear-gradient(180deg,#E6F6EE,#D9F0E4)}
.pill.warn{background:linear-gradient(180deg,#FFF0E0,#FFE4CB)}
.pill.bad{background:linear-gradient(180deg,#FDECEC,#F9DCDC)}
.banner{background:linear-gradient(100deg,#FFF1E2 0%,#FFFAF4 70%,#fff 100%);border-color:rgba(255,122,26,.34)}
.banner.ok{background:linear-gradient(100deg,#E4F5EC 0%,#F6FCF9 70%,#fff 100%);border-color:rgba(28,133,83,.30)}
.bar{background:linear-gradient(180deg,#E9EFFB,#DFE7F7);box-shadow:inset 0 1px 2px rgba(12,22,48,.08)}
.bar i{background:linear-gradient(90deg,#1D4FD7,#4E8BFA)}
.bar i.warn{background:linear-gradient(90deg,#F25C05,#FFA43F)}
.bar i.full{background:linear-gradient(90deg,#B52E2E,#E25A5A)}
.dybar u{background:linear-gradient(90deg,#1D4FD7,#4E8BFA)}
.dybar u.warn{background:linear-gradient(90deg,#F25C05,#FFA43F)}
.dybar u.full{background:linear-gradient(90deg,#B52E2E,#E25A5A)}

/* ---------- accueil ---------- */
.hero{
  color:#fff;border:1px solid rgba(255,255,255,.18);
  background:
    radial-gradient(420px 300px at 6% -10%,rgba(120,175,255,.40),transparent 66%),
    linear-gradient(112deg,#1238B0 0%,#1D4FD7 40%,#4C54E6 64%,#B8509C 84%,#FF8A2B 100%);
  box-shadow:0 2px 4px rgba(12,34,120,.2),0 30px 60px -26px rgba(29,79,215,.7),inset 0 1px 0 rgba(255,255,255,.22)}
.hero::before,.hero::after{display:none}
.hero h2,.hero .eyebrow,.hero p,.hero strong{color:#fff}
.hero .eyebrow,.hero p{color:rgba(255,255,255,.82)}
.hero h2{text-shadow:0 2px 18px rgba(8,20,80,.25)}
.hero .btn,.hero .btn.ghost,.hero a.btn,.hero a.btn.ghost{background:rgba(255,255,255,.96);color:var(--b0);border-color:transparent;box-shadow:0 6px 16px -8px rgba(8,20,80,.5)}
.hero .btn:hover{background:#fff}
.hero .btn.primary,.hero a.btn.primary{color:#fff}
.mt-main{border:1px solid transparent;background:var(--g-card) padding-box,var(--g-hair) border-box;box-shadow:var(--sh-blue)}
.mt-ic{background:var(--g-blue);color:#fff;box-shadow:0 10px 20px -8px rgba(29,79,215,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.mt:nth-child(even) .mt-ic{background:var(--g-orange);color:#fff;box-shadow:0 10px 20px -8px rgba(255,106,12,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.mt:hover>.mt-main,.mt:focus-within>.mt-main{box-shadow:0 2px 6px rgba(12,22,48,.06),0 26px 50px -18px rgba(29,79,215,.4);border-color:transparent}
.mt-sub{background:linear-gradient(180deg,#fff,#F4F8FF);border-color:rgba(29,79,215,.16)}
.mt-sub button:hover .si{background:var(--g-blue);color:#fff}
.mtiles .mt:nth-child(even) .mt-sub button:hover .si{background:var(--g-orange);color:#fff}

/* ---------- caisse ---------- */
.chips .cat{background:linear-gradient(180deg,#fff,#F5F8FE)}
.chips .cat.on{background:linear-gradient(180deg,color-mix(in srgb,var(--cat) 16%,#fff),color-mix(in srgb,var(--cat) 7%,#fff))}
.tile{border:1px solid transparent;background:var(--g-card) padding-box,var(--g-hair) border-box;box-shadow:var(--sh-blue)}
.tile:hover{border-color:transparent;box-shadow:0 2px 6px rgba(12,22,48,.06),0 24px 46px -18px rgba(29,79,215,.42)}
.tile .art{background:linear-gradient(160deg,color-mix(in srgb,var(--cat) 20%,#fff) 0%,color-mix(in srgb,var(--cat) 6%,#fff) 100%)}
.tile .n{background:transparent}
.grid .tile .p,.tile .p{background:linear-gradient(135deg,rgba(9,28,86,.88),rgba(29,79,215,.84))}
.tile .badge{background:var(--g-orange);box-shadow:0 4px 10px -2px rgba(255,106,12,.7)}
.cart{border:1px solid transparent;background:var(--g-card) padding-box,var(--g-hair) border-box;box-shadow:0 2px 6px rgba(12,22,48,.05),0 30px 60px -26px rgba(29,79,215,.35)}
.tot{background:linear-gradient(180deg,#F5F8FF 0%,#FFF6EE 100%);border-top-color:rgba(29,79,215,.2)}
.tot .r.big span:last-child{background:var(--g-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pick:hover{background:linear-gradient(180deg,#fff,#EEF3FF);border-color:var(--b1)}
.cbar{background:linear-gradient(180deg,#fff,#F3F7FF);border-color:rgba(29,79,215,.2)}
.cbar button.go{background:var(--g-orange);color:#fff}

/* ---------- fenêtres, messages ---------- */
.scrim{background:radial-gradient(900px 600px at 20% 0%,rgba(29,79,215,.34),transparent 60%),radial-gradient(800px 560px at 100% 100%,rgba(255,122,26,.26),transparent 60%),rgba(8,14,40,.55)}
.modal{
  border:1px solid transparent;
  background:linear-gradient(90deg,#1D4FD7 0%,#6A63E6 52%,#FF7A1A 100%) 0 0/100% 5px no-repeat padding-box,
             linear-gradient(180deg,#FFFFFF 0%,#F8FAFF 100%) padding-box,
             var(--g-hair) border-box;
  box-shadow:0 2px 6px rgba(8,16,40,.12),0 40px 90px -24px rgba(12,34,120,.55)}
.toast{background:linear-gradient(120deg,#0A1F4D 0%,#1A44C0 100%);box-shadow:0 14px 34px -10px rgba(12,34,120,.7),inset 0 1px 0 rgba(255,255,255,.14)}

/* ---------- plannings ---------- */
.dt thead th,.dt .slc,.dt th.cv,.dt td.cv{background:linear-gradient(180deg,#F5F8FF,#EDF2FD)}
.pc:not(.w):not(.g):not(.ro):not(.off):hover{background:linear-gradient(180deg,#E6EEFF,#DCE7FD)}

/* ---------- écran de connexion : fond bleu → violet → orange ---------- */

/* ---------- la dalle « Contrôle » s'illumine tant que le contrôle du jour n'est pas validé ---------- */
.mt.todo .mt-main{
  position:relative;overflow:hidden;isolation:isolate;border:1.5px solid transparent;
  background:
    radial-gradient(130% 90% at 50% 0%,rgba(255,170,80,.46),transparent 64%) padding-box,
    linear-gradient(180deg,#FFFBF6,#FFEAD2) padding-box,
    linear-gradient(135deg,#FF6A0C,#FFC27A 45%,#FF6A0C) border-box;
  animation:todoGlow 2.4s ease-in-out infinite}
.mt.todo .mt-main::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:0;width:42%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-140%) skewX(-18deg);animation:todoSheen 3.8s ease-in-out infinite}
.mt.todo:hover>.mt-main,.mt.todo:focus-within>.mt-main{border-color:transparent}
.mt.todo .mt-ic{position:relative;background:var(--g-orange);color:#fff;box-shadow:0 10px 22px -6px rgba(255,106,12,.9),0 0 0 4px rgba(255,138,43,.18),inset 0 1px 0 rgba(255,255,255,.45)}
.mt.todo .mt-ic::after{content:"";position:absolute;inset:-5px;border-radius:21px;border:2px solid rgba(255,122,26,.6);animation:todoRing 2.4s ease-out infinite;pointer-events:none}
.mt-todo{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;font-weight:760;letter-spacing:0;line-height:1;
  color:#fff;background:var(--g-orange);padding:5px 10px 5px 8px;border-radius:999px;box-shadow:0 6px 14px -4px rgba(255,106,12,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.mt-todo::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:todoDot 1.4s ease-out infinite}
@keyframes todoGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,0),0 0 16px 1px rgba(255,138,43,.34),0 14px 30px -14px rgba(255,106,12,.6)}
  50%{box-shadow:0 0 0 5px rgba(255,122,26,.13),0 0 34px 7px rgba(255,150,60,.58),0 18px 38px -14px rgba(255,106,12,.75)}}
@keyframes todoSheen{0%,48%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(380%) skewX(-18deg)}}
@keyframes todoRing{0%{transform:scale(.92);opacity:.95}100%{transform:scale(1.55);opacity:0}}
@keyframes todoDot{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
/* mêmes signaux ailleurs : menu du téléphone et bouton « Contrôle du jour à faire » */
@media (max-width:900px){
  .ms-t.todo:not(.on){background:linear-gradient(180deg,#FFF9F2,#FFEBD5);border-color:rgba(255,122,26,.55);animation:todoGlowS 2.4s ease-in-out infinite}
  .ms-t.todo:not(.on) svg{color:var(--o0)}
}
@keyframes todoGlowS{0%,100%{box-shadow:0 0 12px 0 rgba(255,138,43,.28)}50%{box-shadow:0 0 24px 4px rgba(255,150,60,.5)}}
.btn.warnbtn[href="#controle"]{animation:todoGlowB 2.4s ease-in-out infinite}
@keyframes todoGlowB{0%,100%{box-shadow:var(--sh-btn-o)}50%{box-shadow:0 1px 2px rgba(120,40,0,.22),0 0 26px 5px rgba(255,150,60,.6),inset 0 1px 0 rgba(255,255,255,.38)}}
@media (prefers-reduced-motion:reduce){
  .mt.todo .mt-main,.mt.todo .mt-main::before,.mt.todo .mt-ic::after,.mt-todo::before,.ms-t.todo,.btn.warnbtn[href="#controle"]{animation:none!important}
  .mt.todo .mt-main{box-shadow:0 0 0 4px rgba(255,122,26,.14),0 0 26px 4px rgba(255,150,60,.45)}
  .mt.todo .mt-main::before,.mt.todo .mt-ic::after{display:none}
}
