/* ---- mot de passe : « Mon compte » et « Mot de passe oublié » par e-mail ---- */
const MAILRE=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
const mailOf=a=>{if(!a)return '';const e=String(a.email||'').trim();if(MAILRE.test(e))return e;const i=String(a.ident||'').trim();return MAILRE.test(i)?i:''};
const maskMail=m=>{const [u,d]=String(m).split('@');return (u.length<=2?u.slice(0,1):u.slice(0,2))+'•••@'+d};
const mailCfg=()=>{const m=(S.settings&&S.settings.mail)||{};return m.sid&&m.tid&&m.key?m:null};
const RALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789',RST_MIN=30,RST_WAIT=60,RST_TRIES=5;
function rstCode(){let c='';try{const b=new Uint8Array(8);crypto.getRandomValues(b);for(const x of b)c+=RALPHA[x%RALPHA.length]}catch(e){c='';for(let i=0;i<8;i++)c+=RALPHA[Math.floor(Math.random()*RALPHA.length)]}return c}
const rstNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const rstHash=(code,a)=>hashPw(rstNorm(code),a.id+'|rst');
const rstShow=c=>c.slice(0,4)+'-'+c.slice(4);
/* envoi par EmailJS (service gratuit, appelé directement depuis le navigateur) */
async function mailSend(to,params){
  const m=mailCfg();if(!m)throw new Error('config');
  const ac=new AbortController(),to_=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({service_id:m.sid,template_id:m.tid,user_id:m.key,template_params:Object.assign({to_email:to,email:to,app_name:S.settings.name||'Lago'},params)})});
    if(!r.ok){const t=await r.text().catch(()=>'');const e=new Error('http '+r.status+' '+t.slice(0,160));e.status=r.status;e.body=t;throw e}
  }finally{clearTimeout(to_)}
}
function mailErr(e){
  const t=String((e&&e.body)||(e&&e.message)||e),s=e&&e.status;
  if(e&&e.name==='AbortError')return 'pas de réponse du service d’e-mails (connexion ?)';
  if(/service id/i.test(t))return 'Service ID incorrect';
  if(/template id|template.*not found/i.test(t))return 'Template ID incorrect';
  if(/public key|user_id|account not found/i.test(t))return 'Public Key incorrecte';
  if(s===403)return 'accès refusé par EmailJS (clé ou domaine non autorisé)';
  if(s===429)return 'trop d’envois : quota EmailJS atteint';
  if(/Failed to fetch|NetworkError|Load failed/i.test(t))return 'service d’e-mails injoignable (connexion ou blocage du navigateur)';
  return t.replace(/^http \d+\s*/,'').slice(0,120)||'erreur inconnue';
}
/* demande de code : la clé (hachée) est écrite sur le compte, le code en clair part par e-mail */
async function rstRequest(a){
  if(!a)return {err:'Compte introuvable.'};
  if(a.status==='pending')return {err:'Compte en attente : l’administrateur doit d’abord le valider.'};
  if(a.status!=='active')return {err:'Ce compte est désactivé. Contactez l’administrateur.'};
  const to=mailOf(a);
  if(!to)return {err:'Aucune adresse e-mail n’est enregistrée sur ce compte. Demandez à l’administrateur de vous définir un nouveau mot de passe.'};
  if(!mailCfg())return {err:'L’envoi d’e-mails n’est pas encore activé. Demandez à l’administrateur de vous définir un nouveau mot de passe (Paramètres › Comptes).'};
  const w=a.rst&&a.rst.ts?Math.ceil((a.rst.ts+RST_WAIT*1000-Date.now())/1000):0;
  if(w>0)return {wait:w,to};
  const code=rstCode(),prev=a.rst,now=Date.now();
  a.rst={h:await rstHash(code,a),ts:now,exp:now+RST_MIN*60000,n:0};save();
  try{await mailSend(to,{to_name:a.name,code:rstShow(code),minutes:RST_MIN,login:a.ident})}
  catch(e){if(prev)a.rst=prev;else delete a.rst;save();console.warn('mail',e);return {err:'L’e-mail n’a pas pu être envoyé ('+mailErr(e)+'). Réessayez plus tard ou demandez un nouveau mot de passe à l’administrateur.'}}
  return {ok:true,to};
}

document.addEventListener('change',e=>{if(e.target.id==='mashow'){['mp0','mp1','mp2'].forEach(i=>{const p=document.getElementById(i);if(p)p.type=e.target.checked?'text':'password'})}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='maform'){
    e.preventDefault();if(!ME)return;
    const n=$('#man').value.trim(),m=$('#mae').value.trim().toLowerCase(),err=t=>{$('#maerr').textContent=t};
    if(!n){err('Le nom ne peut pas être vide.');return}
    if(m&&!MAILRE.test(m)){err('Adresse e-mail invalide.');return}
    ME.name=n;if(m)ME.email=m;else delete ME.email;save();closeModal();chrome();toast('Informations enregistrées');
  }else if(e.target.id==='pwform2'){
    e.preventDefault();if(!ME)return;
    const err=t=>{$('#pwerr2').textContent=t},p1=$('#mp1').value.trim(),p2=$('#mp2').value.trim(),btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true;
    try{
      if(ME.pwd){const cur=$('#mp0').value;if(await hashPw(cur.trim(),ME.id)!==ME.pwd&&await hashPw(cur,ME.id)!==ME.pwd){err('Mot de passe actuel incorrect.');return}}
      if(p1.length<6){err('6 caractères minimum pour le nouveau mot de passe.');return}
      if(p1!==p2){err('Les deux nouveaux mots de passe sont différents.');return}
      if(ME.pwd&&await hashPw(p1,ME.id)===ME.pwd){err('Choisissez un mot de passe différent de l’actuel.');return}
      ME.pwd=await hashPw(p1,ME.id);delete ME.rst;save();closeModal();toast('Mot de passe modifié');
    }finally{if(btn.isConnected)btn.disabled=false}
  }
});

/* ---- administrateur : réglage de l'envoi d'e-mails + e-mail d'un compte ---- */
function mailCard(m){
  if(!isAdmin()||!m)return;
  const c=S.settings.mail||{},ok=!!mailCfg(),inp=(id,v,ph)=>`<input id="${id}" value="${esc(v||'')}" placeholder="${ph}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">`;
  m.insertAdjacentHTML('beforeend',`<div class="card" id="mailcard" style="margin-top:14px"><h3>E-mails · mot de passe oublié ${ok?'<span class="pill ok">Activé</span>':'<span class="pill warn">À configurer</span>'}</h3>
   <p class="muted" style="font-size:13px;margin-bottom:8px">Quand quelqu’un oublie son mot de passe, il reçoit un code par e-mail depuis l’écran de connexion. L’envoi passe par EmailJS (gratuit, 200 e-mails par mois). Sans ce réglage, la personne doit vous demander un nouveau mot de passe.</p>
   ${fld('Service ID',inp('mlsid',c.sid,'service_xxxxxxx'))}${fld('Template ID',inp('mltid',c.tid,'template_xxxxxxx'))}${fld('Public Key',inp('mlkey',c.key,'xxxxxxxxxxxxxxxx'))}
   <p id="mlmsg" class="muted" style="min-height:20px;font-size:13px"></p>
   <div class="acts"><button class="btn primary" data-act="ml_save">Enregistrer</button><button class="btn" data-act="ml_test" ${ok?'':'disabled'}>M’envoyer un e-mail de test</button></div>
   <details style="margin-top:12px"><summary><b>Comment obtenir ces 3 codes (5 minutes)</b></summary>
   <ol class="muted" style="font-size:13px;line-height:1.6;padding-left:18px;margin:8px 0 0">
    <li>Créez un compte gratuit sur <b>emailjs.com</b>.</li>
    <li><b>Email Services</b> › Add New Service › choisissez Gmail (ou votre messagerie) et connectez l’adresse qui enverra les e-mails. Copiez le <b>Service ID</b>.</li>
    <li><b>Email Templates</b> › Create New Template. Dans <b>To Email</b>, écrivez <code>{{to_email}}</code>. Objet : <code>{{app_name}} : votre code de connexion</code>. Message : <code>Bonjour {{to_name}}, votre code pour choisir un nouveau mot de passe est : {{code}} (valable {{minutes}} minutes). Si vous n’êtes pas à l’origine de cette demande, ignorez ce message.</code> Enregistrez et copiez le <b>Template ID</b>.</li>
    <li><b>Account</b> › General : copiez la <b>Public Key</b>.</li>
    <li>Collez les trois codes ci-dessus, enregistrez, puis envoyez-vous un e-mail de test.</li></ol></details></div>`);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act="ml_save"],[data-act="ml_test"],[data-act="ac_mail"]');if(!b||!isAdmin())return;
  const a=b.dataset.act,msg=t=>{const x=$('#mlmsg');if(x)x.textContent=t};
  if(a==='ml_save'){const v=id=>(($('#'+id)||{}).value||'').trim();S.settings.mail={sid:v('mlsid'),tid:v('mltid'),key:v('mlkey')};save();vSetAcc($('#sub'));toast(mailCfg()?'E-mails activés':'Réglage enregistré (incomplet)')}
  else if(a==='ml_test'){
    const to=mailOf(ME);if(!to){msg('Ajoutez d’abord votre adresse e-mail dans Mon compte.');return}
    b.disabled=true;msg('Envoi en cours…');
    try{await mailSend(to,{to_name:ME.name,code:'TEST-1234',minutes:RST_MIN,login:ME.ident});msg('✓ E-mail de test envoyé à '+to+'. Vérifiez votre boîte de réception.');toast('E-mail de test envoyé')}
    catch(x){console.warn('mail',x);msg('Échec : '+mailErr(x))}
    if(b.isConnected)b.disabled=false;
  }else if(a==='ac_mail'){
    const x=accs().find(y=>y.id===b.dataset.id);if(!x)return;
    askText('E-mail de '+x.name,'Adresse utilisée si la personne oublie son mot de passe. Laissez vide pour la retirer.',v=>{
      v=(v||'').trim().toLowerCase();if(v&&!MAILRE.test(v)){toast('Adresse e-mail invalide');return}
      if(v)x.email=v;else delete x.email;save();vSetAcc($('#sub'));toast(v?'E-mail enregistré':'E-mail retiré')},false,String(x.email||'')||(MAILRE.test(x.ident)?x.ident:''));
  }
});

METHODS.pass='Carnet de séances';
function openPay(){
  const T=totals(cart);
  if(T.L.length&&T.total===0&&(T.pInfo||T.pcInfo)&&slotOk(T)){
    const sale=finalize(cart,[{m:'pass',amt:0}],Date.now(),false);sale.change=0;
    S.sales.push(sale);number();afterSale(sale,cart);save();cart=newCart();showReceipt(sale,true);
    if(view==='caisse'){drawCart();drawGrid()}return;
  }
  openPayBase();
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  if(a==='scrim'){if(e.target===b)closeModal();return}
  if(b.disabled)return;
  switch(a){
    case 'close':closeModal();break;
    case 'fcat':fcat=d.id;fsub='';drawChips();drawGrid();break;
    case 'fsub':fsub=fsub===d.v?'':d.v;drawChips();drawGrid();break;
    case 'add':tapProduct(d.id);break;
    case 'qty':{const l=cart.lines.find(l=>l.pid===d.id);if(l){l.qty+=+d.d;if(l.qty<=0)cart.lines=cart.lines.filter(x=>x!==l)}drawCart();drawGrid();break}
    case 'clear':cart.promo=null;cart.pass=null;cart.lines=[];cart.disc={t:'pct',v:0};cart.rewardPal=null;cart.event=null;drawCart();drawGrid();break;
    case 'disc':cart.disc={t:d.t,v:+d.v};drawCart();break;
    case 'cday':{const n=addDays(cart.slotDate,+d.d);if(n>=today()){cart.slotDate=n;drawCart()}break}
    case 'opencart':document.body.classList.add('cart-open');break;
    case 'closecart':document.body.classList.remove('cart-open');break;
    case 'pickclient':pickClient();break;
    case 'noclient':e.stopPropagation();cart.clientId=null;drawCart();break;
    case 'selclient':cart.clientId=d.id;closeModal();if(view==='caisse')drawCart();break;
    case 'pay':openPay();break;
    case 'addpay':{const rem=totals(cart).total-paid();if(rem>0){pay.list.push({m:d.m,amt:rem,given:null});renderPay()}break}
    case 'rmpay':pay.list.splice(+d.i,1);renderPay();break;
    case 'given':{const p=pay.list[+d.i];p.given=d.v===''?null:+d.v*100;renderPay();break}
    case 'confirm':confirmPay();break;
    case 'newclient':pickNew=!!d.pick;clientForm();break;
    case 'client':clientDetail(d.id);break;
    case 'sellclient':cart.clientId=d.id;closeModal();location.hash==='#caisse'?render():location.hash='caisse';break;
    case 'day':slotDay=d.d;({sjour:vStaffDay,apercu:vDay,resas:vResas,events:vEvents,bracelets:vBracelets})[tab[view]]($('#sub'));break;
    case 'slot':slotDetail(+d.m);break;
    case 'sellslot':cart.slotDate=slotDay;cart.slotM=+d.m;closeModal();location.hash==='#caisse'?render():location.hash='caisse';break;
    case 'newprod':prodForm('');break;
    case 'editprod':prodForm(d.id);break;
    case 'delprod':
      if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Confirmer';break}
      S.products=S.products.filter(p=>p.id!==d.id);cart.lines=cart.lines.filter(l=>l.pid!==d.id);save();closeModal();vProducts($('#sub'));toast('Produit supprimé');break;
    case 'ticket':{const s=S.sales.find(x=>x.id===d.id);if(s)showReceipt(s,false);break}
    case 'close-day':{
      const inp=$('#counted');const exp=+inp.dataset.exp;const cnt=inp.value.trim()?parseEur(inp.value):exp;
      S.closures.push({ts:Date.now(),expected:exp,counted:cnt,diff:cnt-exp});save();vReports($('#sub'));toast('Journée clôturée');break}
    case 'reset':
      if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Confirmer la réinitialisation';break}
      try{localStorage.removeItem(KEY)}catch(x){}init();cart=newCart();chrome();render();toast('Données de démonstration rechargées');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;drawGrid()}
  else if(t.id==='cq')drawClients(t.value);
  else if(t.id==='cpick')drawPick(t.value);
  else if(t.dataset.pay!==undefined){pay.list[+t.dataset.pay].amt=parseEur(t.value);updatePay()}
  else if(t.id==='counted'){const diff=(t.value.trim()?parseEur(t.value):+t.dataset.exp)-+t.dataset.exp;const el=$('#ecart');
    el.textContent=t.value.trim()?(diff===0?'Aucun écart.':'Écart de '+(diff>0?'+':'')+eur(diff)):'Saisissez le montant compté pour voir l’écart.';
    el.style.color=t.value.trim()?(diff===0?'var(--ok)':'var(--bad)'):''}
});
document.addEventListener('change',e=>{
  if(e.target.id==='slotsel'){cart.slotH=e.target.value===''?null:+e.target.value;drawCart()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='cform'){
    const c={id:uid(),name:$('#cn').value.trim(),phone:$('#cp').value.trim(),email:$('#ce').value.trim(),optin:$('#co').checked,pts:0,note:'',kid:'',rewards:[]};
    if(!c.name)return;S.clients.push(c);save();
    if(pickNew){cart.clientId=c.id;closeModal();if(view==='caisse')drawCart()}else{closeModal();if(view==='clients')vClients($('#sub'))}
    toast('Client ajouté');
  }else if(e.target.id==='pform'&&!e.target.dataset.plan){
    const id=e.target.dataset.id,o={name:$('#pn').value.trim(),cat:$('#pc').value,price:parseEur($('#pp').value),tva:+$('#pt').value,jumper:$('#pj').checked,active:$('#pa').checked};
    if(!o.name)return;
    if(pimg!==undefined)o.img=pimg||undefined;
    o.scat=$('#psub').value||undefined;
    if(id)Object.assign(prod(id),o);else S.products.push({id:uid(),...o});
    save();closeModal();vProducts($('#sub'));toast('Produit enregistré');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

init();migrateSubs();migrateQ();migrateR();migrateT();migrateV();migrateImgs();hoursInit();applySettings();cart=newCart();chrome();route();bootGate();
