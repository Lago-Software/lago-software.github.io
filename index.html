/* ---------- photo jointe au rapport d'incident ---------- */
.snatt{margin-top:16px;padding-top:14px;border-top:1px dashed rgba(29,79,215,.24)}
.snatt h4{margin:0 0 4px;font-size:14.5px;font-weight:680}
.snatt>.muted{font-size:13px;margin:0 0 10px;max-width:64ch}
.snths{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.snth{margin:0;width:120px}
.snth img{display:block;width:120px;height:160px;object-fit:cover;object-position:top;border-radius:12px;border:1px solid rgba(29,79,215,.18);box-shadow:var(--sh-blue);background:#fff}
.snth .btn{margin-top:8px;width:100%;min-height:0;padding:6px 8px;font-size:13px}
.snnote{margin:14px 0 0;font-size:12.5px;max-width:64ch}
/* =====================================================================
   v61 · planning staff : nouvelle apparence
   Blocs en teinte douce + trait de couleur sur le côté (la couleur de chaque personne
   reste son repère), grille très légère, en-têtes clairs, colonne « Équipe » en pastilles.
   Même HTML, mêmes actions : seulement le style.
   ===================================================================== */
:root{--pl-line:#E6ECF7;--pl-line2:#D5DEF0;--pl-ink:#0F1E3D}

/* ---- carte d'un jour ---- */
.dcard{position:relative;padding:20px 20px 16px;border-radius:24px;overflow:hidden}
.dcard::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--g-sun);opacity:.9}
.dch{align-items:center;margin-bottom:12px}
.dch h3{font-size:22px;letter-spacing:-.03em;margin:0}
.dtl{gap:10px}
.dgrid{gap:18px}

/* pastille « créneaux à renforcer » : douce, sans contour */
.plcov{border:0;font-weight:700;font-size:12px;padding:5px 11px;border-radius:999px}
.plcov.bad{background:color-mix(in srgb,#E04646 11%,#fff);color:#B42323}
.plcov.ok{background:color-mix(in srgb,#1F9D55 12%,#fff);color:#17733F}

/* barre d'outils du jour */
.dch .plbar{gap:12px}
.btn.plt{background:#fff;border:1px solid var(--pl-line2);box-shadow:0 1px 2px rgba(15,30,61,.05);font-weight:650;color:var(--b1)}
.btn.plt:hover{background:color-mix(in srgb,var(--b1) 6%,#fff)}
.late{font-size:13px;color:var(--muted)}

/* ---- la grille ---- */
.dtw{border:1px solid var(--pl-line);border-radius:18px;background:#fff;box-shadow:inset 0 1px 0 #fff;overflow-x:auto}
.dt{border-collapse:collapse;table-layout:fixed;min-width:540px}
.dt th,.dt td{border:1px solid var(--pl-line);padding:0}
.dt tr>*:first-child{border-left:0}
.dt tr>*:last-child{border-right:0}
.dt thead tr>*{border-top:0}
.dt tbody tr:last-child>*{border-bottom:0}
.dt td.jn{border-top:0}

/* en-têtes : pastille d'initiales + prénom */
.dt thead th{background:linear-gradient(180deg,#F8FAFF,#fff);border-bottom:2px solid var(--pl-line2);padding:11px 2px 9px;color:var(--pl-ink);font-weight:700;font-size:12.5px;vertical-align:bottom}
.dt thead th .pav{width:30px;height:30px;font-size:11.5px;margin:0 auto 6px;box-shadow:0 0 0 3px #fff,0 0 0 4px color-mix(in srgb,currentColor 12%,transparent),0 3px 8px -2px rgba(15,30,61,.25)}
.dt thead th .pnm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.dt thead th.lv{opacity:.5}

/* colonne des heures */
.dt .slc{background:#F8FAFF;color:var(--muted);font-weight:650;font-size:12px;box-shadow:none;border-right:1px solid var(--pl-line2);text-align:right;padding:0 10px 0 6px;width:66px;font-variant-numeric:tabular-nums}
.dt thead .slc{background:#F8FAFF}
/* lignes de 2 h : un trait un peu plus doux pour guider l'œil */
.dt tbody tr:nth-child(even)>td{background-image:linear-gradient(rgba(29,79,215,.018),rgba(29,79,215,.018))}

/* colonne « Équipe » */
.dt th.cv,.dt td.cv{width:66px;background:#F8FAFF;border-left:1px solid var(--pl-line2);text-align:center}
.dt thead th.cv{font-size:11.5px;color:var(--muted);font-weight:650}
.dt td.cv .pill{min-width:30px;height:26px;padding:0 9px;justify-content:center;font-weight:750;font-size:13px;border:0;border-radius:999px}
.dt td.cv .pill.ok{background:color-mix(in srgb,#1D4FD7 8%,#fff);color:var(--b1)}
.dt td.cv .pill.warn{background:color-mix(in srgb,#FF7A1A 16%,#fff);color:#B24A00}
.dt td.cv .pill.bad{background:color-mix(in srgb,#E04646 14%,#fff);color:#B42323}

/* ---- les blocs de présence ---- */
.pc{height:44px;min-height:44px}
.pc.w::before,.pc.g::before{
  left:5px;right:5px;
  --bar:var(--c);--edge:color-mix(in srgb,var(--c) 38%,#fff);
  background:color-mix(in srgb,var(--c) 17%,#fff);
  box-shadow:inset 4px 0 0 var(--bar),inset -1px 0 0 var(--edge);
}
/* le contour ne se referme qu'en haut du bloc et en bas du bloc : pas de trait entre deux créneaux */
.dt td.bs .pc::before{box-shadow:inset 4px 0 0 var(--bar),inset -1px 0 0 var(--edge),inset 0 1px 0 var(--edge)}
.dt td.be .pc::before{box-shadow:inset 4px 0 0 var(--bar),inset -1px 0 0 var(--edge),inset 0 -1px 0 var(--edge)}
.dt td.bs.be .pc::before{box-shadow:inset 4px 0 0 var(--bar),inset -1px 0 0 var(--edge),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge)}
.dt td.bs{--ts:5px}
.dt td.be{--bt:5px}
.dt td.bs .pc::before{border-top-left-radius:10px;border-top-right-radius:10px}
.dt td.be .pc::before{border-bottom-left-radius:10px;border-bottom-right-radius:10px}
/* bloc continu : pas de trait entre deux créneaux du même bloc */
.dt td.jn .pc::before{border-top:0}
.pc.w:hover,.pc.g:hover{filter:none;background:transparent}
.pc.w:hover::before{background:color-mix(in srgb,var(--c) 26%,#fff)}
.pc .bl{left:15px;right:8px;top:calc(var(--e,var(--ts,0px)) + 7px);font-size:11.5px;font-weight:750;letter-spacing:-.005em;color:color-mix(in srgb,var(--c) 28%,var(--pl-ink))!important}
.pc.g .bl{color:color-mix(in srgb,var(--c) 22%,#6B7592)!important;font-weight:700}
/* gestion : hachures légères */
.pc.g::before{
  --bar:color-mix(in srgb,var(--c) 70%,#fff);--edge:color-mix(in srgb,var(--c) 34%,#fff);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,#fff) 0 6px,color-mix(in srgb,var(--c) 9%,#fff) 6px 12px)}
/* case vide au survol */
.pc:not(.w):not(.g):not(.ro):not(.off):hover{background:color-mix(in srgb,var(--b1) 6%,#fff)}
.pc:not(.w):not(.g):not(.ro):not(.off):hover::after{color:var(--b1);font-weight:500}
/* en congé */
.pc.off{background:repeating-linear-gradient(135deg,#F3F6FC 0 5px,#EAEFF9 5px 10px);opacity:1}
.dt td:has(.pc.off){background:#F3F6FC}

/* ---- notes d'horaires particuliers ---- */
.plcuts{gap:8px;margin-top:12px}
.plcut{padding:6px 12px 6px 9px;border:1px solid var(--pl-line2);background:#fff;font-size:13px;color:var(--pl-ink);box-shadow:0 1px 2px rgba(15,30,61,.04)}
.plcut i{width:9px;height:9px}
.plcut b{font-weight:700}
.plcut em{color:var(--b1);font-weight:700;background:color-mix(in srgb,var(--b1) 8%,#fff);padding:1px 7px;border-radius:999px;font-size:12px}

/* ---- vue de la semaine ---- */
.wkc{border-radius:22px;padding:16px 20px}
.wkh h3{font-size:18px}
.wk{border-spacing:5px}
.wk th{font-size:11.5px;color:var(--muted);font-weight:650}
.wkd{font-weight:750;color:var(--pl-ink);border-radius:12px}
.wkd:hover{background:color-mix(in srgb,var(--b1) 8%,#fff)}
.wn{height:34px;border-radius:11px;font-size:14px;font-weight:750}
.wn.ok{background:color-mix(in srgb,#1D4FD7 8%,#fff);color:var(--b1)}
.wn.warn{background:color-mix(in srgb,#FF7A1A 17%,#fff);color:#B24A00}
.wn.bad{background:color-mix(in srgb,#E04646 14%,#fff);color:#B42323}
.wk td.no{line-height:34px}

/* ---- totaux d'heures par personne ---- */
.tts{gap:12px}
.tt{background:#fff;border:1px solid var(--pl-line);border-radius:18px;padding:14px 16px 20px;box-shadow:0 1px 2px rgba(15,30,61,.04)}
.tt .pav{width:40px;height:40px;box-shadow:0 0 0 3px #fff,0 3px 8px -2px rgba(15,30,61,.25)}
.tt small{color:var(--muted);font-weight:650;font-size:13px}
.tt b{font-size:23px;color:var(--pl-ink)}
.tbar{left:16px;right:16px;bottom:9px;height:5px;background:#EDF1FA}
.tbar::after{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff))}

/* ---- fenêtre « Horaires » ---- */
.pltf .plr{padding:12px 0}
.pltf .plr .plwho i{width:14px;height:14px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,#fff),0 0 0 4px var(--pl-line)}
.pltf .plr select{border-radius:12px}
.pltf .plr .plrule{grid-column:1/-1;font-size:12.5px;color:var(--b1);font-weight:600}

/* ---- téléphone ---- */
@media (max-width:560px){
  .dcard{padding:16px 12px 12px;border-radius:20px}
  .dch h3{font-size:20px}
  .dt{min-width:520px}
  .dt .slc{width:56px;padding:0 8px 0 4px;font-size:11.5px}
  .dt th.cv,.dt td.cv{width:56px}
  .dt thead th .pav{width:28px;height:28px}
  .pc{height:42px;min-height:42px}
  .pc .bl{font-size:11px;left:13px}
}

/* ---- fin habituelle (Paramètres › Équipe) et fenêtre dédiée ---- */
.btn.plend{padding:6px 12px;font-size:13px;min-height:0;gap:6px;white-space:nowrap;background:#fff;border:1px solid var(--pl-line2);color:var(--muted);font-weight:650}
.btn.plend svg{width:15px;height:15px}
.btn.plend.on{color:var(--b1);border-color:color-mix(in srgb,var(--b1) 35%,#fff);background:color-mix(in srgb,var(--b1) 6%,#fff)}
#stendform .ster{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair)}
#stendform .ster:last-of-type{border-bottom:0}
#stendform .ster b{min-width:96px}
#stendform .ster select{flex:1;max-width:220px}
@media (max-width:640px){#sub .row:has(.plend){flex-wrap:wrap}#sub .row .plend{order:9}}

/* ---- image personnalisée en haut d'un rapport ---- */
.chero{position:relative}
.chero .chctl{position:absolute;top:8px;right:10px;display:flex;gap:6px;z-index:2}
.chero .chctl .btn{padding:5px 10px;font-size:12px;min-height:0;gap:5px;background:rgba(255,255,255,.92);border:1px solid var(--pl-line2);box-shadow:0 1px 3px rgba(15,30,61,.12);font-weight:650;color:var(--pl-ink)}
.chero .chctl .btn svg{width:14px;height:14px}
.chero.has-img{min-height:132px;background-size:cover;background-position:center;border:0;color:#fff;overflow:hidden;padding:22px 20px;box-shadow:0 10px 30px -14px rgba(10,31,77,.55)}
.chero.has-img::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,40,.82) 0%,rgba(7,16,40,.45) 55%,rgba(7,16,40,.08) 100%)}
.chero.has-img>*{position:relative}
.chero.has-img>.chctl{position:absolute}
.chero.has-img h2,.chero.has-img p{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.chero.has-img .streak{background:rgba(255,255,255,.92);color:var(--pl-ink)}
@media (max-width:560px){.chero .chctl{top:6px;right:6px}.chero.has-img{min-height:116px;padding:30px 14px 16px}.chero .chctl .btn span{display:none}.chero .chctl .btn.chrm span{display:inline}}

/* ---- maintenance : nature de l'intervention ---- */
.mkinds{border:0;margin:0 0 16px;padding:0;min-width:0}
.mkinds legend{font-weight:700;font-size:14px;margin:0 0 8px;padding:0;color:var(--pl-ink)}
.mkrow{display:flex;flex-wrap:wrap;gap:8px}
.mk{display:inline-flex;align-items:center;gap:8px;padding:9px 15px 9px 12px;min-height:44px;border-radius:999px;border:1.5px solid var(--pl-line2);background:#fff;font-weight:650;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.mk input{width:18px;height:18px;margin:0;accent-color:var(--b1);flex:none}
.mk:hover{border-color:color-mix(in srgb,var(--b1) 45%,#fff)}
.mk:has(input:checked){background:color-mix(in srgb,var(--b1) 9%,#fff);border-color:var(--b1);color:var(--b1)}
.mk:has(input:focus-visible){box-shadow:var(--ring)}
.mkold{margin:8px 0 0;font-size:13px}

/* bloc continu : la ligne de séparation ne traverse pas le bloc */
.dt td.bs:not(.be),.dt td.jn:not(.be){border-bottom-color:transparent}

/* ---- assistant « Mise en norme de la caisse » ---- */
.cfw{margin-bottom:14px;padding:20px 22px}
.cfwh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cfwh h3{margin:0 0 4px;font-size:19px}
.cfwh p{margin:0;font-size:14px}
.cfwp{flex:none;font-weight:800;font-size:15px;padding:6px 13px;border-radius:999px;background:color-mix(in srgb,var(--b1) 9%,#fff);color:var(--b1);font-variant-numeric:tabular-nums}
.cfwp.ok{background:color-mix(in srgb,#1F9D55 14%,#fff);color:#17733F}
.cfwbar{height:8px;border-radius:99px;background:#EDF1FA;margin:14px 0 6px;overflow:hidden}
.cfwbar i{display:block;height:100%;border-radius:99px;background:var(--g-sun);transition:width .4s var(--ease,ease)}
.cfwl{list-style:none;margin:0;padding:0}
.cfwl li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--pl-line)}
.cfwl li:last-child{border-bottom:0}
.cfwi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#fff;border:2px solid var(--b1);color:var(--b1);align-self:start}
.cfwi svg{width:16px;height:16px}
li.ok .cfwi{background:#1F9D55;border-color:#1F9D55;color:#fff}
li.wait .cfwi{border-color:var(--pl-line2);color:var(--muted);background:#F8FAFF}

/* ---------- v68 : un seul langage d'animation, le même que sur le site vitrine ----------
   Mêmes courbes, mêmes effets : apparition qui monte, « pop » à l'ajout, soulèvement au survol, reflet sur le bouton d'encaissement,
   halo qui respire. Uniquement transform / opacité (pas de recalcul de mise en page), tout est coupé si l'appareil demande moins d'animations. */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.2,1)}
@keyframes moPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes moBump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes moLine{from{opacity:0;transform:translate3d(-14px,0,0)}to{opacity:1;transform:none}}
@keyframes moRise{from{opacity:0;transform:translate3d(0,26px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes moDrift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(36px,-26px,0) scale(1.08)}}
@keyframes moFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-6px,0)}}
@keyframes moSheen{0%{transform:translate3d(-130%,0,0) skewX(-18deg)}50%,100%{transform:translate3d(300%,0,0) skewX(-18deg)}}
@keyframes moDraw{to{stroke-dashoffset:0}}
@keyframes moPing{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.4);opacity:0}}

/* l'élément qui vient d'être ajouté ou modifié (posé par le code, une seule fois) */
.mo-pop{animation:moPop .4s var(--ease) both}
.mo-bump{animation:moBump .34s var(--ease)}
.mo-line{animation:moLine .38s var(--ease) both}

/* retour au toucher : toutes les touches répondent, même sur tablette */
.tile,.btn,.btn-pay,.chip,.pick,.step button,.gbtn,.mt-main,.mn,.ms-t,.nav a{transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .25s,border-color .25s,color .25s,filter .2s}
.tile:active{transform:scale(.965);transition-duration:.12s}
.btn:active,.btn-pay:active,.chip:active,.pick:active,.gbtn:active,.mt-main:active{transform:scale(.97);transition-duration:.12s}
.step button:active{transform:scale(.88);transition-duration:.1s}

/* souris : soulèvement et inclinaison, comme les tuiles du site */
@media (hover:hover) and (pointer:fine){
  .tile:hover{transform:translate3d(0,-5px,0);box-shadow:0 26px 50px -18px rgba(29,79,215,.38),0 0 0 1px rgba(29,79,215,.14)}
  .tile:active:hover{transform:scale(.965)}
  .tile .art{transition:transform .5s var(--ease)}
  .tile:hover .art{transform:scale(1.07)}
  .btn-pay:not(:disabled):hover,.gbtn:hover,.hero .btn.primary:hover{transform:translate3d(0,-2px,0);filter:brightness(1.05)}
  .mt-main:hover{transform:translate3d(0,-4px,0)}
  .mt-ic{transition:transform .35s var(--ease)}
  .mt:hover .mt-ic{transform:scale(1.12) rotate(-7deg)}
  .mn .mi{transition:transform .35s var(--ease),background .25s,color .25s,box-shadow .25s}
  .mn:hover .mi{transform:scale(1.1) rotate(-6deg)}
  .nav a:hover{transform:translate3d(3px,0,0)}
}

/* ticket : la ligne glisse, la quantité rebondit, le total roule (voir chunkMO.js) */
.cl .step b{display:inline-block}
.r.big .num{display:inline-block;font-variant-numeric:tabular-nums}

/* bouton d'encaissement : un reflet passe de temps en temps quand il est utilisable */
.btn-pay:not(:disabled){position:relative;overflow:hidden;isolation:isolate}
.btn-pay:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:translate3d(-130%,0,0) skewX(-18deg);animation:moSheen 5.5s var(--ease-io) 1.4s infinite;pointer-events:none;z-index:1}

/* confirmation d'encaissement : coche qui se dessine, halo qui part */
.success{position:relative}
.success svg{animation:moPop .5s var(--ease) both}
.success svg path{stroke-dasharray:32;stroke-dashoffset:32;animation:moDraw .45s .18s var(--ease) forwards}
.toast.show{animation:moPop .42s var(--ease) both}

/* accueil : la bannière respire (deux halos qui dérivent lentement) */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";display:block;position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.hero::before{right:-70px;top:-120px;width:420px;height:420px;background:radial-gradient(closest-side,rgba(255,255,255,.24),transparent 72%);animation:moDrift 18s ease-in-out infinite}
.hero::after{right:160px;bottom:-190px;width:380px;height:380px;background:radial-gradient(closest-side,rgba(255,138,43,.34),transparent 72%);animation:moDrift 22s ease-in-out infinite reverse}

/* écran de connexion : la carte arrive, le logo flotte */
#gate .gcard{animation:moRise .55s var(--ease) both}
#gate .glogo .lmark{animation:moFloat 6s ease-in-out infinite}

/* défilement : les blocs sous la ligne de flottaison apparaissent en montant (navigateurs qui savent le faire, comme sur le site) */
/* la plage est limitée à 240 px et ne dépasse jamais la hauteur du bloc : un petit bloc tout en bas de page est donc toujours révélé en entier */
@supports (animation-timeline:view()) and (animation-range:entry 0% entry min(100%,240px)){
  #main>*:nth-child(n+5){animation:moRise linear both;animation-timeline:view();animation-range:entry 0% entry min(100%,240px)}
}

/* appareils qui demandent moins d'animations : tout est immobile */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .success svg path{stroke-dashoffset:0}
}
