<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.firebasedatabase.app https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com http://localhost:*; base-uri 'none'; form-action 'none'">
<title>Console Lago</title>
<style>
:root{--brand:#1D4FD7;--ink:#0A1F4D;--muted:#566785;--line:#D7DFEE;--soft:#F3F6FC;--ok:#1C8553;--bad:#C63A3A;--warn:#B85408;--bg:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.012em;font-weight:680}
h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}
p{margin:0 0 10px}
a{color:var(--brand)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FA2F5;outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:650}
.brand img{height:30px;display:block}
.brand span{padding-left:10px;border-left:1px solid var(--line);color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.who b{font-weight:600;color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:26px 20px 70px}
.narrow{max-width:620px}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.bar p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#1742B8}
.btn.dng{color:var(--bad);border-color:#EBC3C3}
.btn.dng:hover{background:#FDF1F1}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:600;text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.box{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px;background:#fff}
.box>h3{margin-bottom:8px}
.box.warn{background:#FFF8EF;border-color:#F2D3B0}
.box.okb{background:#F2FAF6;border-color:#BFE3D0}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=url],textarea{width:100%;padding:10px 12px;border:1px solid #B9C6E0;border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
textarea.t1{min-height:74px;font:inherit}
input[readonly],textarea[readonly]{background:var(--soft)}
.ol{margin:0 0 12px;padding:0 0 0 20px}
.ol li{margin:0 0 6px}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .nm{background:none;border:0;padding:0;text-align:left;font-weight:650;font-size:15px;cursor:pointer;color:var(--ink)}
.tbl .nm:hover{color:var(--brand);text-decoration:underline}
.tbl .sub{display:block;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:#8FA0BF}
.pill.ok{background:#E8F6EE;color:var(--ok)}.pill.ok:before{background:var(--ok)}
.pill.wait{background:#EAF0FD;color:var(--brand)}.pill.wait:before{background:var(--brand)}
.pill.susp{background:#FFF0E0;color:var(--warn)}.pill.susp:before{background:var(--warn)}
.pill.off{background:#FCEBEB;color:var(--bad)}.pill.off:before{background:var(--bad)}
.pill.upd{background:#FFF0E0;color:var(--warn)}.pill.upd:before{display:none}
.stp{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none;flex-wrap:wrap}
.stp li{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:13px;font-weight:600}
.stp li i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#C9D5EE;color:#fff;display:grid;place-items:center;font-size:12px}
.stp li.on{background:var(--brand);color:#fff}.stp li.on i{background:#fff;color:var(--brand)}
.stp li.done{color:var(--ok);background:#E8F6EE}.stp li.done i{background:var(--ok)}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:0 0 14px}
.tpl{display:block;text-align:left;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer}
.tpl:hover{border-color:#9DB4EC}
.tpl[aria-pressed=true]{border-color:var(--brand);background:#F4F7FE}
.tpl b{display:block}
.tpl span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chk{list-style:none;margin:10px 0 0;padding:0}
.chk li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:var(--ok)}
.chk .x .m{background:var(--bad)}
.chk b{display:block;font-weight:600}
.chk span{display:block;font-size:13px;color:var(--muted)}
.qr{display:inline-block;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px;line-height:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,92vw);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 8px 28px rgba(10,31,77,.28)}
.toast.err{background:#9B2C2C}
.sk{color:var(--muted);padding:30px 0}
.back{margin:0 0 14px}
.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.bk:first-of-type{border-top:0}
.sr{position:absolute;left:-9999px}
@media (max-width:760px){
 .top{padding:10px 14px}.who b{display:none}
 main{padding:20px 14px 60px}
 .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl{border:0}.tbl thead{display:none}
 .tbl tr{border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:6px 4px}
 .tbl td{border:0;padding:4px 12px}
 .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- Firebase (REST) ---------- */
async function jf(url,opt,ms){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms||12000);
  try{
    const r=await fetch(url,Object.assign({signal:ac.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'},opt||{}));
    let d=null;try{d=await r.json()}catch(e){}
    return{ok:r.ok,status:r.status,d};
  }catch(e){return{ok:false,status:0,d:null,err:e&&e.name==='AbortError'?'timeout':'net'}}
  finally{clearTimeout(t)}
}
const AERR=[['EMAIL_EXISTS','Ce compte existe déjà dans ce projet.'],['INVALID_LOGIN_CREDENTIALS','E-mail ou mot de passe incorrect.'],['INVALID_PASSWORD','E-mail ou mot de passe incorrect.'],['EMAIL_NOT_FOUND','E-mail ou mot de passe incorrect.'],
 ['OPERATION_NOT_ALLOWED','La connexion par e-mail et mot de passe n’est pas activée : Authentication › Méthode de connexion › E-mail/Mot de passe › Activer.'],
 ['TOO_MANY_ATTEMPTS','Trop d’essais : patientez quelques minutes.'],['WEAK_PASSWORD','Mot de passe trop court (6 caractères minimum).'],['USER_DISABLED','Ce compte est désactivé.'],
 ['API key','Clé API refusée : recopiez la configuration Firebase du bon projet.'],['API_KEY','Clé API refusée : recopiez la configuration Firebase du bon projet.'],['INVALID_EMAIL','Adresse e-mail non valide.'],['CONFIGURATION_NOT_FOUND','Authentication n’est pas activée dans ce projet (Build › Authentication › Commencer).']];
const afr=(code,r)=>{if(!code)return r&&r.err==='timeout'?'Firebase ne répond pas : réessayez.':'Pas de connexion à Firebase : vérifiez le réseau.';const k=AERR.find(a=>code.indexOf(a[0])>=0);return k?k[1]:'Erreur Firebase : '+String(code).slice(0,120)};
async function authCall(key,ep,body){
  const r=await jf(AUTH+'accounts:'+ep+'?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({returnSecureToken:true},body))});
  if(r.ok&&r.d&&r.d.idToken)return{ok:true,idToken:r.d.idToken,refreshToken:r.d.refreshToken,uid:r.d.localId,exp:Date.now()+(parseInt(r.d.expiresIn,10)||3600)*1000};
  return{ok:false,code:(r.d&&r.d.error&&r.d.error.message)||'',r};
}
async function tokenOf(s){
  if(Date.now()<s.exp-90000)return s.idToken;
  const r=await jf(TOKU+'?key='+encodeURIComponent(s.k),{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refreshToken)});
  if(r.ok&&r.d&&r.d.id_token){s.idToken=r.d.id_token;s.refreshToken=r.d.refresh_token||s.refreshToken;s.exp=Date.now()+(parseInt(r.d.expires_in,10)||3600)*1000;return s.idToken}
  throw new Error('Session expirée : reconnectez-vous.');
}
/* s = session (compte) ou null (sans compte) */
async function db(u,s,method,path,body,extra){
  const qs=[];if(s)qs.push('auth='+encodeURIComponent(await tokenOf(s)));if(extra)qs.push(extra);
  const o={method};if(body!==undefined){o.body=JSON.stringify(body);o.headers={'content-type':'application/json'}}
  return jf(u.replace(/\/+$/,'')+'/'+path+'.json'+(qs.length?'?'+qs.join('&'):''),o);
}
const denied=r=>r.status===401||r.status===403;
const URLOK=u=>/^https:\/\/[a-z0-9.-]+\.(firebasedatabase\.app|firebaseio\.com)$/i.test(u)||(LOCAL&&/^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(u));
function parseCfg(t){
  const g=k=>{const m=new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']').exec(t||'');return m?m[1].trim():''};
  let u=g('databaseURL').replace(/\/+$/,''),pid=g('projectId'),guess=false;
  if(!u&&pid){u='https://'+pid+'-default-rtdb.firebaseio.com';guess=true}
  return{k:g('apiKey'),u,pid,guess};
}

/* ---------- règles de sécurité ---------- */
const UIDOK=/^[A-Za-z0-9]{10,64}$/;
const rulesOwner=uid=>JSON.stringify({rules:{'.read':`auth != null && auth.uid === '${uid}'`,'.write':`auth != null && auth.uid === '${uid}'`}},null,2);
function rulesClient(r,uid){
  const own=`auth != null && auth.uid === '${uid}'`;
  return JSON.stringify({rules:{
    '.read':false,'.write':false,
    [r]:{'.read':true,'.write':true},
    '_susp':{'.read':true,'.write':own,
      'on':{'.validate':'newData.isBoolean()'},
      'msg':{'.validate':'newData.isString() && newData.val().length <= 300'},
      't':{'.validate':'newData.isNumber()'},
      '$other':{'.validate':false}},
    '_owner':{'.read':own,'.write':own},
    '_bk':{'.read':own,'.write':own}
  }},null,2);
}

/* ---------- registre (projet Firebase du propriétaire) ---------- */
const rdb=(m,p,b,x)=>db(ST.reg.u,ST.rs,m,p,b,x);
async function loadClients(){
  const r=await rdb('GET','clients');
  if(denied(r))throw new Error('Accès refusé par le registre : les règles ne sont pas appliquées, ou ce compte n’est pas le propriétaire.');
  if(!r.ok)throw new Error(afr('',r));
  ST.clients=Object.values(r.d||{}).filter(c=>c&&c.id).sort((a,b)=>(b.at||0)-(a.at||0));
}
async function putClient(c){
  const r=await rdb('PUT','clients/'+c.id,c,'print=silent');
  if(!r.ok)throw new Error(denied(r)?'Le registre refuse l’écriture (règles).':afr('',r));
}
async function liveOf(c){
  const o={t:Date.now()};
  const a=await db(c.u,null,'GET','_susp');
  if(a.status===0||(!a.ok&&!denied(a))){o.err=1;return o}
  if(denied(a)){o.err=2;return o}
  o.susp=!!(a.d&&a.d.on===true);o.msg=(a.d&&a.d.msg)||'';
  if(c.ready){
    const b=await db(c.u,null,'GET',c.r,undefined,'shallow=true');
    o.opened=!!(b.ok&&b.d);
    if(o.opened){const t=await db(c.u,null,'GET',c.r+'/settings/tpl');if(t.ok&&t.d&&typeof t.d==='object')o.tpl={id:t.d.id,v:t.d.v,at:t.d.at}}
  }
  return o;
}
async function loadLive(){
  const q=ST.clients.filter(c=>!ST.live[c.id]);
  await Promise.all(Array.from({length:4},async()=>{while(q.length){const c=q.shift();ST.live[c.id]=await liveOf(c);if(ST.view==='list'||ST.view==='detail')draw()}}));
}
function statusOf(c){
  const l=ST.live[c.id];
  if(!c.ready)return['prep','À terminer'];
  if(!l)return['wait','Vérification…'];
  if(l.err)return['off','Injoignable'];
  if(l.susp)return['susp','Suspendu'];
  if(!l.opened)return['wait','Lien non ouvert'];
  return['ok','Actif'];
}
async function csess(c){
  let s=ST.cs[c.id];if(s)return s;
  const r=await authCall(c.k,'signInWithPassword',{email:ST.own.email,password:ST.own.pw});
  if(!r.ok)throw new Error(afr(r.code,r.r));
  s=ST.cs[c.id]={u:c.u,k:c.k,idToken:r.idToken,refreshToken:r.refreshToken,uid:r.uid,exp:r.exp};
  return s;
}

/* ---------- contrôles de sécurité (lecture seule, sans effet durable) ---------- */
async function runChecks(c){
  const out=[],add=(ok,t,d)=>out.push({ok,t,d});
  let r=await db(c.u,null,'GET','',undefined,'shallow=true');
  if(r.status===0)add(false,'Base joignable','Impossible de joindre la base : vérifiez son adresse.');
  else if(denied(r))add(true,'La base entière est fermée sans autorisation','Personne ne peut la parcourir ni la lister.');
  else add(false,'La base est ouverte à tous','Les règles de sécurité ne sont pas appliquées : collez les règles ci-dessous dans Firebase.');
  r=await db(c.u,null,'GET',c.r,undefined,'shallow=true');
  add(r.ok,'Le lien du client fonctionne',r.ok?'Les appareils qui possèdent le lien peuvent lire et écrire leurs données.':'Le chemin du client n’est pas accessible : vérifiez les règles.');
  r=await db(c.u,null,'GET','zz-sonde');
  let r2=await db(c.u,null,'PUT','zz-sonde',1);
  if(r2.ok)await db(c.u,null,'DELETE','zz-sonde');
  add(denied(r)&&denied(r2),'Aucun autre chemin n’est accessible',denied(r)&&denied(r2)?'Seul le chemin du client est ouvert, avec son identifiant secret.':'Un chemin hors du client est lisible ou modifiable sans compte.');
  r=await db(c.u,null,'GET','_susp');
  add(r.ok,'L’état de suspension est lisible par Lago',r.ok?'Lago peut vérifier si l’espace est suspendu.':'Sans cette lecture, la suspension ne peut pas être appliquée.');
  const cur=r.ok?r.d:null;
  r2=await db(c.u,null,'PUT','_susp',cur===null?{on:false}:cur);
  if(r2.ok&&cur===null)await db(c.u,null,'DELETE','_susp');
  add(denied(r2),'Seul le propriétaire peut suspendre',denied(r2)?'Écrire dans l’état de suspension exige votre compte.':'N’importe qui peut modifier la suspension : les règles ne sont pas appliquées.');
  r=await db(c.u,null,'GET','_owner');r2=await db(c.u,null,'GET','_bk');
  add(denied(r)&&denied(r2),'Zone propriétaire et sauvegardes verrouillées',denied(r)&&denied(r2)?'Illisibles sans votre compte.':'La zone propriétaire est lisible sans compte.');
  let s=null,err='';
  try{s=await csess(c)}catch(e){err=e.message}
  if(!s)add(false,'Compte propriétaire',err||'Connexion impossible.');
  else{
    const w=await db(c.u,s,'GET','_owner');
    const w2=await db(c.u,s,'PUT','_susp',cur===null?{on:false,t:Date.now()}:cur);
    add(w.ok&&w2.ok,'Le compte propriétaire a la main',w.ok&&w2.ok?'Lecture de la zone propriétaire et écriture de la suspension : OK.':'Votre compte n’est pas reconnu par les règles : vérifiez que l’identifiant propriétaire des règles correspond à ce projet.');
  }
  return out;
}

function draw(){
  const ae=document.activeElement,id=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  const v=ST.view;
  app.innerHTML=head()+(v==='boot'?'<main><p class="sk">Chargement…</p></main>':v==='setup'?vSetup():v==='login'?vLogin():v==='list'?vList():v==='detail'?vDetail():vWiz());
  if(id){const e=document.getElementById(id);if(e){e.focus();try{if(ss!=null&&e.type!=='email'&&e.type!=='password')e.setSelectionRange(ss,se)}catch(x){}}}
}
async function act(fn,msg){
  if(ST.busy)return;ST.busy=msg||'…';draw();
  try{await fn()}catch(e){toast(e&&e.message?e.message:'Erreur inattendue',true)}
  ST.busy='';draw();
}
const go=v=>{ST.view=v;window.scrollTo(0,0);draw()};

}
async function backup(c,download){
  const s=await csess(c),r=await db(c.u,null,'GET',c.r);
  if(!r.ok)throw new Error('Lecture des données impossible.');
  if(r.d==null)throw new Error('Cet espace est encore vide : rien à sauvegarder.');
  const d=new Date(),k=`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
  const w=await db(c.u,s,'PUT','_bk/'+k,{t:d.getTime(),d:r.d},'print=silent');
  if(!w.ok)throw new Error('Écriture de la sauvegarde refusée par Firebase (règles ?).');
  const l=await db(c.u,s,'GET','_bk',undefined,'shallow=true');
  const keys=l.ok&&l.d?Object.keys(l.d).sort():[];
  for(const old of keys.slice(0,Math.max(0,keys.length-10)))await db(c.u,s,'DELETE','_bk/'+old,undefined,'print=silent');
  ST.bks[c.id]=keys.slice(-10).reverse();
  if(download){dlBackup(c,r.d,k);toast('Sauvegarde faite (serveur et fichier).')}
}
async function listBk(c){
  const s=await csess(c),l=await db(c.u,s,'GET','_bk',undefined,'shallow=true');
  if(!l.ok)throw new Error('Lecture des sauvegardes refusée (règles ?).');
  ST.bks[c.id]=Object.keys(l.d||{}).sort().reverse();
}
function dlBackup(c,data,k){save('lago-sauvegarde-'+(slug(c.name)||'client')+'-'+k+'.json',JSON.stringify({lagoSauvegarde:1,client:c.name,room:c.r,date:k,data}))}

/* ---------- événements ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(f){e.preventDefault();Promise.resolve(f(b)).catch(x=>toast(x&&x.message||'Erreur',true))}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='w_name'||t.id==='w_note'||t.id==='w_cfg'||t.id==='w_url')wzRead();
  if(t.id==='su_cfg')ST.su.txt=t.value;
  if(t.id==='sp_msg')ST.spMsg=t.value;
});
app.addEventListener('change',async e=>{
  const t=e.target;if(!(t&&t.type==='file'&&t.files&&t.files[0]))return;
  const f=t.files[0];t.value='';
  let j;try{j=JSON.parse(await f.text())}catch(x){toast('Fichier illisible.',true);return}
  if(t.id==='imp_f'){
    const L=j&&Array.isArray(j.clients)?j.clients.filter(c=>c&&/^c[a-z0-9]{6,20}$/.test(c.id||'')&&c.u&&c.r&&c.k&&URLOK(c.u)&&/^[\w-]{3,64}$/.test(c.r)):[];
    if(!L.length){toast('Aucun client valide dans ce fichier.',true);return}
    if(!confirm('Importer '+L.length+' client'+(L.length>1?'s':'')+' dans cette console ? Les fiches de même identifiant seront remplacées.'))return;
    await act(async()=>{for(const c of L)await putClient({id:c.id,name:String(c.name||'Client').slice(0,60),t:c.t,tv:c.tv,at:c.at,u:c.u,k:c.k,pid:c.pid||'',r:c.r,ou:c.ou||'',note:String(c.note||'').slice(0,1000),ready:!!c.ready});await loadClients();ST.live={};loadLive();toast('Liste importée.')});
  }else if(t.id==='bk_f'){
    const c=cur(),d=j&&j.lagoSauvegarde&&j.data;
    if(!c||!d||typeof d!=='object'){toast('Ce fichier n’est pas une sauvegarde Lago.',true);return}
    if(j.room!==c.r){toast('Cette sauvegarde appartient à un autre espace client.',true);return}
    if(prompt('Restaurer ce fichier remplace TOUTES les données actuelles de « '+c.name+' ». Une sauvegarde de l’état actuel est faite avant.\nPour confirmer, tapez le nom du client :')!==c.name){toast('Restauration annulée.');return}
    await act(async()=>{await backup(c,false);const w=await db(c.u,null,'PUT',c.r,d,'print=silent');if(!w.ok)throw new Error('Restauration refusée par Firebase.');toast('Sauvegarde restaurée.')},'Restauration…');
  }
});
app.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='lg_f'){
    const em=document.getElementById('lg_em').value.trim(),pw=document.getElementById('lg_pw').value;ST.lgEm=em;
    await act(async()=>{
      const a=await authCall(ST.reg.k,'signInWithPassword',{email:em,password:pw});
      if(!a.ok)throw new Error(afr(a.code,a.r));
      ST.own={email:em,pw};ST.rs={u:ST.reg.u,k:ST.reg.k,idToken:a.idToken,refreshToken:a.refreshToken,uid:a.uid,exp:a.exp};
      try{await startList()}catch(x){ST.own=null;ST.rs=null;throw x}
    },'Connexion…');
  }else if(f.id==='su_f'){
    const em=document.getElementById('su_em').value.trim(),pw=document.getElementById('su_pw').value;ST.su.email=em;
    if(pw.length<12){toast('Mot de passe : 12 caractères minimum.',true);return}
    await act(async()=>{
      let a=await authCall(ST.su.cfg.k,'signUp',{email:em,password:pw});
      if(!a.ok&&/EMAIL_EXISTS/.test(a.code))a=await authCall(ST.su.cfg.k,'signInWithPassword',{email:em,password:pw});
      if(!a.ok)throw new Error(afr(a.code,a.r));
      if(!UIDOK.test(a.uid||''))throw new Error('Identifiant de compte inattendu.');
      ST.su.uid=a.uid;ST.su.pw=pw;ST.su.s={u:ST.su.cfg.u,k:ST.su.cfg.k,idToken:a.idToken,refreshToken:a.refreshToken,uid:a.uid,exp:a.exp};
    },'Création…');
  }
});

/* ---------- démarrage ---------- */
ST.view=ST.reg?'login':'setup';
draw();
})();
</script>
